<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Arcade</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  background: #111;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#game-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  flex: 1;
  min-height: 0;
}

canvas {
  display: block;
  border: 3px solid #444;
  border-radius: 4px;
  touch-action: none;
  max-width: 100%;
}

/* ── Touch controls ── */
#touch-controls {
  display: none;
  width: 100%;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  flex-shrink: 0;
  background: rgba(0, 0, 0, 0.3);
}

#tc-dpad {
  display: flex;
  gap: 12px;
}

#tc-actions {
  display: flex;
  gap: 12px;
}

.tc-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  width: 72px;
  height: 72px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 24px;
  font-family: monospace;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.1s;
}

.tc-btn:active {
  background: rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 255, 255, 0.5);
}

.tc-jump {
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  background: rgba(0, 234, 255, 0.12);
  border-color: rgba(0, 234, 255, 0.4);
  color: #00eaff;
  width: 80px;
  height: 80px;
}

</style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>
  <div id="touch-controls">
    <div id="tc-dpad">
      <button class="tc-btn" id="tc-left">◀</button>
      <button class="tc-btn" id="tc-right">▶</button>
    </div>
    <div id="tc-actions">
      <button class="tc-btn tc-jump" id="tc-jump">JUMP</button>
    </div>
  </div>
  <script>
// ===== menu.js =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let menuAnimFrame = null;
let menuFrame = 0;
let hoveredCard = -1;

const MENU_STARS = Array.from({ length: 160 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.6 + 0.3,
  drift: Math.random() * 0.5 + 0.08,
  layer: Math.random() > 0.5 ? 1 : 2,
  twinkle: Math.random() * Math.PI * 2,
}));

const GAMES = [
  {
    title: 'SPACE SHOOTER',
    subtitle: 'Levels • Boss • Power-ups',
    color: '#ff6600',
    drawIcon(cx, cy) {
      const bob = Math.sin(menuFrame * 0.06) * 5;
      ctx.save();
      ctx.translate(cx, cy + bob);
      ctx.shadowColor = '#ff6600';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff8833';
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(-17, 14);
      ctx.lineTo(0, 7);
      ctx.lineTo(17, 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffcc66';
      ctx.beginPath();
      ctx.ellipse(0, -5, 5, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 22;
      ctx.fillStyle = '#ffaa00';
      const flicker = 5 + Math.sin(menuFrame * 0.25) * 3;
      ctx.beginPath();
      ctx.ellipse(0, 18, 4, flicker, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff6600';
      ctx.fillRect(-16, 2, 8, 6);
      ctx.fillRect(8, 2, 8, 6);
      ctx.restore();
    },
    game: () => SpaceShooter,
  },
  {
    title: 'PLATFORMER',
    subtitle: 'Run, jump & stomp enemies',
    color: '#aaff00',
    drawIcon(cx, cy) {
      const run = Math.sin(menuFrame * 0.18);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.shadowColor = '#aaff00';
      ctx.shadowBlur = 14;
      // Head
      ctx.fillStyle = '#ffe0a0';
      ctx.beginPath();
      ctx.ellipse(0, -22, 9, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      // Body
      ctx.fillStyle = '#aaff00';
      ctx.fillRect(-7, -13, 14, 16);
      // Arms
      ctx.strokeStyle = '#ffe0a0';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-7, -10);
      ctx.lineTo(-14, -4 + run * 5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(7, -10);
      ctx.lineTo(14, -4 - run * 5);
      ctx.stroke();
      // Legs
      ctx.strokeStyle = '#226600';
      ctx.beginPath();
      ctx.moveTo(-3, 3);
      ctx.lineTo(-6, 16 + run * 6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(3, 3);
      ctx.lineTo(6, 16 - run * 6);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    },
    game: () => Platformer,
  },
  {
    title: 'PANCAKE FLIP',
    subtitle: 'Cook the perfect pancake',
    color: '#ffcc44',
    drawIcon(cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);
      // Pan
      ctx.fillStyle = '#1c1c1c';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      // Batter
      const bgrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 20);
      bgrad.addColorStop(0, '#f5d080');
      bgrad.addColorStop(1, '#c8820a');
      ctx.fillStyle = bgrad;
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      // Bubbles
      [[-7, -5], [5, 1], [-1, 8], [8, -7], [0, -1]].forEach(([bx, by], i) => {
        const pulse = 0.4 + 0.6 * Math.abs(Math.sin(menuFrame * 0.09 + i * 1.3));
        ctx.fillStyle = `rgba(255,255,255,${pulse * 0.75})`;
        ctx.beginPath(); ctx.arc(bx, by, 2.8 * (0.6 + pulse * 0.4), 0, Math.PI * 2); ctx.fill();
      });
      // Handle
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.roundRect(21, -5, 16, 10, 5); ctx.fill();
      ctx.restore();
    },
    game: () => PancakeFlip,
  },
  {
    title: 'GRAVITY CHANGER',
    subtitle: 'Flip gravity to survive',
    color: '#aa44ff',
    drawIcon(cx, cy) {
      const flip = Math.sin(menuFrame * 0.05) > 0 ? 1 : -1;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.shadowColor = '#aa44ff';
      ctx.shadowBlur = 14;
      // Spikes bottom
      ctx.fillStyle = '#ffaa00';
      [-14, 0, 14].forEach(sx => {
        ctx.beginPath();
        ctx.moveTo(sx - 7, 22);
        ctx.lineTo(sx + 7, 22);
        ctx.lineTo(sx, 8);
        ctx.closePath();
        ctx.fill();
      });
      // Spikes top
      [-14, 14].forEach(sx => {
        ctx.beginPath();
        ctx.moveTo(sx - 7, -22);
        ctx.lineTo(sx + 7, -22);
        ctx.lineTo(sx, -8);
        ctx.closePath();
        ctx.fill();
      });
      // Stick figure (flips)
      ctx.scale(1, flip);
      ctx.strokeStyle = '#aa44ff';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      // Head
      ctx.beginPath();
      ctx.arc(0, -16, 5, 0, Math.PI * 2);
      ctx.stroke();
      // Body
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.lineTo(0, 2);
      ctx.stroke();
      // Arms
      ctx.beginPath();
      ctx.moveTo(-7, -6);
      ctx.lineTo(7, -6);
      ctx.stroke();
      // Legs
      const legSwing = Math.sin(menuFrame * 0.18) * 6;
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.lineTo(-5, 12 + legSwing);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.lineTo(5, 12 - legSwing);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    },
    game: () => GravityChanger,
  },
  {
    title: 'LASER DODGE',
    subtitle: 'Dodge the lines!',
    color: '#ff3333',
    drawIcon(cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);

      // Animated red line sweeping in from the right
      const lineX = -5 + Math.sin(menuFrame * 0.07) * 8;
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 3;
      ctx.lineCap = 'square';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(lineX - 2, -4);
      ctx.lineTo(lineX + 30, -4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(lineX - 10, 10);
      ctx.lineTo(lineX + 20, 10);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Green stick figure dodging on the left
      const bob = Math.sin(menuFrame * 0.1) * 3;
      const fx = -24, fy = 2 + bob;
      ctx.strokeStyle = '#22ff66';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#22ff66';
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(fx, fy - 13, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, fy - 8); ctx.lineTo(fx, fy + 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx - 7, fy - 4); ctx.lineTo(fx + 7, fy - 4); ctx.stroke();
      const ls = Math.sin(menuFrame * 0.18) * 5;
      ctx.beginPath(); ctx.moveTo(fx, fy + 4); ctx.lineTo(fx - 4, fy + 12 + ls); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, fy + 4); ctx.lineTo(fx + 4, fy + 12 - ls); ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.restore();
    },
    game: () => LineDodger,
  },
  {
    title: 'RHYTHM TAP',
    subtitle: 'Hit the beat!',
    color: '#ff44cc',
    drawIcon(cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);
      const laneColors = ['#3388ff', '#ff3355', '#33ff66', '#ffaa22'];
      const lw = 12, g = 7;
      const sx = -(4 * lw + 3 * g) / 2;
      laneColors.forEach((c, i) => {
        const lx = sx + i * (lw + g);
        ctx.fillStyle = c + '28';
        ctx.fillRect(lx, -28, lw, 56);
        const noteY = -22 + ((menuFrame * 1.4 + i * 18) % 62);
        ctx.shadowColor = c; ctx.shadowBlur = 8;
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.roundRect(lx, noteY - 6, lw, 12, 3); ctx.fill();
        ctx.shadowBlur = 0;
        // Target line at bottom
        ctx.strokeStyle = c + 'aa';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(lx, 22); ctx.lineTo(lx + lw, 22); ctx.stroke();
      });
      ctx.restore();
    },
    game: () => RhythmTap,
  },
  {
    title: 'BOOST BALL',
    subtitle: 'Car soccer  •  1-2 players',
    color: '#33aaff',
    drawIcon(cx, cy) {
      const t = menuFrame * 0.05;
      ctx.save();
      ctx.translate(cx, cy);
      // ball
      const bx = 22 + Math.sin(t) * 4, by = -2 + Math.abs(Math.sin(t * 1.3)) * -10;
      ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#f4f4ff';
      ctx.beginPath(); ctx.arc(bx, by + 6, 10, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(bx, by + 6, 3, 0, Math.PI * 2); ctx.fill();
      // car
      ctx.translate(-16, 6);
      ctx.shadowColor = '#33aaff'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#33aaff';
      ctx.fillRect(-22, -2, 44, 9);
      ctx.beginPath(); ctx.moveTo(-13, -2); ctx.lineTo(-8, -10); ctx.lineTo(8, -10); ctx.lineTo(15, -2); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(210,240,255,0.85)';
      ctx.beginPath(); ctx.moveTo(-8, -3.5); ctx.lineTo(-4, -8.5); ctx.lineTo(6, -8.5); ctx.lineTo(10, -3.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-12, 7, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, 7, 4, 0, Math.PI * 2); ctx.fill();
      // boost flame
      ctx.fillStyle = '#ffb020';
      const f = 8 + Math.sin(menuFrame * 0.5) * 3;
      ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-22 - f, 3); ctx.lineTo(-22, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    game: () => RocketLeague,
  },
  {
    title: 'SNAKE',
    subtitle: 'Eat apples, grow longer',
    color: '#78d94c',
    drawIcon(cx, cy) {
      const t = menuFrame * 0.08;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = '#78d94c'; ctx.shadowBlur = 12;
      ctx.strokeStyle = '#4a7cf0'; ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(-30, 8);
      for (let i = 0; i <= 12; i++) {
        const x = -30 + i * 4.2;
        ctx.lineTo(x, Math.sin(t + i * 0.55) * 9 + 4);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(24, Math.sin(t + 12 * 0.55) * 9 + 1, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(25, Math.sin(t + 12 * 0.55) * 9 + 1, 1.2, 0, Math.PI * 2); ctx.fill();
      // apple
      ctx.shadowColor = '#ff4422'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#e7471d';
      ctx.beginPath(); ctx.arc(34, -2, 8, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#3fa23a';
      ctx.beginPath(); ctx.ellipse(37, -11, 4, 2, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    },
    game: () => SnakeGame,
  },
  {
    title: 'PINBALL',
    subtitle: 'Flippers, bumpers, 3 balls',
    color: '#b8c4ff',
    drawIcon(cx, cy) {
      const t = menuFrame * 0.06;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineCap = 'round';
      // bumpers
      const bumps = [[-18, -14, '#ff44cc'], [10, -18, '#00eaff'], [24, -2, '#ffd24a']];
      bumps.forEach(([x, y, c], i) => {
        const p = 1 + Math.sin(t * 2 + i) * 0.08;
        ctx.shadowColor = c; ctx.shadowBlur = 12; ctx.strokeStyle = c; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(x, y, 8 * p, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0; ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      });
      // flippers
      const flip = Math.sin(t * 1.5) > 0.6 ? -0.5 : 0.45;
      ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ff8833'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-24, 22); ctx.lineTo(-24 + Math.cos(flip) * 22, 22 + Math.sin(flip) * 22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(24, 22); ctx.lineTo(24 - Math.cos(flip) * 22, 22 + Math.sin(flip) * 22); ctx.stroke();
      ctx.shadowBlur = 0;
      // ball
      const by = 4 + Math.sin(t * 2) * 6;
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-2, by, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    },
    game: () => Pinball,
  },
];

function getCardBounds(i) {
  // 3 rows of 3 cards
  const cardH = 86, gap = 10, cardW = 250;
  const totalW = 3 * cardW + 2 * gap;
  const startX = (canvas.width - totalW) / 2;
  const col = i % 3, row = Math.floor(i / 3);
  return { x: startX + col * (cardW + gap), y: 100 + row * (cardH + gap), w: cardW, h: cardH };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawMenuFrame() {
  menuFrame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#030010';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Parallax stars
  MENU_STARS.forEach((s) => {
    s.x -= s.drift * s.layer * 0.5;
    if (s.x < 0) { s.x = canvas.width; s.y = Math.random() * canvas.height; }
    const tw = 0.4 + 0.6 * Math.sin(menuFrame * 0.04 + s.twinkle);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.85})`;
    ctx.fill();
  });

  // Title
  ctx.textAlign = 'center';
  const titleGlow = 20 + Math.sin(menuFrame * 0.06) * 8;
  ctx.shadowColor = '#00eaff';
  ctx.shadowBlur = titleGlow;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 50px monospace';
  ctx.fillText('ARCADE', canvas.width / 2, 66);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.font = '13px monospace';
  ctx.fillText('SELECT A GAME  —  ESC to return here anytime', canvas.width / 2, 88);

  // Cards
  GAMES.forEach((game, i) => {
    const { x, y, w, h } = getCardBounds(i);
    const hovered = hoveredCard === i;
    const cy = y + (hovered ? -5 : 0);

    ctx.shadowColor = game.color;
    ctx.shadowBlur = hovered ? 28 : 10;
    ctx.strokeStyle = game.color;
    ctx.lineWidth = hovered ? 2.5 : 1.5;
    ctx.fillStyle = hovered ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
    roundRect(x, cy, w, h, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.save();
    ctx.translate(x + 38, cy + h / 2);
    ctx.scale(0.78, 0.78);
    game.drawIcon(0, 0);
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.shadowColor = game.color;
    ctx.shadowBlur = hovered ? 10 : 5;
    ctx.fillStyle = game.color;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(game.title, x + 76, cy + 38);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '10px monospace';
    ctx.fillText(game.subtitle, x + 76, cy + 58);

    if (hovered) {
      ctx.fillStyle = game.color;
      ctx.textAlign = 'right';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('▶ PLAY', x + w - 10, cy + h - 8);
    }
    ctx.textAlign = 'center';
  });

  ctx.textAlign = 'left';
  menuAnimFrame = requestAnimationFrame(drawMenuFrame);
}

canvas.addEventListener('mousemove', (e) => {
  if (!menuAnimFrame) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  hoveredCard = -1;
  GAMES.forEach((_, i) => {
    const { x, y, w, h } = getCardBounds(i);
    if (mx >= x && mx <= x + w && my >= y - 10 && my <= y + h) hoveredCard = i;
  });
  canvas.style.cursor = hoveredCard >= 0 ? 'pointer' : 'default';
});

canvas.addEventListener('click', (e) => {
  if (!menuAnimFrame) return;
  if (hoveredCard < 0) return;
  const game = GAMES[hoveredCard];
  cancelAnimationFrame(menuAnimFrame);
  menuAnimFrame = null;
  canvas.style.cursor = 'default';
  hoveredCard = -1;
  game.game().start();
});

function showMenu() {
  if (menuAnimFrame) cancelAnimationFrame(menuAnimFrame);
  menuAnimFrame = null;
  menuFrame = 0;
  hideTouchControls();
  drawMenuFrame();
}

// ── Responsive canvas sizing ──
function resizeCanvas() {
  const tc = document.getElementById('touch-controls');
  const tcH = tc && tc.style.display !== 'none' ? (tc.offsetHeight || 100) : 0;
  const avW = window.innerWidth;
  const avH = window.innerHeight - tcH;
  const aspect = 2; // 800/400

  let w = avW, h = avW / aspect;
  if (h > avH) { h = avH; w = h * aspect; }

  canvas.style.width  = Math.floor(w) + 'px';
  canvas.style.height = Math.floor(h) + 'px';
}

window.addEventListener('resize', resizeCanvas);

// ── Touch device detection ──
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ── Touch controls visibility ──
function showTouchControls(mode) {
  const tc    = document.getElementById('touch-controls');
  const left  = document.getElementById('tc-left');
  const right = document.getElementById('tc-right');
  const jump  = document.getElementById('tc-jump');
  const show  = isTouchDevice && mode !== 'none';
  tc.style.display    = show ? 'flex' : 'none';
  left.style.display  = show ? 'flex' : 'none';
  right.style.display = show ? 'flex' : 'none';
  jump.style.display  = (show && mode === 'platformer') ? 'flex' : 'none';
  setTimeout(resizeCanvas, 10);
}

function hideTouchControls() {

// ── Synthetic key events from touch buttons ──
function fakeKey(code, down) {
  document.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));

// ── Init everything on load ──
window.addEventListener('load', () => {

    });

  function drawPowerupDrops() {
    powerupDrops.forEach(p => {
      ctx.shadowColor = p.color; ctx.shadowBlur = 14;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#000000'; ctx.shadowBlur = 0;
      ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(POWERUP_LABELS[p.type], p.x + p.w / 2, p.y + p.h / 2 + 4);
      ctx.textAlign = 'left';
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r * p.life), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawHUD() {
    // Lives
    for (let i = 0; i < lives; i++) {
      const lx = 12 + i * 26, ly = H - 30;
      ctx.fillStyle = '#ff6600'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(lx + 9, ly); ctx.lineTo(lx, ly + 16); ctx.lineTo(lx + 9, ly + 11); ctx.lineTo(lx + 18, ly + 16); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
    }
    // Score
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px monospace';
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 6;
    ctx.fillText(`${score}`, W - 120, 28);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace';
    ctx.fillText(`BEST ${hiScore}`, W - 120, 46);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.font = '11px monospace';
    ctx.fillText('ESC = MENU', W - 120, 62);

    // Level badge
    if (state !== 'boss_warning' && state !== 'win' && state !== 'gameover') {
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '12px monospace';
      const lvlLabel = level > LEVEL_CONFIGS.length ? 'BOSS' : `LVL ${level}`;
      ctx.fillText(lvlLabel, W / 2 - 20, H - 10);
    }

    // Active power-up
    if (activePowerup) {
      const barW = 100;
      const pct = powerupTimer / 600;
      ctx.fillStyle = POWERUP_COLORS[activePowerup]; ctx.shadowColor = POWERUP_COLORS[activePowerup]; ctx.shadowBlur = 8;
      ctx.font = 'bold 13px monospace';
      ctx.fillText(activePowerup.toUpperCase(), W / 2 - 60, H - 18);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(W / 2 - 60, H - 14, barW, 6);
      ctx.fillStyle = POWERUP_COLORS[activePowerup]; ctx.fillRect(W / 2 - 60, H - 14, barW * pct, 6);
    }
  }

  function drawOverlay() {
    if (state === 'boss_warning') {
      const alpha = 0.5 + 0.5 * Math.sin(frameCount * 0.2);
      ctx.fillStyle = `rgba(255,0,0,${alpha * 0.3})`; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(255,80,80,${alpha})`; ctx.font = 'bold 48px monospace';
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 30;
      ctx.fillText('⚠  WARNING  ⚠', W / 2, H / 2 - 20);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,200,200,0.8)'; ctx.font = '20px monospace';
      ctx.fillText('BOSS INCOMING', W / 2, H / 2 + 20);
      ctx.textAlign = 'left';
    }

    if (state === 'levelclear') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 25;
      ctx.fillStyle = '#00ff88'; ctx.font = 'bold 50px monospace';
      ctx.fillText(`LEVEL ${level - 1} CLEAR`, W / 2, H / 2 - 10);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '18px monospace';
      ctx.fillText('Get ready...', W / 2, H / 2 + 30);
      ctx.textAlign = 'left';
    }

    if (state === 'win') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 54px monospace';
      ctx.fillText('YOU WIN!', W / 2, 130);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px monospace';
      ctx.fillText(`Score: ${score}`, W / 2, 188);
      if (score >= hiScore && score > 0) {
        ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 12;
        ctx.font = 'bold 18px monospace'; ctx.fillText('NEW BEST!', W / 2, 222); ctx.shadowBlur = 0;
      }
      ctx.fillStyle = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 10;
      ctx.font = '20px monospace'; ctx.fillText('SPACE  — play again', W / 2, 285); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '16px monospace';
      ctx.fillText('M  or  ESC  — main menu', W / 2, 315);
      ctx.textAlign = 'left';
    }

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#ff3333'; ctx.font = 'bold 58px monospace';
      ctx.fillText('GAME OVER', W / 2, 130);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px monospace';
      ctx.fillText(`Score: ${score}`, W / 2, 190);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '18px monospace';
      ctx.fillText(`Best: ${hiScore}`, W / 2, 222);
      ctx.fillStyle = '#00eaff'; ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 10;
      ctx.font = '20px monospace'; ctx.fillText('SPACE  — try again', W / 2, 285); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '16px monospace';
      ctx.fillText('M  or  ESC  — main menu', W / 2, 315);
      ctx.textAlign = 'left';
    }
  }

  // ── main loop ──
  function update() {
    frameCount++;
    if (shakeFrames > 0) shakeFrames--;
    updateStars();

    if (state === 'boss_warning') {
      stateTimer--;
      if (stateTimer <= 0) state = 'boss_entering';
      return;
    }
    if (state === 'boss_entering') {
      updateBoss(); updateBullets(); updatePowerupDrops(); updateParticles();
      if (boss && boss.y >= boss.targetY) state = 'boss';
      return;
    }
    if (state === 'levelclear') {
      stateTimer--;
      if (stateTimer <= 0) initLevel();
      updateParticles();
      return;
    }
    if (state === 'win' || state === 'gameover') { updateParticles(); return; }
    if (state === 'playing') { updatePlayer(); updateBullets(); updateEnemies(); updatePowerupDrops(); updateParticles(); }
    if (state === 'boss') { updatePlayer(); updateBullets(); updateBoss(); updatePowerupDrops(); updateParticles(); }
  }

  function draw() {
    ctx.save();
    if (shakeFrames > 0) {
      const m = shakeFrames * 0.6;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    ctx.clearRect(-20, -20, W + 40, H + 40);
    drawBg();
    drawPowerupDrops();
    enemies.forEach(drawEnemy);
    drawBoss();
    if (state !== 'gameover' && state !== 'win') drawPlayer();
    drawBullets();
    drawParticles();
    ctx.restore();
    drawHUD();
    drawOverlay();
    drawDpad();
  }

  function gameLoop() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let xNow = false;
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) xNow = true; break; }
    if (xNow && !gpXWasPressed && (state === 'gameover' || state === 'win')) { gpXWasPressed = false; stop(); showMenu(); return; }
    gpXWasPressed = xNow;
    update(); draw();
    animFrame = requestAnimationFrame(gameLoop);
  }

  // ── input ──
  function onKeyDown(e) {
    keys[e.code] = true;
    if (e.code === 'Escape' || e.code === 'KeyM') { stop(); showMenu(); return; }
    if (e.code === 'Space') {
      if (state === 'win') { level = 1; lives = 3; score = 0; initLevel(); }
      else if (state === 'gameover') initGame();
    }
    if (e.code === 'KeyM') { stop(); showMenu(); }
  }
  function onKeyUp(e) { delete keys[e.code]; }

  function onTouchStart(e) { e.preventDefault(); updateTouchDirs(e); }
  function onTouchMove(e)  { e.preventDefault(); updateTouchDirs(e); }
  function onTouchEnd(e)   { e.preventDefault(); updateTouchDirs(e); }

  function start() {
    keys = {};
    dpTouch.up = dpTouch.down = dpTouch.left = dpTouch.right = false;
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
    canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
    initGame();
    gameLoop();
  }

  function stop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup', onKeyUp);
    canvas.removeEventListener('touchstart', onTouchStart);
    canvas.removeEventListener('touchmove',  onTouchMove);
    canvas.removeEventListener('touchend',   onTouchEnd);
    dpTouch.up = dpTouch.down = dpTouch.left = dpTouch.right = false;
    keys = {};
  }

  return { start, stop };
})();

        [1130, 245, 75, 20],
        [1290, 155, 75, 20],   // high again
        [1460, 280, 75, 20],
        [1620, 340, 100, 60],  // ground bounce-pad zone
        [1790, 120, 80, 20],   // VERY HIGH
        [1960, 210, 75, 20],
        [2120, 155, 75, 20],
        [2290, 220, 80, 20],
        [2460, 270, 80, 20],
        [2620, 340, 200, 60],
      ],
      enemies: [
        { x: 340, type: 'fast' }, { x: 490, type: 'basic' },
        { x: 980, type: 'armored' }, { x: 1310, type: 'fast' },
        { x: 1480, type: 'armored' }, { x: 1810, type: 'fast' },
        { x: 1980, type: 'armored' }, { x: 2310, type: 'fast' },
      ],
      coins: [
        { x: 355, y: 238 }, { x: 490, y: 168 }, { x: 660, y: 238 },
        { x: 975, y: 123 }, { x: 1000, y: 123 },
        { x: 1150, y: 213 }, { x: 1305, y: 123 }, { x: 1330, y: 123 },
        { x: 1480, y: 248 }, { x: 1805, y: 88 }, { x: 1830, y: 88 },
        { x: 1975, y: 178 }, { x: 2135, y: 123 }, { x: 2160, y: 123 },
        { x: 2305, y: 188 }, { x: 2475, y: 238 }, { x: 2640, y: 308 },
      ],
      moving: [
        { x: 350, y: 280, w: 75, h: 18, range: 100, speed: 1.5 },
        { x: 1200, y: 265, w: 75, h: 18, range: 90, speed: 1.8 },
        { x: 2050, y: 225, w: 75, h: 18, range: 110, speed: 2 },
      ],
      hazards: [],
      bouncePads: [
        [250, 328, 60, 14],
        [820, 328, 60, 14],
        [1640, 328, 60, 14],
        [2600, 328, 60, 14],
      ],
      exitX: 2700,
    },
  ];

  const ENEMY_DEFS = {
    basic:   { color: '#ff3333', accent: '#ff8888', w: 28, h: 28, speed: 1.2, maxHp: 1 },
    fast:    { color: '#aa00ff', accent: '#dd88ff', w: 24, h: 24, speed: 2.2, maxHp: 1 },
    armored: { color: '#888888', accent: '#cccccc', w: 32, h: 30, speed: 0.9, maxHp: 2 },
  };

  // ── level select helpers ──
  function cardBounds(i) {
    const CW = 200, CH = 145, GAP = 12;
    const sx = (W - (3 * CW + 2 * GAP)) / 2;
    return { x: sx + (i % 3) * (CW + GAP), y: 80 + Math.floor(i / 3) * (CH + GAP), w: CW, h: CH };
  }

  function canvasXY(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
    return {
      mx: (src.clientX - r.left) * (W / r.width),
      my: (src.clientY - r.top)  * (H / r.height),
    };
  }

  function drawSelect() {
    ctx.fillStyle = '#0a140a'; ctx.fillRect(0, 0, W, H);

    // Scrolling grid
    const gOff = (Date.now() / 60) % 50;
    ctx.strokeStyle = 'rgba(76,175,80,0.07)'; ctx.lineWidth = 1;
    for (let x = gOff - 50; x < W + 50; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.shadowColor = '#4caf50'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#4caf50'; ctx.font = 'bold 30px monospace';
    ctx.fillText('CHOOSE LEVEL', W / 2, 44);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '13px monospace';
    ctx.fillText('Click a card  •  Press 1–6  •  ESC = main menu', W / 2, 64);

    LEVELS.forEach((lv, i) => {
      const b  = cardBounds(i);
      const hov = hoveredLevel === i;
      const cy  = b.y + (hov ? -7 : 0);

      ctx.shadowColor = lv.color; ctx.shadowBlur = hov ? 26 : 8;
      ctx.strokeStyle = lv.color; ctx.lineWidth = hov ? 2.5 : 1.5;
      ctx.fillStyle   = hov ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.roundRect(b.x, cy, b.w, b.h, 10); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = lv.color + (hov ? 'cc' : '88');
      ctx.beginPath(); ctx.roundRect(b.x, cy, b.w, 7, [10, 10, 0, 0]); ctx.fill();

      ctx.shadowColor = lv.color; ctx.shadowBlur = 10;
      ctx.fillStyle = lv.color; ctx.font = 'bold 28px monospace';
      ctx.fillText(i + 1, b.x + b.w / 2, cy + 46); ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace';
      ctx.fillText(lv.name, b.x + b.w / 2, cy + 68);

      ctx.fillStyle = '#ffdd00'; ctx.font = '12px monospace';
      ctx.fillText('★'.repeat(lv.stars) + '☆'.repeat(5 - lv.stars), b.x + b.w / 2, cy + 88);

      if (lv.feature) {
        ctx.fillStyle = lv.color + 'bb'; ctx.font = 'bold 10px monospace';
        ctx.fillText(lv.feature, b.x + b.w / 2, cy + 108);
      }

      if (hov) {
        ctx.shadowColor = lv.color; ctx.shadowBlur = 8;
        ctx.fillStyle = lv.color; ctx.font = 'bold 12px monospace';
        ctx.fillText('▶  PLAY', b.x + b.w / 2, cy + b.h - 10); ctx.shadowBlur = 0;
      }
    });

    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.font = '11px monospace';
    ctx.fillText('ARROWS / SPACE to play  •  wall jump on ICE WORLD', W / 2, H - 12);
    ctx.textAlign = 'left';
  }

  function startSelectedLevel(idx) {
    level    = idx;
    lives    = 3; coins = 0; score = 0; frameCount = 0;
    hoveredLevel = -1;
    canvas.style.cursor = 'default';
    showTouchControls('platformer');
    state = 'playing';
    loadLevel();
  }

  // ── helpers ──
  function rng(a, b) { return Math.random() * (b - a) + a; }
  function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  // ── init ──
  function initGame() {
    level = 0; lives = 3; coins = 0; score = 0; frameCount = 0;
    loadLevel();
  }

  function loadLevel() {
    const ld = LEVELS[level];
    camX = 0; stateTimer = 0; shakeFrames = 0;
    particles = [];

    player = {
      x: 60, y: 260,
      w: 28, h: 28,
      vx: 0, vy: 0,
      onGround: false,
      touchingWallLeft: false, touchingWallRight: false,
      coyoteTimer: 0,
      jumpsLeft: 2,
      facing: 1,
      animFrame: 0,
      damaged: 0,
      rotation: 0,
    };

    platforms = ld.platforms.map(([x, y, w, h]) => ({ x, y, w, h }));

    movingPlatforms = ld.moving.map(m => ({
      x: m.x, y: m.y, w: m.w, h: m.h,
      originX: m.x, range: m.range, speed: m.speed, dir: 1,
    }));

    hazards = ld.hazards.map(([x, y, w, h]) => ({ x, y, w, h }));

    enemies = ld.enemies.map(e => {
      const def = ENEMY_DEFS[e.type];
      return {
        x: e.x, y: 0,
        w: def.w, h: def.h,
        vx: def.speed, type: e.type,
        color: def.color, accent: def.accent,
        hp: def.maxHp, maxHp: def.maxHp,
        onGround: false,
      };
    });

    bouncePads = (ld.bouncePads || []).map(([x, y, w, h]) => ({ x, y, w, h }));
    collectibles = ld.coins.map(c => ({ x: c.x, y: c.y, r: 9, collected: false, anim: 0 }));
    totalCoins = collectibles.length;

    exitPortal = { x: ld.exitX, y: 240, w: 40, h: 100 };
    state = 'playing';
  }

  // ── particles ──
  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = rng(0, Math.PI * 2), spd = rng(1.5, 5);
      particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 2, r: rng(2, 5), color, life: 1, decay: rng(0.03, 0.06) });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vx *= 0.95; p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ── physics helpers ──
  function resolveVsStatics(ent, plats) {
    ent.touchingWallLeft = false;
    ent.touchingWallRight = false;
    // vertical
    ent.y += ent.vy;
    plats.forEach(p => {
      if (!overlap(ent.x, ent.y, ent.w, ent.h, p.x, p.y, p.w, p.h)) return;
      if (ent.vy > 0) { ent.y = p.y - ent.h; ent.vy = 0; ent.onGround = true; }
      else if (ent.vy < 0) { ent.y = p.y + p.h; ent.vy = 0; }
    });
    // horizontal
    ent.x += ent.vx;
    plats.forEach(p => {
      if (!overlap(ent.x, ent.y, ent.w, ent.h, p.x, p.y, p.w, p.h)) return;
      if (ent.vx > 0) { ent.x = p.x - ent.w; ent.vx = 0; ent.touchingWallRight = true; }
      else if (ent.vx < 0) { ent.x = p.x + p.w; ent.vx = 0; ent.touchingWallLeft = true; }
    });
  }

  // ── update sections ──
  function updatePlayer() {
    const ld = LEVELS[level];
    player.animFrame++;
    if (player.damaged > 0) player.damaged--;

    // Horizontal
    const hasIce = (ld.features || []).includes('ice');
    const accel = hasIce ? 0.55 : 0.8, maxSpd = 5;
    if (keys['ArrowLeft'] || keys['KeyA'] || gpState.left)  { player.vx -= accel; player.facing = -1; }
    else if (keys['ArrowRight'] || keys['KeyD'] || gpState.right) { player.vx += accel; player.facing = 1; }
    else { player.vx *= hasIce ? 0.93 : 0.75; }
    player.vx = Math.max(-maxSpd, Math.min(maxSpd, player.vx));

    // Gravity
    player.vy = Math.min(player.vy + 0.55, 14);

    // Coyote time + rotation snap on landing
    if (player.onGround) {
      player.coyoteTimer = 6; player.jumpsLeft = 2;
      player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
    }
    else if (player.coyoteTimer > 0) player.coyoteTimer--;

    player.onGround = false;

    // Resolve vs static platforms
    const allPlats = [...platforms, ...movingPlatforms];
    resolveVsStatics(player, allPlats);

    // Wall slide — slow descent while pressing against a wall mid-air
    if ((player.touchingWallLeft || player.touchingWallRight) && !player.onGround && player.vy > 0) {
      player.vy = Math.min(player.vy, 2.5);
    }

    // Bounce pads
    bouncePads.forEach(bp => {
      if (overlap(player.x, player.y, player.w, player.h, bp.x, bp.y, bp.w, bp.h)) {
        player.vy = -16;
        player.y = bp.y - player.h;
        player.jumpsLeft = 2;
        burst(player.x + player.w / 2, bp.y, '#ff8800', 14);
        shakeFrames = 3;
      }
    });

    // World bounds
    player.x = Math.max(0, player.x);
    if (player.x + player.w > ld.width) player.x = ld.width - player.w;

    // Fall death
    if (player.y > H + 50) takeDamage(true);

    // Hazards (lava)
    hazards.forEach(hz => {
      if (overlap(player.x, player.y, player.w, player.h, hz.x, hz.y, hz.w, hz.h)) takeDamage(true);
    });

    // Enemy collisions
    enemies.forEach((e, i) => {
      if (!overlap(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) return;
      const playerBottom = player.y + player.h;
      const enemyTop = e.y;
      if (player.vy > 0 && playerBottom - e.h * 0.35 < enemyTop + 10) {
        // Stomp
        e.hp--;
        player.vy = -9;
        burst(e.x + e.w / 2, e.y, e.color, 12);
        shakeFrames = 5;
        if (e.hp <= 0) { enemies.splice(i, 1); score += 100; }
      } else if (player.damaged === 0) {
        takeDamage(false);
      }
    });

    // Coins
    collectibles.forEach(c => {
      if (c.collected) return;
      if (overlap(player.x, player.y, player.w, player.h, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2)) {
        c.collected = true; coins++; score += 10;
        burst(c.x, c.y, '#ffcc00', 8);
      }
    });

    // Exit portal
    if (overlap(player.x, player.y, player.w, player.h, exitPortal.x, exitPortal.y, exitPortal.w, exitPortal.h)) {
      score += lives * 50;
      if (level >= LEVELS.length - 1) { state = 'win'; }
      else { state = 'levelclear'; stateTimer = 90; }
    }

    // Camera
    const targetCam = player.x - W * 0.35;
    camX += (targetCam - camX) * 0.12;
    camX = Math.max(0, Math.min(LEVELS[level].width - W, camX));
  }

  function takeDamage(resetPos) {
    if (player.damaged > 0) return;
    lives--;
    player.damaged = 90;
    shakeFrames = 18;
    burst(player.x + player.w / 2, player.y + player.h / 2, '#ff4444', 16);
    if (lives <= 0) { state = 'gameover'; return; }
    if (resetPos) { player.x = 60; player.y = 260; player.vx = 0; player.vy = 0; camX = 0; }
  }

  function updateEnemies() {
    const allPlats = [...platforms, ...movingPlatforms];
    enemies.forEach(e => {
      e.vy = (e.vy || 0) + 0.55;
      e.vy = Math.min(e.vy, 14);
      e.onGround = false;
      resolveVsStatics(e, allPlats);

      // Reverse at platform edges
      if (e.onGround) {
        const ahead = { x: e.x + e.vx * 10 + (e.vx > 0 ? e.w : 0), y: e.y + e.h + 4, w: 4, h: 4 };
        const onEdge = !allPlats.some(p => overlap(ahead.x, ahead.y, ahead.w, ahead.h, p.x, p.y, p.w, p.h));
        const hitWall = e.x <= 0 || e.x + e.w >= LEVELS[level].width;
        if (onEdge || hitWall || (e.vx === 0)) e.vx = -e.vx || ENEMY_DEFS[e.type].speed;
      }

      if (e.y > H + 80) e.y = -40;
    });
  }

  function updateMovingPlatforms() {
    movingPlatforms.forEach(mp => {
      mp.x += mp.speed * mp.dir;
      if (mp.x > mp.originX + mp.range || mp.x < mp.originX) mp.dir *= -1;

      // Carry player
      if (player.onGround &&
          overlap(player.x, player.y + player.h - 2, player.w, 4, mp.x, mp.y, mp.w, mp.h)) {
        player.x += mp.speed * mp.dir;
      }
    });
  }

  function doJump() {
    if (state !== 'playing') return;
    // Wall jump — kicks off walls when airborne and coyote time expired
    if (!player.onGround && player.coyoteTimer === 0 &&
        (player.touchingWallLeft || player.touchingWallRight)) {
      player.vy = -12;
      player.vx = player.touchingWallLeft ? 6 : -6;
      burst(player.touchingWallLeft ? player.x : player.x + player.w,
            player.y + player.h / 2, '#00eaff', 10);
      return;
    }
    if (player.coyoteTimer > 0 || player.jumpsLeft > 0) {
      const isDouble = player.coyoteTimer === 0;
      player.vy = isDouble ? -10 : -12;
      player.jumpsLeft = Math.max(0, player.jumpsLeft - 1);
      player.coyoteTimer = 0;
      burst(player.x + player.w / 2, player.y + player.h, '#aaffaa', 6);
    }
  }

  // ── draw ──
  function drawBg() {
    const ld = LEVELS[level];
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, ld.bg[0]); grad.addColorStop(1, ld.bg[1]);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // Parallax decorations
    if (level === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < 12; i++) {
        const bx = ((i * 190 - camX * 0.3) % (W + 200)) - 100;
        ctx.beginPath(); ctx.ellipse(bx, 80 + (i % 3) * 40, 40 + i * 5, 20, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (level === 1) {
      for (let i = 0; i < 40; i++) {
        const sx = ((i * 73 - camX * 0.1) % W + W) % W;
        const sy = (i * 53) % H;
        ctx.beginPath(); ctx.arc(sx, sy, 0.8 + (i % 3) * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 4) * 0.1})`; ctx.fill();
      }
    }
    if (level === 2) {
      ctx.fillStyle = 'rgba(255,80,0,0.07)';
      for (let i = 0; i < 8; i++) {
        const fx = ((i * 310 - camX * 0.4) % (W + 400)) - 200;
        ctx.beginPath(); ctx.ellipse(fx, H - 20, 60, 30, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (level === 3) {
      // Ice crystals / snowflakes
      ctx.fillStyle = 'rgba(140,210,255,0.06)';
      for (let i = 0; i < 14; i++) {
        const bx = ((i * 170 - camX * 0.2) % (W + 200)) - 100;
        ctx.beginPath(); ctx.arc(bx, 40 + (i % 4) * 50, 18 + (i % 3) * 8, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (level === 4) {
      // Floating purple motes
      for (let i = 0; i < 30; i++) {
        const bx = ((i * 61 - camX * 0.08) % W + W) % W;
        const by = (i * 47) % H;
        ctx.beginPath(); ctx.arc(bx, by, 1 + (i % 3) * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,60,255,${0.15 + (i % 5) * 0.05})`; ctx.fill();
      }
    }
    if (level === 5) {
      // Neon grid lines
      ctx.strokeStyle = 'rgba(200,0,255,0.06)'; ctx.lineWidth = 1;
      for (let i = 0; i < 10; i++) {
        const gx = ((i * 80 - camX * 0.15) % (W + 80)) - 40;
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
      }
      for (let j = 0; j < 6; j++) {
        ctx.beginPath(); ctx.moveTo(0, j * 70); ctx.lineTo(W, j * 70); ctx.stroke();
      }
    }
  }

  function worldToScreen(x) { return x - camX; }

  function drawPlatforms() {
    const ld = LEVELS[level];
    const allPlats = [...platforms, ...movingPlatforms];
    allPlats.forEach(p => {
      const sx = worldToScreen(p.x);
      if (sx + p.w < 0 || sx > W) return;

      // Main body
      ctx.fillStyle = ld.platColor;
      ctx.fillRect(sx, p.y, p.w, p.h);
      // Top highlight
      ctx.fillStyle = ld.groundColor;
      ctx.fillRect(sx, p.y, p.w, 5);
      // Drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(sx, p.y + p.h, p.w, 4);
    });
  }

  function drawHazards() {
    const ld = LEVELS[level];
    hazards.forEach(hz => {
      const sx = worldToScreen(hz.x);
      if (sx + hz.w < 0 || sx > W) return;
      ctx.fillStyle = '#ff6600';
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 10;
      ctx.fillRect(sx, hz.y, hz.w, hz.h);
      ctx.shadowBlur = 0;
      // Lava shimmer
      ctx.fillStyle = `rgba(255,200,0,${0.3 + 0.3 * Math.sin(frameCount * 0.15 + hz.x * 0.05)})`;
      ctx.fillRect(sx, hz.y, hz.w, hz.h / 2);
    });
  }

  function drawEnemies() {
    enemies.forEach(e => {
      const sx = worldToScreen(e.x);
      if (sx + e.w < -10 || sx > W + 10) return;
      ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      if (e.type === 'basic') {
        ctx.fillStyle = e.color;
        ctx.fillRect(sx, e.y, e.w, e.h);
        ctx.fillStyle = e.accent;
        ctx.fillRect(sx + 4, e.y + 4, e.w - 8, 10);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx + 6, e.y + 6, 5, 5);
        ctx.fillRect(sx + e.w - 11, e.y + 6, 5, 5);
        ctx.fillStyle = '#000000';
        ctx.fillRect(sx + 7, e.y + 7, 3, 3);
        ctx.fillRect(sx + e.w - 10, e.y + 7, 3, 3);
      } else if (e.type === 'fast') {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(sx + e.w / 2, e.y);
        ctx.lineTo(sx, e.y + e.h);
        ctx.lineTo(sx + e.w / 4, e.y + e.h * 0.6);
        ctx.lineTo(sx + e.w / 2, e.y + e.h * 0.85);
        ctx.lineTo(sx + e.w * 3 / 4, e.y + e.h * 0.6);
        ctx.lineTo(sx + e.w, e.y + e.h);
        ctx.closePath(); ctx.fill();
      } else {
        // Armored
        ctx.fillStyle = e.color; ctx.fillRect(sx, e.y, e.w, e.h);
        ctx.fillStyle = e.accent; ctx.fillRect(sx + 4, e.y + 4, e.w - 8, e.h - 8);
        if (e.hp < e.maxHp) {
          ctx.fillStyle = '#ff0000'; ctx.fillRect(sx, e.y - 6, e.w, 4);
          ctx.fillStyle = '#ff6666'; ctx.fillRect(sx, e.y - 6, (e.hp / e.maxHp) * e.w, 4);
        }
      }
      ctx.shadowBlur = 0;
    });
  }

  function drawPlayer() {
    const sx = worldToScreen(player.x);
    const flash = player.damaged > 0 && Math.floor(player.damaged / 6) % 2 === 0;
    if (flash) return;

    const cx = sx + player.w / 2;
    const cy = player.y + player.h / 2;

    // Rotate: spin while airborne, roll along ground
    if (player.onGround) {
      player.rotation += player.vx * 0.055;
    } else {
      player.rotation += (player.facing || 1) * 0.07;
    }

    // Ground shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(cx, player.y + player.h + 3, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wall-slide sparkles
    if ((player.touchingWallLeft || player.touchingWallRight) && !player.onGround) {
      const wx = player.touchingWallLeft ? sx : sx + player.w;
      ctx.fillStyle = '#00eaff';
      for (let i = 0; i < 3; i++) {
        const fy = player.y + (i / 2) * player.h;
        ctx.beginPath();
        ctx.arc(wx + (Math.random() - 0.5) * 6, fy, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.rotation);

    const hw = player.w / 2; // 14

    // Outer body
    ctx.fillStyle = '#336600';
    ctx.fillRect(-hw, -hw, player.w, player.w);

    // Glowing border
    ctx.shadowColor = '#aaff00';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#aaff00';
    ctx.lineWidth = 2;
    ctx.strokeRect(-hw + 1, -hw + 1, player.w - 2, player.w - 2);
    ctx.shadowBlur = 0;

    // Inner square
    ctx.fillStyle = '#77cc00';
    ctx.fillRect(-hw + 6, -hw + 6, player.w - 12, player.w - 12);
    ctx.strokeStyle = '#aaff44';
    ctx.lineWidth = 1;
    ctx.strokeRect(-hw + 6, -hw + 6, player.w - 12, player.w - 12);

    // Corner pips
    ctx.fillStyle = '#aaff00';
    const p = 2, s = 3;
    ctx.fillRect(-hw + p, -hw + p, s, s);
    ctx.fillRect( hw - p - s, -hw + p, s, s);
    ctx.fillRect(-hw + p,  hw - p - s, s, s);
    ctx.fillRect( hw - p - s,  hw - p - s, s, s);

    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawBouncePads() {
    bouncePads.forEach(bp => {
      const sx = worldToScreen(bp.x);
      if (sx + bp.w < 0 || sx > W) return;
      const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.14);
      ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 14 * pulse;
      ctx.fillStyle = '#ff5500';
      ctx.fillRect(sx, bp.y, bp.w, bp.h);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(sx + 2, bp.y + 2, bp.w - 4, Math.floor(bp.h / 2) - 2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
      ctx.fillText('▲', sx + bp.w / 2, bp.y + bp.h - 2);
      ctx.textAlign = 'left';
    });
  }

  function drawCoins() {
    collectibles.forEach(c => {
      if (c.collected) return;
      const sx = worldToScreen(c.x);
      if (sx < -20 || sx > W + 20) return;
      c.anim++;
      const bob = Math.sin(c.anim * 0.08) * 3;
      ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(sx, c.y + bob, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffee88';
      ctx.beginPath(); ctx.arc(sx - 2, c.y + bob - 2, c.r * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function drawExitPortal() {
    const sx = worldToScreen(exitPortal.x);
    if (sx < -50 || sx > W + 50) return;
    const pulse = Math.sin(frameCount * 0.1) * 0.3 + 0.7;
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20 * pulse;
    ctx.strokeStyle = `rgba(0,255,136,${pulse})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(sx, exitPortal.y, exitPortal.w, exitPortal.h);
    ctx.fillStyle = `rgba(0,255,136,${0.15 * pulse})`;
    ctx.fillRect(sx, exitPortal.y, exitPortal.w, exitPortal.h);
    ctx.fillStyle = `rgba(0,255,136,${pulse})`;
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('EXIT', sx + exitPortal.w / 2, exitPortal.y + exitPortal.h / 2 + 4);
    ctx.textAlign = 'left'; ctx.shadowBlur = 0;
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color; ctx.shadowBlur = 6; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(worldToScreen(p.x), p.y, Math.max(0, p.r * p.life), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawHUD() {
    const ld = LEVELS[level];
    // Hearts
    for (let i = 0; i < 3; i++) {
      const hx = 12 + i * 24, hy = 10;
      ctx.font = '18px monospace';
      ctx.fillStyle = i < lives ? '#ff4444' : 'rgba(255,255,255,0.2)';
      ctx.fillText('♥', hx, hy + 16);
    }
    // Level name
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`${level + 1} — ${ld.name}`, W / 2, 22);
    ctx.textAlign = 'left';
    // Coins
    ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 6;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`⬤ ${coins}`, W - 100, 22);
    ctx.shadowBlur = 0;
    // Score
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '12px monospace';
    ctx.fillText(`${score}`, W - 100, 40);
    // ESC hint
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = '11px monospace';
    ctx.fillText('ESC = MENU', W - 100, 58);
    if (level === 0 && frameCount < 300) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText('ARROWS to move  •  SPACE to jump (double-jump!)', W / 2, H - 12);
      ctx.textAlign = 'left';
    }
    if (level === 3 && frameCount < 420) {
      ctx.fillStyle = 'rgba(0,234,255,0.7)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 6;
      ctx.fillText('ICE: slippery!  •  WALL JUMP: press JUMP while touching a wall', W / 2, H - 12);
      ctx.shadowBlur = 0; ctx.textAlign = 'left';
    }
    if (level === 4 && frameCount < 360) {
      ctx.fillStyle = 'rgba(180,80,255,0.8)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.shadowColor = '#bb44ff'; ctx.shadowBlur = 6;
      ctx.fillText('SHADOW REALM: enemies lurk in the dark — follow the coins!', W / 2, H - 12);
      ctx.shadowBlur = 0; ctx.textAlign = 'left';
    }
    if (level === 5 && frameCount < 360) {
      ctx.fillStyle = 'rgba(255,140,0,0.8)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 6;
      ctx.fillText('NEON BOUNCE: land on orange pads for mega-jumps!', W / 2, H - 12);
      ctx.shadowBlur = 0; ctx.textAlign = 'left';
    }
  }

  function drawOverlay() {
    if (state === 'levelclear') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#aaff00'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#aaff00'; ctx.font = 'bold 52px monospace';
      ctx.fillText('LEVEL CLEAR!', W / 2, H / 2 - 10);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '18px monospace';
      ctx.fillText('Get ready for next level...', W / 2, H / 2 + 30);
      ctx.textAlign = 'left';
    }
    if (state === 'win') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 28;
      ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 52px monospace';
      ctx.fillText('YOU WIN!', W / 2, 120);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`Score: ${score}`, W / 2, 178);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '16px monospace';
      ctx.fillText(`Coins: ${coins} / ${totalCoins}    Lives left: ${lives}`, W / 2, 212);
      ctx.fillStyle = '#aaff00'; ctx.shadowColor = '#aaff00'; ctx.shadowBlur = 10;
      ctx.font = '20px monospace'; ctx.fillText('SPACE  — level select', W / 2, 278); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '16px monospace';
      ctx.fillText('ESC  — main menu', W / 2, 308);
      ctx.textAlign = 'left';
    }
    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 28;
      ctx.fillStyle = '#ff3333'; ctx.font = 'bold 56px monospace';
      ctx.fillText('GAME OVER', W / 2, 120);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`Score: ${score}`, W / 2, 178);
      ctx.fillStyle = '#00eaff'; ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 10;
      ctx.font = '20px monospace'; ctx.fillText('SPACE  — try again', W / 2, 278); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '16px monospace';
      ctx.fillText('ESC  — level select', W / 2, 308);
      ctx.textAlign = 'left';
    }
  }

  // ── main loop ──
  function update() {
    frameCount++;
    if (shakeFrames > 0) shakeFrames--;
    if (state === 'levelclear') {
      stateTimer--;
      updateParticles();
      if (stateTimer <= 0) { level++; loadLevel(); }
      return;
    }
    if (state === 'win' || state === 'gameover') { updateParticles(); return; }
    updateMovingPlatforms();
    updateEnemies();
    updatePlayer();
    updateParticles();
  }

  function draw() {
    if (state === 'select') { drawSelect(); return; }
    ctx.save();
    if (shakeFrames > 0) {
      const m = shakeFrames * 0.5;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    ctx.clearRect(-20, -20, W + 40, H + 40);
    drawBg();
    drawHazards();
    drawBouncePads();
    drawPlatforms();
    drawExitPortal();
    drawCoins();
    drawEnemies();
    drawParticles();
    drawPlayer();
    // Dark-level spotlight overlay
    if ((LEVELS[level].features || []).includes('dark')) {
      const px = worldToScreen(player.x + player.w / 2);
      const py = player.y + player.h / 2;
      const grd = ctx.createRadialGradient(px, py, 28, px, py, 190);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(0.45, 'rgba(0,0,0,0.65)');
      grd.addColorStop(1, 'rgba(0,0,0,0.97)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    drawHUD();
    drawOverlay();
  }

  function gameLoop() { pollGamepad(); if (state !== 'select') update(); draw(); animFrame = requestAnimationFrame(gameLoop); }

  // ── input ──
  function onKeyDown(e) {
    keys[e.code] = true;
    if (e.code === 'Escape') {
      if (state === 'select') { stop(); showMenu(); return; }
      state = 'select'; hideTouchControls(); keys = {}; hoveredLevel = -1;
      canvas.style.cursor = 'default'; return;
    }
    if (state === 'select') {
      const n = parseInt(e.key);
      if (n >= 1 && n <= 6) startSelectedLevel(n - 1);
      return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (state === 'win')      { state = 'select'; hideTouchControls(); hoveredLevel = -1; return; }
      if (state === 'gameover') { lives = 3; coins = 0; score = 0; frameCount = 0; state = 'playing'; loadLevel(); return; }
      doJump();
    }
  }
  function onKeyUp(e) { delete keys[e.code]; }

  function onCanvasMouseMove(e) {
    if (state !== 'select') { canvas.style.cursor = 'default'; return; }
    const { mx, my } = canvasXY(e);
    hoveredLevel = -1;
    LEVELS.forEach((_, i) => {
      const b = cardBounds(i);
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y - 10 && my <= b.y + b.h) hoveredLevel = i;
    });
    canvas.style.cursor = hoveredLevel >= 0 ? 'pointer' : 'default';
  }

  function onCanvasPointerDown(e) {
    if (state !== 'select') return;
    const { mx, my } = canvasXY(e);
    LEVELS.forEach((_, i) => {
      const b = cardBounds(i);
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y - 10 && my <= b.y + b.h) startSelectedLevel(i);
    });
  }

  function onCanvasTouchDown(e) { e.preventDefault(); onCanvasPointerDown(e); }

  function start() {
    keys = {}; hoveredLevel = -1; state = 'select';
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup',   onKeyUp);
    canvas.addEventListener('mousemove',  onCanvasMouseMove);
    canvas.addEventListener('mousedown',  onCanvasPointerDown);
    canvas.addEventListener('touchstart', onCanvasTouchDown, { passive: false });
    gameLoop();
  }

  function stop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup',   onKeyUp);
    canvas.removeEventListener('mousemove',  onCanvasMouseMove);
    canvas.removeEventListener('mousedown',  onCanvasPointerDown);
    canvas.removeEventListener('touchstart', onCanvasTouchDown);
    hideTouchControls();
    canvas.style.cursor = 'default';
    keys = {};
  }

  return { start, stop };
})();

  <script>
// ===== pancake.js =====
const PancakeFlip = (() => {
  const PAN_X = 370, PAN_Y = 192;
  const PAN_R = 143;
  const BATTER_R = 126;
  const TOTAL_PANCAKES = 5;
  const FLIP_DUR = 0.5;
  const SCORE_DUR = 2.2;
  const BTN_X = 400, BTN_Y = 366;

  let state, pancakeNum, totalStars;
  let cookTimer, cookTime, side1Pct, side2Pct;
  let bubbles, steam, particles, feedback;
  let feedbackTimer, stateTimer, pourRadius;
  let flipTimer, flipScaleY, flipSideCooked;
  let frameCount, animFrame, lastTime;
  let gpXWasPressed = false;

  // ── helpers ──
  function rng(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function getCookTime(n)    { return Math.max(4.5, 10 - (n - 1) * 0.8); }
  function getBubbleCount(n) { return Math.min(34, 20 + (n - 1) * 2); }

  // ── bubble system ──
  function spawnBubbles(speedMult) {
    bubbles = [];
    const n = getBubbleCount(pancakeNum);
    for (let i = 0; i < n; i++) {
      const angle = rng(0, Math.PI * 2);
      const dist  = Math.sqrt(Math.random()) * (BATTER_R - 12);
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;
      const maxR = rng(3, 7.5);
      const distFromEdge = BATTER_R - Math.sqrt(x * x + y * y);
      // Outer bubbles pop first (small delay), inner last (large delay)
      const popDelay = (distFromEdge / BATTER_R) * cookTime * 0.86 * speedMult;
      bubbles.push({
        x, y, r: 0, maxR,
        formTime: rng(0.8, 2.2),
        age: 0,
        popDelay,
        state: 'forming',
        ringR: 0, ringAlpha: 0,
      });
    }
  }

  function makeSteam() {
    const angle = rng(0, Math.PI * 2);
    const r = BATTER_R - 10 + rng(0, 16);
    return {
      x: Math.cos(angle) * r, y: Math.sin(angle) * r,
      vx: rng(-0.35, 0.35), vy: -rng(0.3, 0.7),
      alpha: rng(0.06, 0.32), size: rng(4, 9),
      life: Math.random(),
    };
  }

  function getPoppedFraction() {
    if (!bubbles.length) return 0;
    return bubbles.filter(b => b.state === 'popping' || b.state === 'done').length / bubbles.length;
  }

  function calcStars(pct) {
    if (pct < 0.42) return 0;      // raw
    if (pct < 0.58) return 1;      // a bit early
    if (pct <= 0.85) return 3;     // perfect window
    if (pct <= 0.95) return 2;     // a bit late
    return 0;                       // burnt
  }

  function feedbackFor(pct) {
    if (pct < 0.42) return { text: 'Too raw!',      color: '#ff6644' };
    if (pct < 0.58) return { text: 'A bit early',   color: '#ffaa44' };
    if (pct <= 0.85) return { text: 'Perfect!',     color: '#44ff88' };
    if (pct <= 0.95) return { text: 'A bit late',   color: '#ffcc44' };
    return                  { text: 'Burnt!',        color: '#ff3333' };
  }

  // ── init ──
  function initGame() {
    pancakeNum = 1; totalStars = 0; frameCount = 0;
    startPancake();
  }

  function startPancake() {
    cookTime = getCookTime(pancakeNum);
    cookTimer = 0; stateTimer = 0; feedbackTimer = 0;
    pourRadius = 0; flipTimer = 0; flipScaleY = 1; flipSideCooked = false;
    side1Pct = 0; side2Pct = 0;
    bubbles = []; particles = []; feedback = null;
    steam = Array.from({ length: 12 }, makeSteam);
    state = 'pouring';
  }

  // ── actions ──
  function doFlip() {
    if (state !== 'cooking1') return;
    side1Pct = getPoppedFraction();
    const fb = feedbackFor(side1Pct);
    setFeedback(fb.text, fb.color);
    state = 'flipping';
    flipTimer = 0; flipScaleY = 1; flipSideCooked = false;
  }

  function doPlate() {
    if (state !== 'cooking2') return;
    side2Pct = getPoppedFraction();
    const s1 = calcStars(side1Pct);
    const s2 = calcStars(side2Pct);
    const pStars = Math.min(s1, s2);
    totalStars += pStars;
    const fb = feedbackFor(side2Pct);
    const label = fb.text + (pStars > 0 ? '  ' + '⭐'.repeat(pStars) : '  (No stars)');
    setFeedback(label, fb.color);
    state = 'scored';
    stateTimer = SCORE_DUR;
    spawnPlateParticles();
  }

  function setFeedback(text, color) {
    feedback = { text, color, y: 138, alpha: 1 };
    feedbackTimer = 1.8;
  }

  function spawnPlateParticles() {
    for (let i = 0; i < 22; i++) {
      const angle = rng(0, Math.PI * 2);
      const spd = rng(1.5, 5);
      particles.push({
        x: PAN_X, y: PAN_Y,
        vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 2,
        r: rng(3, 7), color: ['#f5d080', '#ffcc44', '#e8a040', '#ffffff'][Math.floor(Math.random() * 4)],
        life: 1, decay: rng(0.018, 0.035),
      });
    }
  }

  // ── update ──
  function update(dt) {
    frameCount++;

    // Steam
    if (state === 'pouring' || state === 'cooking1' || state === 'cooking2') {
      steam.forEach(s => {
        s.x += s.vx; s.y += s.vy; s.alpha -= dt * 0.28;
        s.size += dt * 0.9; s.life -= dt * 0.38;
        if (s.life <= 0 || s.alpha <= 0) Object.assign(s, makeSteam());
      });
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Feedback float
    if (feedbackTimer > 0) {
      feedbackTimer -= dt;
      if (feedback) { feedback.y -= dt * 36; feedback.alpha = clamp(feedbackTimer / 1.2, 0, 1); }
    }

    if (state === 'pouring') {
      pourRadius += dt * (BATTER_R / 0.55);
      if (pourRadius >= BATTER_R) {
        pourRadius = BATTER_R;
        state = 'cooking1';
        cookTimer = 0;
        spawnBubbles(1);
      }
      return;
    }

    if (state === 'cooking1' || state === 'cooking2') {
      const sp = state === 'cooking2' ? 0.65 : 1;
      cookTimer += dt;

      bubbles.forEach(b => {
        b.age += dt;
        if (b.state === 'forming') {
          b.r = Math.min(b.maxR, b.maxR * (b.age / b.formTime));
          if (b.age >= b.formTime) b.state = 'ready';
        }
        if ((b.state === 'ready' || b.state === 'forming') && cookTimer >= b.popDelay * sp) {
          b.state = 'popping'; b.r = 0; b.ringR = b.maxR; b.ringAlpha = 0.85;
        }
        if (b.state === 'popping') {
          b.ringR += dt * 22;
          b.ringAlpha -= dt * 1.6;
          if (b.ringAlpha <= 0) { b.ringAlpha = 0; b.state = 'done'; }
        }
      });

      // Auto-force if truly burnt (all done + 20% extra time)
      if (bubbles.every(b => b.state === 'done') && cookTimer > cookTime * 1.18) {
        if (state === 'cooking1') doFlip();
        else doPlate();
      }
      return;
    }

    if (state === 'flipping') {
      flipTimer += dt;
      const prog = flipTimer / FLIP_DUR;
      flipScaleY = Math.abs(Math.cos(prog * Math.PI));
      if (prog >= 0.5 && !flipSideCooked) flipSideCooked = true;
      if (flipTimer >= FLIP_DUR) {
        state = 'cooking2';
        cookTimer = 0;
        spawnBubbles(0.65);
      }
      return;
    }

    if (state === 'scored') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        if (pancakeNum >= TOTAL_PANCAKES) state = 'gameover';
        else { pancakeNum++; startPancake(); }
      }
    }
  }

  // ── draw helpers ──
  function drawBackground() {
    ctx.fillStyle = '#211810';
    ctx.fillRect(0, 0, 800, 400);
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 800; x += 38) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 400); ctx.stroke(); }
    for (let y = 0; y < 400; y += 38) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }
  }

  function drawPan() {
    // Handle
    ctx.fillStyle = '#151515';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.roundRect(PAN_X + PAN_R - 4, PAN_Y - 15, 94, 30, 15); ctx.fill();
    ctx.fillStyle = '#2e2e2e';
    ctx.beginPath(); ctx.roundRect(PAN_X + PAN_R, PAN_Y - 11, 86, 22, 11); ctx.fill();
    ctx.shadowBlur = 0;
    // Rim
    ctx.shadowColor = '#000'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#1e1e1e';
    ctx.beginPath(); ctx.arc(PAN_X, PAN_Y, PAN_R + 10, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Inner surface
    const pg = ctx.createRadialGradient(PAN_X - 25, PAN_Y - 25, 8, PAN_X, PAN_Y, PAN_R);
    pg.addColorStop(0, '#3d3d3d'); pg.addColorStop(1, '#181818');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(PAN_X, PAN_Y, PAN_R, 0, Math.PI * 2); ctx.fill();
    // Specular rim
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(PAN_X, PAN_Y, PAN_R + 3, Math.PI * 1.05, Math.PI * 1.9); ctx.stroke();
  }

  function drawBatter() {
    const r = state === 'pouring' ? pourRadius : BATTER_R;
    const scaleY = state === 'flipping' ? flipScaleY : 1;
    const cooked = flipSideCooked || state === 'cooking2' || state === 'scored';
    const browning = (state === 'cooking1' || state === 'cooking2')
      ? clamp(cookTimer / cookTime, 0, 1) : (cooked ? 0.55 : 0);

    ctx.save();
    ctx.translate(PAN_X, PAN_Y);
    ctx.scale(1, scaleY);

    // Clip
    ctx.beginPath(); ctx.arc(0, 0, r + 1, 0, Math.PI * 2); ctx.clip();

    // Base color
    const cCenter = cooked ? '#c8882a' : '#f2c86a';
    const cEdge   = cooked ? '#7a3a00' : '#d49030';
    const bg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    bg.addColorStop(0,   cCenter);
    bg.addColorStop(0.75, cEdge);
    bg.addColorStop(1,   '#5a2200');
    ctx.fillStyle = bg;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    // Edge browning overlay (expands inward)
    if (browning > 0.05) {
      const innerR = r * clamp(1 - browning * 0.75, 0, 1);
      const ov = ctx.createRadialGradient(0, 0, innerR, 0, 0, r);
      ov.addColorStop(0,   'rgba(80,28,0,0)');
      ov.addColorStop(0.4, `rgba(90,30,0,${browning * 0.55})`);
      ov.addColorStop(1,   `rgba(30,8,0,${clamp(browning * 1.3, 0, 1)})`);
      ctx.fillStyle = ov;
      ctx.fillRect(-r, -r, r * 2, r * 2);
    }

    ctx.restore();
  }

  function drawBubbles() {
    if (!bubbles.length) return;
    const scaleY = state === 'flipping' ? flipScaleY : 1;
    ctx.save();
    ctx.translate(PAN_X, PAN_Y);
    ctx.scale(1, scaleY);

    bubbles.forEach(b => {
      if (b.state === 'forming' || b.state === 'ready') {
        // Outer circle
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 0.9; ctx.stroke();
        // Highlight
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fill();
      }
      if (b.state === 'popping' && b.ringAlpha > 0) {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.ringR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(195,148,60,${b.ringAlpha})`; ctx.lineWidth = 1.4; ctx.stroke();
      }
    });
    ctx.restore();
  }

  function drawSteam() {
    if (state !== 'pouring' && state !== 'cooking1' && state !== 'cooking2') return;
    ctx.save();
    ctx.translate(PAN_X, PAN_Y);
    steam.forEach(s => {
      if (s.alpha <= 0) return;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,210,210,${s.alpha})`; ctx.fill();
    });
    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r * p.life), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawButton() {
    if (state !== 'cooking1' && state !== 'cooking2') return;
    const isFlip = state === 'cooking1';
    const label  = isFlip ? 'FLIP !' : 'PLATE IT !';
    const pct    = getPoppedFraction();
    const perfect = pct >= 0.58 && pct <= 0.85;
    const color  = perfect ? '#44ff88' : (pct > 0.85 ? '#ff5533' : '#ff9922');
    const pulse  = perfect ? 1 + Math.sin(frameCount * 0.14) * 0.055 : 1;

    ctx.save();
    ctx.translate(BTN_X, BTN_Y);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = color; ctx.shadowBlur = perfect ? 22 : 10;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(-88, -24, 176, 48, 24); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#111';
    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText(label, 0, 7);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawHUD() {
    // Top-left: pancake counter
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Pancake  ${pancakeNum} / ${TOTAL_PANCAKES}`, 18, 28);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.font = '11px monospace';
    ctx.fillText('ESC = MENU  •  SPACE = action', 18, 46);

    // Top-right: star total
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffcc44'; ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 8;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`⭐  ${totalStars}`, 782, 28);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';

    // Bubble progress bar (bottom strip, only while cooking)
    if (state === 'cooking1' || state === 'cooking2') {
      const pct = getPoppedFraction();
      const bw = 210, bx = BTN_X - bw / 2, by = 390;

      // Perfect-window highlight
      ctx.fillStyle = 'rgba(68,255,136,0.18)';
      ctx.fillRect(bx + bw * 0.58, by, bw * 0.27, 7);

      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(bx, by, bw, 7);

      const barCol = (pct >= 0.58 && pct <= 0.85) ? '#44ff88' : pct > 0.85 ? '#ff5533' : '#ffcc44';
      ctx.fillStyle = barCol;
      ctx.fillRect(bx, by, bw * pct, 7);

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`${Math.round(pct * 100)}% bubbles popped  —  green zone = perfect`, BTN_X, by - 5);
      ctx.textAlign = 'left';
    }
  }

  function drawFeedback() {
    if (!feedback || feedbackTimer <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(feedback.alpha, 0, 1);
    ctx.shadowColor = feedback.color; ctx.shadowBlur = 16;
    ctx.fillStyle = feedback.color;
    ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
    ctx.fillText(feedback.text, PAN_X, feedback.y);
    ctx.restore(); ctx.textAlign = 'left';
  }

  function drawScoredOverlay() {
    if (state !== 'scored' && state !== 'gameover') return;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 800, 400);
    ctx.textAlign = 'center';

    if (state === 'gameover') {
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 46px monospace';
      ctx.fillText("All Pancakes Done!", 400, 88);
      ctx.shadowBlur = 0;

      // Draw pancake stack
      for (let i = TOTAL_PANCAKES - 1; i >= 0; i--) {
        const sy = 260 - i * 17;
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
        ctx.fillStyle = i % 2 === 0 ? '#d49030' : '#bb7418';
        ctx.beginPath(); ctx.ellipse(400, sy, 62, 13, 0, 0, Math.PI * 2); ctx.fill();
        // Butter pat on top pancake
        if (i === TOTAL_PANCAKES - 1) {
          ctx.fillStyle = '#ffe088';
          ctx.beginPath(); ctx.ellipse(400, sy - 4, 14, 6, 0.2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`Final score:  ⭐  ${totalStars}  /  ${TOTAL_PANCAKES * 3}  stars`, 400, 318);

      ctx.fillStyle = '#44ff88'; ctx.shadowColor = '#44ff88'; ctx.shadowBlur = 10;
      ctx.font = '18px monospace'; ctx.fillText('SPACE  —  play again', 400, 356);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.font = '14px monospace';
      ctx.fillText('ESC  —  main menu', 400, 382);
      ctx.textAlign = 'left';
      return;
    }

    // Per-pancake score
    const s1 = calcStars(side1Pct), s2 = calcStars(side2Pct);
    const pStars = Math.min(s1, s2);

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px monospace';
    ctx.fillText(`Pancake ${pancakeNum} complete`, 400, 145);

    ctx.font = '38px monospace';
    ctx.fillText(
      pStars > 0 ? '⭐'.repeat(pStars) + '☆'.repeat(3 - pStars) : '☆ ☆ ☆  (no stars)',
      400, 195
    );

    ctx.fillStyle = 'rgba(255,255,255,0.48)'; ctx.font = '14px monospace';
    ctx.fillText(
      `Side 1: ${Math.round(side1Pct * 100)}% popped   |   Side 2: ${Math.round(side2Pct * 100)}% popped`,
      400, 232
    );

    ctx.fillStyle = '#ffcc44'; ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 6;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Running total:  ⭐  ${totalStars}`, 400, 265);
    ctx.shadowBlur = 0;

    if (pancakeNum < TOTAL_PANCAKES) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '14px monospace';
      ctx.fillText('Next pancake loading…', 400, 300);
    }
    ctx.textAlign = 'left';
  }

  // ── main loop ──
  function draw() {
    ctx.clearRect(0, 0, 800, 400);
    drawBackground();
    drawPan();
    if (state !== 'gameover') {
      drawBatter();
      if (state !== 'flipping') drawBubbles();
      drawSteam();
    }
    drawParticles();
    drawButton();
    drawHUD();
    drawFeedback();
    drawScoredOverlay();
  }

  function loop(ts) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let xNow = false;
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) xNow = true; break; }
    if (xNow && !gpXWasPressed && state === 'gameover') { gpXWasPressed = false; stop(); showMenu(); return; }
    gpXWasPressed = xNow;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    animFrame = requestAnimationFrame(loop);
  }

  // ── input ──
  function hitBtn(mx, my) { return Math.abs(mx - BTN_X) <= 90 && Math.abs(my - BTN_Y) <= 26; }

  function screenToCanvas(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (cx - r.left) * (canvas.width  / r.width),
      y: (cy - r.top)  * (canvas.height / r.height),
    };
  }

  function handleAction(mx, my) {
    if (hitBtn(mx, my)) {
      if (state === 'cooking1') doFlip();
      else if (state === 'cooking2') doPlate();
    }
  }

  function onClick(e) {
    const { x, y } = screenToCanvas(e.clientX, e.clientY);
    handleAction(x, y);
  }

  function onTouchEnd(e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    const { x, y } = screenToCanvas(t.clientX, t.clientY);
    handleAction(x, y);
  }

  function onKeyDown(e) {
    if (e.code === 'Escape') { stop(); showMenu(); return; }
    if (e.code === 'Space') {
      if (state === 'gameover')  { initGame(); return; }
      if (state === 'cooking1')  doFlip();
      else if (state === 'cooking2') doPlate();
    }
  }

  // ── lifecycle ──
  function start() {
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    canvas.addEventListener('click', onClick);
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    initGame();
    lastTime = performance.now();
    animFrame = requestAnimationFrame(loop);
  }

  function stop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    document.removeEventListener('keydown', onKeyDown);
    canvas.removeEventListener('click', onClick);
    canvas.removeEventListener('touchend', onTouchEnd);
  }

  return { start, stop };
})();
