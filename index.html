  }

  // ── Physics ────────────────────────────────────────────────────────────────
  function bounceOff(nx, ny, e, kick) {
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
      ball.vx -= (1 + e) * vn * nx; ball.vy -= (1 + e) * vn * ny;
      if (kick) { ball.vx += nx * kick; ball.vy += ny * kick; }
      return -vn;
    }
    return 0;
  }

  function collideSeg(s) {
    const dx = s.bx - s.ax, dy = s.by - s.ay, l2 = dx * dx + dy * dy;
    const t = clamp(((ball.x - s.ax) * dx + (ball.y - s.ay) * dy) / l2, 0, 1);
    const cx = s.ax + dx * t, cy = s.ay + dy * t;
    let nx = ball.x - cx, ny = ball.y - cy, d = Math.hypot(nx, ny);
    if (d >= R) return;
    if (d < 1e-6) { const l = Math.sqrt(l2); nx = -dy / l; ny = dx / l; d = 1; }
    nx /= d; ny /= d;
    ball.x = cx + nx * R; ball.y = cy + ny * R;
    const imp = bounceOff(nx, ny, s.e, s.kick);
    if (imp > 1.5 && s.score) {
      s.hit = 10; addScore(s.score, TX + ball.x, TY + ball.y - 10);
      tone(240, 0.06, 'square', 0.025, 420);
    }
  }

  function collideBumper(b) {
    const dx = ball.x - b.x, dy = ball.y - b.y, d = Math.hypot(dx, dy), min = R + b.r;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d;
    ball.x = b.x + nx * min; ball.y = b.y + ny * min;
    const imp = bounceOff(nx, ny, 0.6, b.r > 10 ? 4.5 : 2);
    if (imp > 0.5) {
      b.hit = 12;
      addScore(b.score, TX + b.x, TY + b.y - b.r - 6);
      burst(b.x, b.y, b.color, 8);
      tone(b.r > 10 ? 520 + Math.random() * 200 : 880, 0.08, 'square', 0.03, 300);
    }
  }

  function flipperTip(f) { return { x: f.px + Math.cos(f.ang) * FLIP_LEN, y: f.py + Math.sin(f.ang) * FLIP_LEN }; }

  function collideFlipper(f) {
    const tip = flipperTip(f);
    const dx = tip.x - f.px, dy = tip.y - f.py, l2 = dx * dx + dy * dy;
    const t = clamp(((ball.x - f.px) * dx + (ball.y - f.py) * dy) / l2, 0, 1);
    const cx = f.px + dx * t, cy = f.py + dy * t;
    let nx = ball.x - cx, ny = ball.y - cy, d = Math.hypot(nx, ny);
    const min = R + FLIP_R;
    if (d >= min) return;
    if (d < 1e-6) { nx = 0; ny = -1; d = 1; }
    nx /= d; ny /= d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    // speed of the flipper surface at the contact point
    const rx = cx - f.px, ry = cy - f.py;
    const sx = -f.w * ry, sy = f.w * rx;
    const vn = (ball.vx - sx) * nx + (ball.vy - sy) * ny;
    if (vn < 0) {
      const j = -(1 + 0.35) * vn;
      ball.vx += nx * j; ball.vy += ny * j;
      if (Math.abs(f.w) > 0.01) tone(150, 0.05, 'triangle', 0.03, 90);
    }
  }

  function moveFlippers() {
    for (const f of FLIPS) {
      const target = f.keysDown ? f.up : f.rest;
      const old = f.ang, step = FLIP_SPEED * HS;
      if (Math.abs(target - f.ang) <= step) f.ang = target;
      else f.ang += Math.sign(target - f.ang) * step;
      f.w = (f.ang - old) / HS;                               // angular speed per frame
    }
  }

  function substep() {
    moveFlippers();
    if (state === 'launch') return;
    ball.vy += GRAV * HS;
    ball.x += ball.vx * HS; ball.y += ball.vy * HS;
    for (const s of segs) collideSeg(s);
    for (const b of bumpers) collideBumper(b);
    for (const f of FLIPS) collideFlipper(f);
    const v = Math.hypot(ball.vx, ball.vy);
    if (v > MAX_V) { ball.vx *= MAX_V / v; ball.vy *= MAX_V / v; }
  }

  function update() {
    frameN++;
    FLIPS[0].keysDown = !!(keys.KeyA || keys.KeyZ || keys.ArrowLeft || keys.ShiftLeft || padLeft);
    FLIPS[1].keysDown = !!(keys.KeyD || keys.KeyM || keys.ArrowRight || keys.ShiftRight || padRight);
    if (msgT > 0) msgT--;
    for (const b of bumpers) if (b.hit > 0) b.hit--;
    for (const s of segs) if (s.hit > 0) s.hit--;
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 0.6; p.life--; }
    popups = popups.filter(p => p.life > 0);

    if (state === 'over') return;
    if (state === 'launch') {
      const hold = keys.Space || keys.ArrowDown || padPlunge;
      if (hold) { charging = true; power = Math.min(1, power + 0.022); }
      else if (charging) launch();
      ball.y = LANE_REST_Y + power * 12;
      for (let i = 0; i < SUB; i++) moveFlippers();
      return;
    }
    if (state === 'drain') { drainT--; if (drainT <= 0) newBall(); return; }

    for (let i = 0; i < SUB; i++) substep();
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 6) { ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 8) ball.trail.shift(); }
    else if (ball.trail.length) ball.trail.shift();

    // ball fell back into the lane and stopped: let the player launch again
    if (ball.x > 268 && ball.y > 360 && sp < 0.6) { newBall(); return; }
    // anti-stall nudge
    if (sp < 0.25 && !(ball.x > 268)) { stallT++; if (stallT > 100) { ball.vx += (Math.random() < 0.5 ? -1 : 1) * 1.6; ball.vy -= 1.2; stallT = 0; } } else stallT = 0;
    if (ball.y > TH - 4) drain();
  }

  // ── Gamepad ────────────────────────────────────────────────────────────────
  let padLeft = false, padRight = false, padPlunge = false;
  function pollGamepad() {
    padLeft = padRight = padPlunge = false;
    let xNow = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp) continue;
      if (gp.buttons[4]?.pressed || gp.buttons[6]?.pressed || gp.buttons[14]?.pressed || (gp.axes[0] || 0) < -0.5) padLeft = true;
      if (gp.buttons[5]?.pressed || gp.buttons[7]?.pressed || gp.buttons[15]?.pressed || (gp.axes[0] || 0) > 0.5) padRight = true;
      if (gp.buttons[0]?.pressed) xNow = true;
      break;
    }
    const fired = xNow && !gpXWas;
    gpXWas = xNow;
    if (state === 'over') { if (fired && frameN - overAt > 40) { stop(); showMenu(); return true; } }
    else if (state === 'launch') padPlunge = xNow;
    return false;
  }

  // ── Drawing ────────────────────────────────────────────────────────────────
  function glowLine(ax, ay, bx, by, color, w) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawTable() {
    // table background
    const g = ctx.createLinearGradient(0, 0, 0, TH);
    g.addColorStop(0, '#0d0638'); g.addColorStop(1, '#050218');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 150);
    for (let i = 0; i <= ARC; i++) { const a = Math.PI + (i / ARC) * Math.PI; ctx.lineTo(150 + 150 * Math.cos(a), 150 + 150 * Math.sin(a)); }
    ctx.lineTo(300, TH); ctx.lineTo(0, TH); ctx.closePath(); ctx.fill();

    // faint grid
    ctx.strokeStyle = 'rgba(120,100,255,0.06)'; ctx.lineWidth = 1;
    for (let x = 0; x <= TW; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, TH); ctx.stroke(); }
    for (let y = 0; y <= TH; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(TW, y); ctx.stroke(); }

    // lane tint
    ctx.fillStyle = 'rgba(0,234,255,0.06)'; ctx.fillRect(268, 150, 32, 226);

    // walls
    for (const s of segs) {
      const lit = s.hit > 0;
      glowLine(s.ax, s.ay, s.bx, s.by, lit ? '#ffffff' : s.color, lit ? 4 : 2.5);
    }
    // slingshot fill
    ctx.fillStyle = 'rgba(255,102,0,0.15)';
    ctx.beginPath(); ctx.moveTo(36, 248); ctx.lineTo(66, 296); ctx.lineTo(36, 296); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(232, 248); ctx.lineTo(202, 296); ctx.lineTo(232, 296); ctx.closePath(); ctx.fill();

    // bumpers
    for (const b of bumpers) {
      const lit = b.hit > 0, pulse = lit ? 1 + b.hit * 0.015 : 1 + Math.sin(frameN * 0.06 + b.x) * 0.03;
      ctx.shadowColor = b.color; ctx.shadowBlur = lit ? 26 : 12;
      ctx.fillStyle = lit ? '#ffffff' : 'rgba(255,255,255,0.08)';
      ctx.strokeStyle = b.color; ctx.lineWidth = b.r > 10 ? 3 : 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * pulse, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      if (b.r > 10) { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, TAU); ctx.fill(); }
    }

    // flippers
    for (const f of FLIPS) {
      const tip = flipperTip(f);
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#ff6600'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = f.keysDown ? 18 : 8;
      ctx.lineWidth = FLIP_R * 2 + 2;
      ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffcc88'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(f.px, f.py, 3, 0, TAU); ctx.fill();
    }

    // plunger
    const py = (state === 'launch' ? LANE_REST_Y + power * 12 : LANE_REST_Y) + R;
    ctx.strokeStyle = '#8890b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(LANE_X, py + 2);
    for (let i = 1; i <= 6; i++) ctx.lineTo(LANE_X + (i % 2 ? 7 : -7), py + 2 + i * ((376 + 12 - py) / 6 + 0.1));
    ctx.stroke();
    ctx.fillStyle = '#c7ccf0'; ctx.fillRect(LANE_X - 9, py, 18, 4);

    // ball
    ball.trail.forEach((t, i) => { ctx.fillStyle = `rgba(255,255,255,${(i / ball.trail.length) * 0.22})`; ctx.beginPath(); ctx.arc(t.x, t.y, R * (0.4 + 0.6 * i / ball.trail.length), 0, TAU); ctx.fill(); });
    if (state !== 'drain' && state !== 'over') {
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
      const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, R);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#9fb0e8');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    }

    // particles
    for (const p of particles) { ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
  }

  function panelText(text, x, y, size, color, align, glow) {
    ctx.textAlign = align; ctx.font = `bold ${size}px monospace`; ctx.fillStyle = color;
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
    ctx.fillText(text, x, y); ctx.shadowBlur = 0;
  }

  function drawPanels() {
    // left: score
    panelText('PINBALL', 120, 44, 26, '#ffffff', 'center', 14);
    panelText('SCORE', 120, 100, 13, 'rgba(255,255,255,0.5)', 'center');
    panelText(String(score), 120, 140, 38, '#00eaff', 'center', 14);
    panelText('BEST', 120, 190, 13, 'rgba(255,255,255,0.5)', 'center');
    panelText(String(Math.max(best, score)), 120, 220, 26, '#ffd24a', 'center', 8);
    panelText('BALLS', 120, 275, 13, 'rgba(255,255,255,0.5)', 'center');
    for (let i = 0; i < Math.min(ballsLeft, 6); i++) {
      const cx = 120 + (i - (Math.min(ballsLeft, 6) - 1) / 2) * 24;
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 8; ctx.fillStyle = '#e8ecff';
      ctx.beginPath(); ctx.arc(cx, 300, 8, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    }
    // right: controls
    const lines = [
      ['CONTROLS', '#ffffff', 15],
      ['LEFT FLIPPER', '#ff6600', 11], ['A  Z  ←  L-SHIFT', 'rgba(255,255,255,0.75)', 12],
      ['RIGHT FLIPPER', '#ff6600', 11], ['D  M  →  R-SHIFT', 'rgba(255,255,255,0.75)', 12],
      ['LAUNCH', '#00eaff', 11], ['hold SPACE or ↓,', 'rgba(255,255,255,0.75)', 12], ['let go to shoot', 'rgba(255,255,255,0.75)', 12],
      ['ESC = menu', 'rgba(255,255,255,0.4)', 11],
    ];
    let y = 70;
    for (const [t, c, s] of lines) { panelText(t, 680, y, s, c, 'center', s === 15 ? 10 : 0); y += s === 15 ? 30 : (c === '#ff6600' || c === '#00eaff' ? 22 : 20); if (t === 'let go to shoot') y += 8; if (t === 'A  Z  ←  L-SHIFT' || t === 'D  M  →  R-SHIFT') y += 6; }
    // power meter
    if (state === 'launch') {
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(TX + 304 - 4, 0, 0, 0);
      panelText('POWER', 680, 322, 11, 'rgba(255,255,255,0.5)', 'center');
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(620, 330, 120, 10);
      ctx.fillStyle = power > 0.8 ? '#ff4455' : '#00eaff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
      ctx.fillRect(620, 330, 120 * power, 10); ctx.shadowBlur = 0;
    }
  }

  function draw() {
    ctx.fillStyle = '#030010'; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.15 * Math.sin(frameN * 0.03 + s.t)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); });
    drawPanels();
    ctx.save(); ctx.translate(TX, TY);
    drawTable();
    // score popups
    ctx.restore();
    for (const p of popups) { ctx.globalAlpha = p.life / 40; panelText(p.text, p.x, p.y, 13, '#ffffff', 'center', 6); }
    ctx.globalAlpha = 1;

    if (msgT > 0 && state !== 'over') { ctx.globalAlpha = Math.min(1, msgT / 30); panelText(msg, TX + TW / 2, 220, 24, '#ff44cc', 'center', 16); ctx.globalAlpha = 1; }
    if (state === 'launch' && !charging && Math.floor(frameN / 30) % 2 === 0 && score === 0) panelText('HOLD SPACE', TX + 150, 250, 15, '#00eaff', 'center', 8);

    if (state === 'over') {
      ctx.fillStyle = 'rgba(3,0,16,0.82)'; ctx.fillRect(0, 0, W, H);
      panelText('GAME OVER', W / 2, 140, 44, '#ff44cc', 'center', 20);
      panelText('Score ' + score, W / 2, 195, 24, '#00eaff', 'center', 10);
      panelText((score >= best && score > 0 ? 'NEW BEST!  ' : 'Best ') + best, W / 2, 230, 20, '#ffd24a', 'center', 8);
      panelText('SPACE / ENTER = play again      ESC = menu', W / 2, 290, 14, 'rgba(255,255,255,0.8)', 'center');
    }
    ctx.textAlign = 'left';
  }

  // ── Loop / input ───────────────────────────────────────────────────────────
  function loop(ts) {
    if (!running) return;
    animId = requestAnimationFrame(loop);
    acc += Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
    while (acc >= 1 / 60) {
      if (pollGamepad()) return;
      update(); acc -= 1 / 60;
    }
    draw();
  }

  const BLOCK = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'ShiftLeft', 'ShiftRight']);
  function onKeyDown(e) {
    if (BLOCK.has(e.code)) e.preventDefault();
    const was = keys[e.code]; keys[e.code] = true;
    if (e.code === 'Escape') { stop(); showMenu(); return; }
    if (state === 'over' && !was && frameN - overAt > 40 && (e.code === 'Space' || e.code === 'Enter')) newGame();
  }
  function onKeyUp(e) { keys[e.code] = false; }
  function onBlur() { Object.keys(keys).forEach(k => delete keys[k]); }

  // touch: left half = left flipper, right half = right flipper; touch the lane side to launch
  const touches = {};
  function applyTouches() {
    let l = false, r = false;
    for (const id in touches) { if (touches[id] < W / 2) l = true; else r = true; }
    keys.ArrowLeft = l; keys.ArrowRight = r;
  }
  function onTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (const t of e.changedTouches) touches[t.identifier] = (t.clientX - rect.left) * (W / rect.width);
    applyTouches();
    if (state === 'launch') { power = 0.8; launch(); }
    else if (state === 'over' && frameN - overAt > 40) newGame();
  }
  function onTouchEnd(e) { e.preventDefault(); for (const t of e.changedTouches) delete touches[t.identifier]; applyTouches(); }

  function stop() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup', onKeyUp);
    window.removeEventListener('blur', onBlur);
    canvas.removeEventListener('touchstart', onTouchStart);
    canvas.removeEventListener('touchend', onTouchEnd);
    canvas.removeEventListener('touchcancel', onTouchEnd);
    Object.keys(keys).forEach(k => delete keys[k]);
    Object.keys(touches).forEach(k => delete touches[k]);
  }

  function start() {
    stop();
    running = true;
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', onBlur);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
    frameN = 0; acc = 0; lastTs = performance.now();
    FLIPS[0].ang = FLIPS[0].rest; FLIPS[1].ang = FLIPS[1].rest;
    gpXWas = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) gpXWas = true; break; }
    newGame();
    animId = requestAnimationFrame(loop);
  }

  return { start, stop };
})();

</script>
</body>
</html>
