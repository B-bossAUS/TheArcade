    let nx = lx - cx, ny = ly - cy, dist = Math.hypot(nx, ny);
    if (dist >= BALL_R) return;
    if (dist < 0.0001) {                                          // centre is inside the car: push out the short way
      const px = hw - Math.abs(lx), py = hh - Math.abs(ly);
      if (px < py) { nx = Math.sign(lx) || 1; ny = 0; cx = nx * hw; cy = ly; }
      else { nx = 0; ny = Math.sign(ly) || -1; cx = lx; cy = ny * hh; }
      dist = 0;
    } else { nx /= dist; ny /= dist; }
    const wnx = nx * cs - ny * sn, wny = nx * sn + ny * cs;       // normal in world coords
    const rx = cx * cs - cy * sn, ry = cx * sn + cy * cs;         // contact offset from the car centre
    const cvx = c.vx - c.av * ry, cvy = c.vy + c.av * rx;         // car speed at the contact point (includes spin)
    const pen = BALL_R - dist;
    b.x += wnx * pen; b.y += wny * pen;
    const vn = (b.vx - cvx) * wnx + (b.vy - cvy) * wny;
    if (vn < 0) {
      const j = -(1 + E_CAR) * vn;
      const kick = 1 + (c.flipT > 0 ? 3.5 : 0) + (c.boosting ? 1 : 0);
      b.vx += wnx * (j + kick); b.vy += wny * (j + kick);
      c.vx -= wnx * j * 0.06; c.vy -= wny * j * 0.06;
      if (j > 3.5 && soundCd <= 0) {
        soundCd = 6;
        tone(150 + Math.random() * 60, 0.07, 'triangle', Math.min(0.09, 0.015 + j * 0.006), 70);
        for (let k = 0; k < 6; k++) {
          const a = Math.random() * TAU, s = 1 + Math.random() * 3;
          particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 12, max: 12, color: '#ffffff', size: 2, grav: 0 });
        }
      }
    }
    const v = Math.hypot(b.vx, b.vy);
    if (v > MAX_BALL_V) { b.vx *= MAX_BALL_V / v; b.vy *= MAX_BALL_V / v; }
  }

  function carCar() {
    const a = cars[0], b = cars[1];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), R = 21;
    if (d >= R * 2 || d === 0) return;
    const nx = dx / d, ny = dy / d, pen = R * 2 - d;
    a.x -= nx * pen / 2; a.y -= ny * pen / 2;
    b.x += nx * pen / 2; b.y += ny * pen / 2;
    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (vn < 0) {
      const j = -(1 + 0.4) * vn / 2;
      a.vx -= nx * j; a.vy -= ny * j;
      b.vx += nx * j; b.vy += ny * j;
    }
  }

  // ── Physics step ───────────────────────────────────────────────────────────
  function substep() {
    for (const c of cars) {
      c.onGround = false;
      c.vy += CAR_GRAV * HS;
      c.x += c.vx * HS; c.y += c.vy * HS; c.ang += c.av * HS;
      resolveCarArena(c);
    }
    ball.vy += BALL_GRAV * HS;
    ball.vx *= Math.pow(0.9985, HS);
    ball.x += ball.vx * HS; ball.y += ball.vy * HS;
    ball.rot += (ball.vx / BALL_R) * HS;
    ballArena();
    for (const c of cars) carBall(c);
    carCar();
    for (const c of cars) resolveCarArena(c);
  }

  function physics() {
    if (soundCd > 0) soundCd--;
    for (const c of cars) { c.in = c.ai ? aiInput(c) : humanInput(c); control(c); }
    for (let s = 0; s < SUB; s++) substep();
    for (const c of cars) {
      c.ang = wrapAngle(c.ang);
      if (c.onGround) {                               // land, then roll back onto the wheels
        c.jumps = 0; c.flipT = 0; c.av = 0;
        c.ang *= 0.72; if (Math.abs(c.ang) < 0.002) c.ang = 0;
      } else if (c.jumps === 0) c.jumps = 1;
    }
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 7) { ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 9) ball.trail.shift(); }
    else if (ball.trail.length) ball.trail.shift();
  }

  function updateParticles() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }

  function pollGamepadX() {
    let now = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) now = true; break; }
    const fired = now && !gpXWas;
    gpXWas = now;
    return fired;
  }

  // ── Update ─────────────────────────────────────────────────────────────────
  function update() {
    frameN++;
    const gpX = pollGamepadX();
    if (screen !== 'match') return;
    if (shake > 0) shake = Math.max(0, shake - 0.6);
    if (goFlash > 0) goFlash--;
    if (paused) return;

    if (phase === 'over') {
      updateParticles();
      if (gpX) { stop(); showMenu(); }
      return;
    }
    if (phase === 'countdown') {
      cdFrames--;
      if (cdFrames > 0 && cdFrames % 60 === 0) tone(440, 0.12, 'square', 0.03);
      if (cdFrames <= 0) { phase = 'play'; goFlash = 45; tone(880, 0.3, 'square', 0.04); }
      updateParticles();
      return;
    }

    if (phase === 'goal') {
      goalFrames--;
      if (frameN % 2 === 0) physics();               // slow motion
      updateParticles();
      if (goalFrames <= 0) {
        if (winner >= 0) endMatch(winner); else resetKickoff(120);
      }
      return;
    }

    // phase === 'play'
    physics();
    updateParticles();
    if (!overtime) {
      timeLeft--;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (scores[0] === scores[1]) { overtime = true; melody([330, 330, 440], 140, 'square', 0.04); }
        else { endMatch(scores[0] > scores[1] ? 0 : 1); return; }
      }
    } else otFrames++;

    if (ball.y > GOAL_TOP && ball.x + BALL_R < WALL_L) scoreGoal(1);
    else if (ball.y > GOAL_TOP && ball.x - BALL_R > WALL_R) scoreGoal(0);
  }

  // ── Drawing ────────────────────────────────────────────────────────────────
  const STARS = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, t: Math.random() * TAU }));

  function drawCarShape(color, boosting, big) {
    // Drawn pointing right, wheels down, centred on (0,0). Collision box is 46x20.
    ctx.shadowColor = color; ctx.shadowBlur = big ? 14 : 10;
    ctx.fillStyle = color;
    rrect(-23, -2, 46, 9, 3); ctx.fill();                               // lower body
    ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-8, -10); ctx.lineTo(9, -10); ctx.lineTo(16, -2); ctx.closePath(); ctx.fill();   // cabin
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(210,240,255,0.85)';
    ctx.beginPath(); ctx.moveTo(-8, -3.5); ctx.lineTo(-4, -8.5); ctx.lineTo(7, -8.5); ctx.lineTo(11, -3.5); ctx.closePath(); ctx.fill();  // window
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(-23, 3, 46, 2);   // stripe
    ctx.fillStyle = '#fff6a8'; ctx.fillRect(20, 0, 3, 3);               // headlight
    ctx.fillStyle = '#ff4466'; ctx.fillRect(-23, 0, 2, 3);              // tail light
    ctx.fillStyle = '#111';
    for (const wx of [-13, 13]) { ctx.beginPath(); ctx.arc(wx, 6, 4, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#bbb';
    for (const wx of [-13, 13]) { ctx.beginPath(); ctx.arc(wx, 6, 1.5, 0, TAU); ctx.fill(); }
    if (boosting) {
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffb020';
      const f = 10 + Math.random() * 8;
      ctx.beginPath(); ctx.moveTo(-23, -1); ctx.lineTo(-23 - f, 2); ctx.lineTo(-23, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff2a0';
      ctx.beginPath(); ctx.moveTo(-23, 0); ctx.lineTo(-23 - f * 0.55, 2); ctx.lineTo(-23, 4); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawCar(c) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.ang); ctx.scale(c.facing, 1);
    drawCarShape(c.color, c.boosting, false);
    ctx.restore();
  }

  function drawBall() {
    ball.trail.forEach((t, i) => {
      ctx.fillStyle = `rgba(255,255,255,${(i / ball.trail.length) * 0.18})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * (0.5 + i / ball.trail.length * 0.5), 0, TAU); ctx.fill();
    });
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#f4f4ff';
    ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.rotate(ball.rot);
    ctx.fillStyle = '#333';
    for (let k = 0; k < 5; k++) {
      const a = k * TAU / 5;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 8, Math.sin(a) * 8, 2.8, 0, TAU); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawArena() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#06001a'); g.addColorStop(1, '#14004a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => {
      ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.15 * Math.sin(frameN * 0.03 + s.t)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    });

    // grid
    ctx.strokeStyle = 'rgba(130,110,255,0.07)'; ctx.lineWidth = 1;
    for (let x = WALL_L; x <= WALL_R; x += 40) { ctx.beginPath(); ctx.moveTo(x, CEIL); ctx.lineTo(x, FLOOR); ctx.stroke(); }
    for (let y = FLOOR; y >= CEIL; y -= 40) { ctx.beginPath(); ctx.moveTo(WALL_L, y); ctx.lineTo(WALL_R, y); ctx.stroke(); }

    // centre line + circle
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(W / 2, CEIL); ctx.lineTo(W / 2, FLOOR); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(W / 2, FLOOR, 70, Math.PI, TAU); ctx.stroke();

    // goals
    for (const side of [0, 1]) {
      const x0 = side === 0 ? 0 : WALL_R, col = side === 0 ? '51,170,255' : '255,138,31';
      ctx.fillStyle = `rgba(${col},0.16)`; ctx.fillRect(x0, GOAL_TOP, WALL_L, FLOOR - GOAL_TOP);
      ctx.strokeStyle = `rgba(${col},0.35)`; ctx.lineWidth = 1;
      for (let y = GOAL_TOP; y <= FLOOR; y += 12) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + WALL_L, y); ctx.stroke(); }
      for (let x = x0; x <= x0 + WALL_L; x += 10) { ctx.beginPath(); ctx.moveTo(x, GOAL_TOP); ctx.lineTo(x, FLOOR); ctx.stroke(); }
    }

    // below the floor
    ctx.fillStyle = '#0a0524'; ctx.fillRect(0, FLOOR, W, H - FLOOR);

    // outline
    ctx.strokeStyle = '#8fa8ff'; ctx.lineWidth = 3; ctx.shadowColor = '#6a7dff'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, FLOOR); ctx.lineTo(0, GOAL_TOP); ctx.lineTo(WALL_L, GOAL_TOP); ctx.lineTo(WALL_L, CEIL);
    ctx.lineTo(WALL_R, CEIL); ctx.lineTo(WALL_R, GOAL_TOP); ctx.lineTo(W, GOAL_TOP); ctx.lineTo(W, FLOOR);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();
    ctx.shadowBlur = 0;
    // goal posts glow in team colours
    ctx.lineWidth = 4;
    ctx.strokeStyle = C1; ctx.shadowColor = C1; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(0, GOAL_TOP); ctx.lineTo(WALL_L, GOAL_TOP); ctx.stroke();
    ctx.strokeStyle = C2; ctx.shadowColor = C2;
    ctx.beginPath(); ctx.moveTo(WALL_R, GOAL_TOP); ctx.lineTo(W, GOAL_TOP); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function fmtTime(frames) {
    const s = Math.ceil(frames / 60);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function drawBoostBar(x, align, c) {
    const w = 180, bx = align === 'left' ? x : x - w;
    ctx.textAlign = align; ctx.font = 'bold 10px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BOOST', x, 372);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; rrect(bx, 377, w, 10, 5); ctx.fill();
    const frac = c.boost / 100;
    if (frac > 0.01) {
      ctx.fillStyle = frac < 0.25 ? '#ff4455' : c.color;
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = c.boosting ? 12 : 4;
      rrect(bx, 377, Math.max(10, w * frac), 10, 5); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawHUD() {
    // scores
    ctx.textAlign = 'left'; ctx.font = 'bold 12px monospace'; ctx.fillStyle = C1;
    ctx.fillText(numPlayers === 1 ? 'YOU' : 'PLAYER 1', 20, 16);
    ctx.font = 'bold 34px monospace'; ctx.shadowColor = C1; ctx.shadowBlur = 10;
    ctx.fillText(scores[0], 20, 47);
    ctx.textAlign = 'right'; ctx.font = 'bold 12px monospace'; ctx.fillStyle = C2; ctx.shadowBlur = 0;
    ctx.fillText(numPlayers === 1 ? 'CPU' : 'PLAYER 2', W - 20, 16);
    ctx.font = 'bold 34px monospace'; ctx.shadowColor = C2; ctx.shadowBlur = 10;
    ctx.fillText(scores[1], W - 20, 47);
    ctx.shadowBlur = 0;

    // timer
    ctx.textAlign = 'center';
    if (overtime) {
      ctx.fillStyle = Math.floor(frameN / 20) % 2 ? '#ff4455' : '#ff9aa5';
      ctx.font = 'bold 22px monospace'; ctx.fillText('OVERTIME', W / 2, 30);
      ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('NEXT GOAL WINS  ' + fmtTime(otFrames + 59), W / 2, 48);
    } else {
      ctx.fillStyle = timeLeft < 600 ? '#ff6677' : '#ffffff';
      ctx.font = 'bold 28px monospace'; ctx.fillText(fmtTime(timeLeft), W / 2, 34);
      ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('FIRST TO ' + WIN_SCORE, W / 2, 49);
    }

    if (cars.length) { drawBoostBar(20, 'left', cars[0]); drawBoostBar(W - 20, 'right', cars[1]); }
    ctx.textAlign = 'center'; ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(numPlayers === 1 ? 'WASD or ARROWS  ·  SHIFT = boost  ·  ESC = menu' : 'P1: A D W S L-SHIFT   |   P2: ← → ↑ ↓ R-SHIFT', W / 2, 385);
  }

  function bigText(text, y, size, color, glow) {
    ctx.textAlign = 'center'; ctx.font = `bold ${size}px monospace`;
    ctx.fillStyle = color; ctx.shadowColor = glow || color; ctx.shadowBlur = 24;
    ctx.fillText(text, W / 2, y); ctx.shadowBlur = 0;
  }

  function drawOverlays() {
    if (phase === 'countdown' && cdFrames > 0) {
      const n = Math.ceil(cdFrames / 60), t = (cdFrames % 60) / 60;
      ctx.save(); ctx.globalAlpha = 0.4 + 0.6 * t;
      bigText(String(n), 250, 90 + (1 - t) * -10 + t * 20, '#ffffff', '#6a7dff');
      ctx.restore();
    }
    if (goFlash > 0) { ctx.save(); ctx.globalAlpha = goFlash / 45; bigText('GO!', 235, 80, '#66ff99'); ctx.restore(); }
    if (phase === 'goal') {
      const col = lastScorer === 0 ? C1 : C2;
      bigText('GOAL!', 190, 76, col);
      ctx.textAlign = 'center'; ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#fff';
      const who = numPlayers === 1 ? (lastScorer === 0 ? 'YOU SCORE!' : 'CPU SCORES') : 'PLAYER ' + (lastScorer + 1) + ' SCORES!';
      ctx.fillText(who, W / 2, 222);
    }
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      bigText('PAUSED', 190, 54, '#ffffff', '#6a7dff');
      ctx.font = '14px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('P = resume    ESC = back to menu', W / 2, 225);
    }
    if (phase === 'over') {
      ctx.fillStyle = 'rgba(3,0,16,0.78)'; ctx.fillRect(0, 0, W, H);
      const col = winner === 0 ? C1 : C2;
      ctx.textAlign = 'center'; ctx.font = '14px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('FULL TIME', W / 2, 100);
      const txt = numPlayers === 1 ? (winner === 0 ? 'YOU WIN!' : 'CPU WINS') : 'PLAYER ' + (winner + 1) + ' WINS!';
      bigText(txt, 170, 56, col);
      ctx.font = 'bold 44px monospace'; ctx.fillStyle = '#fff';
      ctx.fillText(scores[0] + '  -  ' + scores[1], W / 2, 235);
      ctx.font = '15px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText('ENTER = play again      ESC = menu', W / 2, 300);
    }
  }

  function drawMatch() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawArena();
    cars.forEach(drawCar);
    drawBall();
    drawParticles();
    ctx.restore();
    drawHUD();
    drawOverlays();
  }

  // ── Start / difficulty screens ─────────────────────────────────────────────
  function buttons() {
    if (screen === 'mode') return [{ x: 90, y: 120, w: 290, h: 130 }, { x: 420, y: 120, w: 290, h: 130 }];
    return [0, 1, 2].map(i => ({ x: 50 + i * 240, y: 130, w: 220, h: 110 }));
  }

  function drawMenuScreens() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#030010'); g.addColorStop(1, '#0f0036');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => {
      ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.2 * Math.sin(frameN * 0.04 + s.t)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    });

    ctx.textAlign = 'center';
    ctx.shadowColor = C1; ctx.shadowBlur = 20 + Math.sin(frameN * 0.06) * 8;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px monospace';
    ctx.fillText('BOOST BALL', W / 2, 62);
    ctx.shadowBlur = 0;
    ctx.font = '13px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(screen === 'mode' ? 'Car soccer  ·  3 minutes  ·  first to 10 goals wins' : 'CHOOSE THE CPU DIFFICULTY', W / 2, 88);

    const bs = buttons();
    if (screen === 'mode') {
      const data = [
        { t: '1 PLAYER', s: 'vs the computer', col: C1, n: 1 },
        { t: '2 PLAYERS', s: 'same keyboard', col: C2, n: 2 },
      ];
      data.forEach((d, i) => {
        const b = bs[i], on = sel === i;
        ctx.shadowColor = d.col; ctx.shadowBlur = on ? 28 : 8;
        ctx.strokeStyle = d.col; ctx.lineWidth = on ? 3 : 1.5;
        ctx.fillStyle = on ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
        rrect(b.x, b.y - (on ? 6 : 0), b.w, b.h, 14); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
        const cy = b.y - (on ? 6 : 0);
        ctx.save(); ctx.translate(b.x + b.w / 2 - (d.n === 2 ? 38 : 0), cy + 38); ctx.scale(1.2, 1.2); drawCarShape(C1, false, true); ctx.restore();
        if (d.n === 2) { ctx.save(); ctx.translate(b.x + b.w / 2 + 38, cy + 38); ctx.scale(-1.2, 1.2); drawCarShape(C2, false, true); ctx.restore(); }
        else { ctx.save(); ctx.translate(b.x + b.w / 2 + 70, cy + 38); ctx.scale(-0.9, 0.9); ctx.globalAlpha = 0.45; drawCarShape('#aaaaaa', false, false); ctx.restore(); }
        ctx.textAlign = 'center';
        ctx.fillStyle = d.col; ctx.font = 'bold 24px monospace'; ctx.fillText(d.t, b.x + b.w / 2, cy + 88);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '12px monospace'; ctx.fillText(d.s, b.x + b.w / 2, cy + 108);
      });
      ctx.font = '12px monospace'; ctx.textAlign = 'center';
      const lines = [
        ['P1:  A / D move + rotate  ·  W jump (press again = flip)  ·  S fast fall  ·  L-SHIFT boost', C1],
        ['P2:  ← / → move + rotate  ·  ↑ jump (press again = flip)  ·  ↓ fast fall  ·  R-SHIFT boost', C2],
      ];
      lines.forEach((l, i) => { ctx.fillStyle = l[1]; ctx.fillText(l[0], W / 2, 295 + i * 20); });
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('Boost refills while you are on the ground.   Pick with A/D or ←/→ + ENTER, or click.   ESC = menu', W / 2, 350);
    } else {
      const data = [
        { t: 'EASY', s: 'slow & forgiving', col: '#66ff99' },
        { t: 'MEDIUM', s: 'a fair fight', col: '#ffd24a' },
        { t: 'HARD', s: 'fast, boosts & flips', col: '#ff5566' },
      ];
      data.forEach((d, i) => {
        const b = bs[i], on = sel === i, by = b.y - (on ? 6 : 0);
        ctx.shadowColor = d.col; ctx.shadowBlur = on ? 28 : 8;
        ctx.strokeStyle = d.col; ctx.lineWidth = on ? 3 : 1.5;
        ctx.fillStyle = on ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
        rrect(b.x, by, b.w, b.h, 14); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.fillStyle = d.col; ctx.font = 'bold 28px monospace'; ctx.fillText(d.t, b.x + b.w / 2, by + 56);

// ===== pinball.js =====
// Pinball — neon pinball table with flippers, bumpers, slingshots and a plunger

  seg(268, 186, 238, 226, { e: 0.5 }); // right shoulder

    { x: 134, y: 168, r: 17, score: 100, color: '#ffd24a', hit: 0 },
    { x: 56, y: 205, r: 6, score: 25, color: '#78d94c', hit: 0 },

    const p = cellCenter(c, r);
    return { team, x: p.x, y: p.y, ang: team === 0 ? 0 : Math.PI, alive: true, cd: 0, firePrev: false, shield: false, triple: 0,
      color: team === 0 ? C1 : C2,
      ai: (team === 1 && numPlayers === 1) ? { err: 0, errT: 0, last: null, escape: 0, escDir: 1, sx: 0, sy: 0, stuckT: 0 } : null };
  }

  function newRound() {
    buildMaze();
    const r1 = Math.floor(Math.random() * ROWS), r2 = Math.floor(Math.random() * ROWS);
    tanks = [makeTank(0, Math.random() < 0.5 ? 0 : 1, r1), makeTank(1, Math.random() < 0.5 ? COLS - 1 : COLS - 2, r2)];
    bullets = []; particles = []; rings = []; endT = 0; pickups = []; pkT = 360 + Math.random() * 240;
    phase = 'countdown'; cdFrames = 120;
  }

  function startMatch() {
    screen = 'match'; scores = [0, 0]; winner = -1; shake = 0;
    newRound();
  }

  // ── Input ──────────────────────────────────────────────────────────────────
  function humanInput(c) {
    const k = keys, solo = numPlayers === 1;
    if (c.team === 0) {
      const left = k.KeyA || (solo && k.ArrowLeft), right = k.KeyD || (solo && k.ArrowRight);
      const up = k.KeyW || (solo && k.ArrowUp), down = k.KeyS || (solo && k.ArrowDown);
      return { rot: (right ? 1 : 0) - (left ? 1 : 0), drive: (up ? 1 : 0) - (down ? 1 : 0),
        fire: !!(k.KeyF || k.KeyQ || k.ShiftLeft || (solo && (k.Space || k.Enter || k.ShiftRight))) };
    }
    return { rot: (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0), drive: (k.ArrowUp ? 1 : 0) - (k.ArrowDown ? 1 : 0),
      fire: !!(k.Enter || k.ShiftRight || k.Slash) };
  }

  // Computer player ----------------------------------------------------------
  function aiInput(c) {
    const d = DIFFS[diff], ai = c.ai, t = tanks[1 - c.team];
    const inp = { rot: 0, drive: 0, fire: false };
    if (!t.alive || phase !== 'play') return inp;
    if (--ai.errT <= 0) { ai.errT = 40; ai.err = (Math.random() - 0.5) * 2 * d.aimErr; }

    // stuck? back up and turn
    if (ai.escape > 0) { ai.escape--; inp.drive = -1; inp.rot = ai.escDir; return inp; }
    if (frameN % 30 === 0) {
      if (Math.hypot(c.x - ai.sx, c.y - ai.sy) < 4) { if (++ai.stuckT >= 2) { ai.escape = 28; ai.escDir = Math.random() < 0.5 ? 1 : -1; ai.stuckT = 0; } } else ai.stuckT = 0;
      ai.sx = c.x; ai.sy = c.y;
    }

    // dodge incoming bullets (hard)
    if (d.dodge) {
      for (const b of bullets) {
        const rx = c.x - b.x, ry = c.y - b.y, v2 = b.vx * b.vx + b.vy * b.vy;
        const tt = (rx * b.vx + ry * b.vy) / v2;
        if (tt > 0 && tt < 34) {
          const cx = b.x + b.vx * tt - c.x, cy = b.y + b.vy * tt - c.y;
          if (Math.hypot(cx, cy) < 24 && Math.hypot(rx, ry) < 150) {
            const bAng = Math.atan2(b.vy, b.vx);
            const side = (cx * -b.vy + cy * b.vx) > 0 ? -1 : 1;
            const target = bAng + side * Math.PI / 2;
            const df = wrap(target - c.ang);
            inp.rot = Math.abs(df) < 0.05 ? 0 : Math.sign(df);
            inp.drive = Math.abs(df) < 1.2 ? 1 : 0;
            return inp;
          }
        }
      }
    }

    const dist = Math.hypot(t.x - c.x, t.y - c.y);
    const los = hasLOS(c, t);
    let target;
    if (los) target = Math.atan2(t.y - c.y, t.x - c.x) + ai.err;
    else {
      const me = cellOf(c.x, c.y), him = cellOf(t.x, t.y);
      const df = distField(him.c, him.r);
      let best = null, bd = df[me.r][me.c];
      for (const [nc, nr] of neighbours(me.c, me.r)) if (df[nr][nc] >= 0 && df[nr][nc] < bd) { bd = df[nr][nc]; best = [nc, nr]; }
      const wp = best ? cellCenter(best[0], best[1]) : { x: t.x, y: t.y };
      target = Math.atan2(wp.y - c.y, wp.x - c.x);
    }
    const dAng = wrap(target - c.ang);
    inp.rot = Math.abs(dAng) < 0.04 ? 0 : Math.sign(dAng);
    if (los) {
      if (Math.abs(dAng) < d.aimTol && Math.random() < d.fireProb) inp.fire = true;
      if (dist > 190 && Math.abs(dAng) < 0.6) inp.drive = 1; else if (dist < 100) inp.drive = -1;
    } else if (Math.abs(dAng) < 0.7) inp.drive = 1;

    // only refresh steering every few frames (reaction time)
    if (ai.last && frameN % d.react !== 0) { inp.rot = ai.last.rot; inp.drive = ai.last.drive; }
    else ai.last = { rot: inp.rot, drive: inp.drive };
    return inp;
  }

  // ── Simulation ─────────────────────────────────────────────────────────────
  function pushOutOfWalls(o, r) {
    for (const s of segs) {
      const p = closestOnSeg(s, o.x, o.y);
      let nx = o.x - p.x, ny = o.y - p.y, d = Math.hypot(nx, ny);
      const min = r + WALL_HALF;
      if (d < min) {
        if (d < 1e-6) { nx = 0; ny = -1; d = 1; }
        o.x = p.x + (nx / d) * min; o.y = p.y + (ny / d) * min;
      }
    }
  }

  function explode(t) {
    t.alive = false; shake = 14;
    rings.push({ x: t.x, y: t.y, life: 26, color: t.color });
    for (let i = 0; i < 44; i++) {
      const a = Math.random() * TAU, s = 0.6 + Math.random() * 3.6;
      particles.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 25, max: 55, size: 2 + Math.random() * 3.5, color: Math.random() < 0.6 ? t.color : '#ffffff' });
    }
    tone(140, 0.45, 'sawtooth', 0.05, 40);
  }

  function shoot(t) {
    const mine = bullets.filter(b => b.owner === t.team).length;
    if (t.cd > 0 || mine >= MAX_BULLETS) return;
    t.cd = FIRE_CD;
    const bx = t.x + Math.cos(t.ang) * 17, by = t.y + Math.sin(t.ang) * 17;
    for (const da of (t.triple > 0 ? [-0.22, 0, 0.22] : [0])) { const a = t.ang + da;
      bullets.push({ x: t.x + Math.cos(a) * 17, y: t.y + Math.sin(a) * 17, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, owner: t.team, age: 0, life: BULLET_LIFE, trail: [] }); }
    tone(380, 0.07, 'square', 0.025, 160);
  }

  function stepPickups() {
    if (--pkT <= 0 && pickups.length < 2) {
      for (let tries = 0; tries < 20; tries++) { const p = cellCenter(Math.floor(Math.random() * COLS), Math.floor(Math.random() * ROWS)); if (tanks.every(t => Math.hypot(t.x - p.x, t.y - p.y) > 110) && pickups.every(k => Math.hypot(k.x - p.x, k.y - p.y) > 80)) { pickups.push({ x: p.x, y: p.y, kind: Math.random() < 0.5 ? 'shield' : 'triple', age: 0 }); break; } }
      pkT = 420 + Math.random() * 300;
    }
    for (const k of pickups) k.age++;
    for (const t of tanks) { if (!t.alive) continue; for (const k of pickups) if (Math.hypot(t.x - k.x, t.y - k.y) < 18) {
      k.taken = true; if (k.kind === 'shield') t.shield = true; else t.triple = 600; rings.push({ x: k.x, y: k.y, life: 20, color: k.kind === 'shield' ? '#66ffee' : '#ffd24a' }); tone(900, 0.15, 'triangle', 0.04, 1500); } }
    pickups = pickups.filter(k => !k.taken);
  }
  function stepTanks() {
    stepPickups();
    for (const t of tanks) {
      if (t.cd > 0) t.cd--; if (t.triple > 0) t.triple--;
      if (!t.alive) continue;
      const inp = t.ai ? aiInput(t) : humanInput(t);
      const sp = t.ai ? DIFFS[diff].speed : 1, rs = t.ai ? DIFFS[diff].rot : 1;
      t.ang += inp.rot * ROT * rs;
      if (inp.drive) { const v = inp.drive > 0 ? FWD : -BACK; t.x += Math.cos(t.ang) * v * sp; t.y += Math.sin(t.ang) * v * sp; }
      pushOutOfWalls(t, TANK_R);
      if (inp.fire && !t.firePrev) shoot(t);
      t.firePrev = inp.fire;
    }
    // tanks bump into each other
    const a = tanks[0], b = tanks[1];
    if (a.alive && b.alive) {
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = TANK_R * 2;
      if (d < min && d > 0) { const p = (min - d) / 2; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; pushOutOfWalls(a, TANK_R); pushOutOfWalls(b, TANK_R); }
    }
  }

  function stepBullets() {
    for (const b of bullets) {
      b.age++; b.life--;
      b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 6) b.trail.shift();
      for (let sub = 0; sub < 2; sub++) {
        b.x += b.vx / 2; b.y += b.vy / 2;
        for (const s of segs) {
          const p = closestOnSeg(s, b.x, b.y);
          let nx = b.x - p.x, ny = b.y - p.y, d = Math.hypot(nx, ny);
          const min = BULLET_R + WALL_HALF;
          if (d < min) {
            if (d < 1e-6) { nx = 0; ny = -1; d = 1; }
            nx /= d; ny /= d;
            b.x = p.x + nx * min; b.y = p.y + ny * min;
            const vn = b.vx * nx + b.vy * ny;
            if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; tone(700, 0.025, 'square', 0.012); }
          }
        }
        for (const t of tanks) {
          if (!t.alive) continue;
          if (b.owner === t.team && b.age < 8) continue;           // can't hit yourself right as you fire
          if (Math.hypot(b.x - t.x, b.y - t.y) < TANK_R + BULLET_R) { if (t.shield) { t.shield = false; b.life = 0; rings.push({ x: t.x, y: t.y, life: 18, color: '#66ffee' }); tone(500, 0.12, 'triangle', 0.04, 250); } else { explode(t); b.life = 0; } break; }
        }
        if (b.life <= 0) break;
      }
    }
    bullets = bullets.filter(b => b.life > 0);
  }

  function update() {
    frameN++;
    // gamepad X goes back to the menu from the game-over screen
    let xNow = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) xNow = true; break; }
    const gpFired = xNow && !gpXWas; gpXWas = xNow;

    if (screen !== 'match') return;
    if (shake > 0) shake = Math.max(0, shake - 0.6);
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
    particles = particles.filter(p => p.life > 0);
    for (const r of rings) r.life--;
    rings = rings.filter(r => r.life > 0);

    if (phase === 'over') { if (gpFired && frameN - overAt > 40) { stop(); showMenu(); } return; }
    if (phase === 'countdown') {
      cdFrames--;
      if (cdFrames > 0 && cdFrames % 40 === 0) tone(440, 0.1, 'square', 0.03);
      if (cdFrames <= 0) { phase = 'play'; tone(880, 0.25, 'square', 0.04); }
      return;
    }
    if (phase === 'roundEnd') {
      roundT--;
      stepBullets();
      if (roundT <= 0) { if (winner >= 0) { phase = 'over'; overAt = frameN; melody([523, 659, 784, 1047], 120, 'triangle', 0.04); } else newRound(); }
      return;
    }

    // phase === 'play'
    stepTanks();
    stepBullets();
    if (!endT && (!tanks[0].alive || !tanks[1].alive)) endT = 40;      // short wait so a double knock-out counts as a draw
    if (endT) {
      endT--;
      if (endT === 0) {
        const a0 = tanks[0].alive, a1 = tanks[1].alive;
        if (a0 !== a1) {
          const w = a0 ? 0 : 1; scores[w]++;
          roundMsg = numPlayers === 1 ? (w === 0 ? 'YOU SCORE!' : 'CPU SCORES') : 'PLAYER ' + (w + 1) + ' SCORES!';
          roundCol = w === 0 ? C1 : C2;
          if (scores[w] >= WIN_ROUNDS) winner = w;
          melody(w === 0 ? [523, 659] : [330, 262], 100, 'square', 0.03);
        } else { roundMsg = 'DRAW'; roundCol = '#ffffff'; }
        phase = 'roundEnd'; roundT = 110;
      }
    }
  }

  // ── Drawing ────────────────────────────────────────────────────────────────
  function drawArena() {
    ctx.fillStyle = '#030010'; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.12 + 0.12 * Math.sin(frameN * 0.03 + s.t)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); });
    ctx.fillStyle = '#060222'; ctx.fillRect(X0, Y0, COLS * CELL, ROWS * CELL);
    ctx.strokeStyle = 'rgba(120,100,255,0.06)'; ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(X0 + c * CELL, Y0); ctx.lineTo(X0 + c * CELL, Y0 + ROWS * CELL); ctx.stroke(); }
    for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(X0, Y0 + r * CELL); ctx.lineTo(X0 + COLS * CELL, Y0 + r * CELL); ctx.stroke(); }
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#00eaff'; ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 10; ctx.lineWidth = WALL_HALF * 2 - 1;
    ctx.beginPath();
    for (const s of segs) { ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawTank(t) {
    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(t.ang);
    ctx.shadowColor = t.color; ctx.shadowBlur = 14;
    ctx.fillStyle = t.color;
    rrect(-14, -10, 28, 20, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(-14, -12, 28, 4); ctx.fillRect(-14, 8, 28, 4);                // tracks
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-6, -5, 12, 10);
    ctx.fillStyle = '#e8f6ff'; ctx.fillRect(0, -2.5, 19, 5);                    // barrel
    ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
    ctx.restore();
    if (t.shield) { ctx.save(); ctx.strokeStyle = '#66ffee'; ctx.shadowColor = '#66ffee'; ctx.shadowBlur = 12; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.65 + 0.3 * Math.sin(frameN * 0.2); ctx.beginPath(); ctx.arc(t.x, t.y, 20, 0, TAU); ctx.stroke(); ctx.restore(); }
    if (t.triple > 0) { ctx.fillStyle = '#ffd24a'; ctx.fillRect(t.x - 10, t.y - 24, 20 * Math.min(1, t.triple / 600), 3); }
  }
  function drawPickups() {
    for (const k of pickups) {
      const col = k.kind === 'shield' ? '#66ffee' : '#ffd24a', bob = Math.sin((k.age + k.x) * 0.1) * 2;
      ctx.save(); ctx.translate(k.x, k.y + bob); ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.strokeStyle = col; ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2; ctx.fillRect(-10, -10, 20, 20); ctx.strokeRect(-10, -10, 20, 20); ctx.shadowBlur = 0;
      ctx.fillStyle = col; if (k.kind === 'shield') { ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.lineWidth = 2; ctx.stroke(); } else { for (const a of [-0.5, 0, 0.5]) { ctx.save(); ctx.rotate(a); ctx.fillRect(-1, -7, 2, 7); ctx.restore(); } }
      ctx.restore();
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      b.trail.forEach((p, i) => { ctx.fillStyle = `rgba(255,230,120,${(i / b.trail.length) * 0.35})`; ctx.beginPath(); ctx.arc(p.x, p.y, BULLET_R * (0.4 + i / b.trail.length * 0.6), 0, TAU); ctx.fill(); });
      ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 12; ctx.fillStyle = '#fff6c0';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_R, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    }
  }

  function drawFx() {
    for (const r of rings) {
      const k = 1 - r.life / 26;
      ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = r.color; ctx.lineWidth = 3; ctx.shadowColor = r.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(r.x, r.y, 8 + k * 44, 0, TAU); ctx.stroke(); ctx.shadowBlur = 0;
    }
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
  }

  function glowText(text, x, y, size, color, align, glow) {
    ctx.textAlign = align; ctx.font = `bold ${size}px monospace`; ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = glow || 0; ctx.fillText(text, x, y); ctx.shadowBlur = 0;
  }

  function drawHUD() {
    ctx.fillStyle = '#07041a'; ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = '#00eaff'; ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 8; ctx.fillRect(0, HUD_H - 2, W, 2); ctx.shadowBlur = 0;
    ctx.textAlign = 'left'; ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(numPlayers === 1 ? 'YOU' : 'PLAYER 1', 18, 23);
    glowText(String(scores[0]), 100, 28, 24, C1, 'left', 10);
    ctx.textAlign = 'right'; ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(numPlayers === 1 ? 'CPU' : 'PLAYER 2', W - 18, 23);
    glowText(String(scores[1]), W - 100, 28, 24, C2, 'right', 10);
    glowText('TANK BATTLE', W / 2, 16, 15, '#ffffff', 'center', 10);
    ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center';
    ctx.fillText('FIRST TO ' + WIN_ROUNDS + '  ·  ESC = menu', W / 2, 30);
    ctx.textAlign = 'left';
  }

  function drawOverlays() {
    if (phase === 'countdown') {
      const n = Math.ceil(cdFrames / 40), k = (cdFrames % 40) / 40;
      ctx.globalAlpha = 0.4 + 0.6 * k;
      glowText(n > 0 ? String(n) : 'GO!', W / 2, 240, 90, '#ffffff', 'center', 24);
      ctx.globalAlpha = 1;
      ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(numPlayers === 1 ? 'W/S drive · A/D turn · F or SPACE shoot' : 'P1: W S A D + F        P2: ↑ ↓ ← → + ENTER', W / 2, 385);
    }
    if (phase === 'roundEnd') glowText(roundMsg, W / 2, 230, 38, roundCol, 'center', 20);
    if (phase === 'over') {
      ctx.fillStyle = 'rgba(3,0,16,0.82)'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
      const txt = numPlayers === 1 ? (winner === 0 ? 'YOU WIN!' : 'CPU WINS') : 'PLAYER ' + (winner + 1) + ' WINS!';
      glowText(txt, W / 2, 160, 54, winner === 0 ? C1 : C2, 'center', 22);
      glowText(scores[0] + '  -  ' + scores[1], W / 2, 225, 40, '#ffffff', 'center', 6);
      ctx.font = '15px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.textAlign = 'center';
      ctx.fillText('ENTER / SPACE = play again      ESC = menu', W / 2, 290);
    }
    ctx.textAlign = 'left';
  }

  function drawMatch() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawArena();
    drawPickups();
    tanks.forEach(t => { if (t.alive) drawTank(t); });
    drawBullets();
    drawFx();
    ctx.restore();
    drawHUD();
    drawOverlays();
  }

  // ── Start / difficulty screens ─────────────────────────────────────────────
  function buttons() {
    if (screen === 'mode') return [{ x: 90, y: 110, w: 290, h: 130 }, { x: 420, y: 110, w: 290, h: 130 }];
    return [0, 1, 2].map(i => ({ x: 50 + i * 240, y: 120, w: 220, h: 110 }));
  }

  function miniTank(color, flip) {
    ctx.save(); if (flip) ctx.scale(-1, 1);
    ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.fillStyle = color; rrect(-14, -10, 28, 20, 4); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(-14, -12, 28, 4); ctx.fillRect(-14, 8, 28, 4);
    ctx.fillStyle = '#e8f6ff'; ctx.fillRect(0, -2.5, 19, 5);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawMenuScreens() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#030010'); g.addColorStop(1, '#0f0036');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.2 * Math.sin(frameN * 0.04 + s.t)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); });
    glowText('TANK BATTLE', W / 2, 62, 40, '#ffffff', 'center', 18 + Math.sin(frameN * 0.06) * 8);
    ctx.font = '13px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center';
    ctx.fillText(screen === 'mode' ? 'Bouncing bullets  ·  power-ups  ·  first to 5 wins' : 'CHOOSE THE CPU DIFFICULTY', W / 2, 88);

    const bs = buttons();
    if (screen === 'mode') {
      const data = [{ t: '1 PLAYER', s: 'vs the computer', col: C1, n: 1 }, { t: '2 PLAYERS', s: 'same keyboard', col: C2, n: 2 }];
      data.forEach((d, i) => {

// Online Arena Brawler: 1v1 duels and tournaments. The host's browser runs the fight; the fighters send their keys.
OnlineGames.brawler = (() => {
  const W = 800, H = 400;
  function create(env) {
    const BR = ArenaBrawler.core;
    const host = env.host, tour = !!env.match, players = env.players, CM = OnlineUtil.cols(players);
    const fighters = env.match ? env.match.slice() : players.slice(0, 2).map(p => p.id);
    const nameOf = (id) => { const p = players.find(q => q.id === id); return p ? p.name : '?'; };
    const names = fighters.map(nameOf), cols = fighters.map(id => CM[id] || '#ffffff');
    const iAm = fighters.indexOf(env.me), keys = env.keys;
    const S = { ph: 'pick', pk: [[0, 0], [1, 0]], t: 60 * 15, over: false, wn: -1 };
    const held = [{}, {}], latch = [{}, {}], cfg = { emit: host ? env.emit : null, inp: [{}, {}], names, cols };
    let overT = 0, frame = 0;
    BR.begin(cfg);
    const tone = OnlineUtil.makeTone();

        const L = latch[i], pk = S.pk[i]; if (pk[1]) continue;

      for (let i = 0; i < 2; i++) { const h = held[i], L = latch[i]; cfg.inp[i] = { l: !!h.l, r: !!h.r, jumpP: !!L.j, lightP: !!L.p, heavyP: !!L.h, block: !!h.b }; latch[i] = {}; }

    if (screen === 'friends') { if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); if (e.key === 'Backspace') input = input.slice(0, -1); else if (e.key === 'Enter') addFriend(); else if (e.key.length === 1 && /[A-Za-z0-9 _\-]/.test(e.key) && input.length < 12) input += e.key; }
  }
  const hit = (p) => { for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b; } return null; };
  function onMove(e) { const b = hit(pos(e.clientX, e.clientY)); hov = b && !b.off ? b : null; canvas.style.cursor = hov ? 'pointer' : 'default'; }
  function onClick(e) { const b = hit(pos(e.clientX, e.clientY)); if (b && !b.off && b.fn) b.fn(); }
  function stopLoop() { running = false; if (animId) cancelAnimationFrame(animId); animId = null; document.removeEventListener('keydown', onKey); canvas.removeEventListener('mousemove', onMove); canvas.removeEventListener('click', onClick); canvas.style.cursor = 'default'; }
  function close() { fClose(); stopLoop(); showMenu(); }
  document.addEventListener('paste', (e) => { if (running && screen === 'music') { const t = (e.clipboardData && e.clipboardData.getData('text')) || ''; mInput = (mInput + t.trim()).slice(0, 200); e.preventDefault(); } });
  function open(id) { stopLoop(); running = true; screen = id; frame = 0; input = ''; hov = null; hideTouchControls(); document.addEventListener('keydown', onKey); canvas.addEventListener('mousemove', onMove); canvas.addEventListener('click', onClick); if (id === 'friends') { fwhere = []; pendingAdd = null; fmsg = ''; fmsgT = 0; fConnect(); } animId = requestAnimationFrame(loop); }

  // ── Phone controls: on-screen buttons that press the same keys as a keyboard ──
  const pad = document.createElement('div');
  pad.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:0;z-index:50;display:none;touch-action:none;user-select:none;-webkit-user-select:none;';
  const BTN = [['◀', 'ArrowLeft', 'left:10px;bottom:62px'], ['▶', 'ArrowRight', 'left:124px;bottom:62px'], ['▲', 'ArrowUp', 'left:67px;bottom:116px'], ['▼', 'ArrowDown', 'left:67px;bottom:8px'],
    ['SPACE', 'Space', 'right:10px;bottom:62px;width:76px'], ['F', 'KeyF', 'right:96px;bottom:8px'], ['G', 'KeyG', 'right:96px;bottom:116px'], ['SHIFT', 'ShiftLeft', 'right:10px;bottom:8px;width:76px'], ['OK', 'Enter', 'right:96px;bottom:62px'], ['ESC', 'Escape', 'right:10px;top:-' + (window.innerHeight - 52) + 'px;width:54px;height:34px']];
  BTN.forEach(([l, code, css]) => {
    const b = document.createElement('div'); b.textContent = l; b.style.cssText = 'position:absolute;width:50px;height:50px;border-radius:12px;border:2px solid rgba(122,216,255,0.7);background:rgba(10,6,38,0.55);color:#bfeaff;font:bold 13px monospace;display:flex;align-items:center;justify-content:center;touch-action:none;' + css;
    const k = (d) => document.dispatchEvent(new KeyboardEvent(d ? 'keydown' : 'keyup', { code, key: l.length === 1 ? l : code, bubbles: true }));
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.style.background = 'rgba(122,216,255,0.45)'; k(true); }); ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { if (b.style.background.indexOf('0.45') >= 0) { b.style.background = 'rgba(10,6,38,0.55)'; k(false); } }));
    pad.appendChild(b);
  });
  document.body.appendChild(pad);
  setInterval(() => { const want = (SET.touch === 'on' || (SET.touch === 'auto' && isTouch)) && typeof menuAnimFrame !== 'undefined' && !menuAnimFrame && !running; pad.style.display = want ? 'block' : 'none'; if (want) pad.lastChild.style.top = (-(window.innerHeight) + 14) + 'px'; }, 300);

  return { rep, weekly, WS, drawButtons, cardMark, sortGames, Stats, open, SET, score, event, pop, PAL, myCol: () => SET.col };
})();
