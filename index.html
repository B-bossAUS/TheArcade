  <script>
// ===== pancake.js =====
const PancakeFlip = (() => {
  const PAN_X = 370, PAN_Y = 192;
  const PAN_R = 143;
  const BATTER_R = 126;
  const TOTAL_PANCAKES = 5;
  const FLIP_DUR = 0.5;
  const SCORE_DUR = 2.2;
  const BTN_X = 400, BTN_Y = 366;

  let state, pancakeNum, totalStars;
  let cookTimer, cookTime, side1Pct, side2Pct;
  let bubbles, steam, particles, feedback;
  let feedbackTimer, stateTimer, pourRadius;
  let flipTimer, flipScaleY, flipSideCooked;
  let frameCount, animFrame, lastTime;
  let gpXWasPressed = false;

  // ── helpers ──
  function rng(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function getCookTime(n)    { return Math.max(4.5, 10 - (n - 1) * 0.8); }
  function getBubbleCount(n) { return Math.min(34, 20 + (n - 1) * 2); }

  // ── bubble system ──
  function spawnBubbles(speedMult) {
    bubbles = [];
    const n = getBubbleCount(pancakeNum);
    for (let i = 0; i < n; i++) {
      const angle = rng(0, Math.PI * 2);
      const dist  = Math.sqrt(Math.random()) * (BATTER_R - 12);
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;
      const maxR = rng(3, 7.5);
      const distFromEdge = BATTER_R - Math.sqrt(x * x + y * y);
      // Outer bubbles pop first (small delay), inner last (large delay)
      const popDelay = (distFromEdge / BATTER_R) * cookTime * 0.86 * speedMult;
      bubbles.push({
        x, y, r: 0, maxR,
        formTime: rng(0.8, 2.2),
        age: 0,
        popDelay,
        state: 'forming',
        ringR: 0, ringAlpha: 0,
      });
    }
  }

  function makeSteam() {
    const angle = rng(0, Math.PI * 2);
    const r = BATTER_R - 10 + rng(0, 16);
    return {
      x: Math.cos(angle) * r, y: Math.sin(angle) * r,
      vx: rng(-0.35, 0.35), vy: -rng(0.3, 0.7),
      alpha: rng(0.06, 0.32), size: rng(4, 9),
      life: Math.random(),
    };
  }

  function getPoppedFraction() {
    if (!bubbles.length) return 0;
    return bubbles.filter(b => b.state === 'popping' || b.state === 'done').length / bubbles.length;
  }

  function calcStars(pct) {
    if (pct < 0.42) return 0;      // raw
    if (pct < 0.58) return 1;      // a bit early
    if (pct <= 0.85) return 3;     // perfect window
    if (pct <= 0.95) return 2;     // a bit late
    return 0;                       // burnt
  }

  function feedbackFor(pct) {
    if (pct < 0.42) return { text: 'Too raw!',      color: '#ff6644' };
    if (pct < 0.58) return { text: 'A bit early',   color: '#ffaa44' };
    if (pct <= 0.85) return { text: 'Perfect!',     color: '#44ff88' };
    if (pct <= 0.95) return { text: 'A bit late',   color: '#ffcc44' };
    return                  { text: 'Burnt!',        color: '#ff3333' };
  }

  // ── init ──
  function initGame() {
    pancakeNum = 1; totalStars = 0; frameCount = 0;
    startPancake();
  }

  function startPancake() {
    cookTime = getCookTime(pancakeNum);
    cookTimer = 0; stateTimer = 0; feedbackTimer = 0;
    pourRadius = 0; flipTimer = 0; flipScaleY = 1; flipSideCooked = false;
    side1Pct = 0; side2Pct = 0;
    bubbles = []; particles = []; feedback = null;
    steam = Array.from({ length: 12 }, makeSteam);
    state = 'pouring';
  }

  // ── actions ──
  function doFlip() {
    if (state !== 'cooking1') return;
    side1Pct = getPoppedFraction();
    const fb = feedbackFor(side1Pct);
    setFeedback(fb.text, fb.color);
    state = 'flipping';
    flipTimer = 0; flipScaleY = 1; flipSideCooked = false;
  }

  function doPlate() {
    if (state !== 'cooking2') return;
    side2Pct = getPoppedFraction();
    const s1 = calcStars(side1Pct);
    const s2 = calcStars(side2Pct);
    const pStars = Math.min(s1, s2);
    totalStars += pStars;
    const fb = feedbackFor(side2Pct);
    const label = fb.text + (pStars > 0 ? '  ' + '⭐'.repeat(pStars) : '  (No stars)');
    setFeedback(label, fb.color);
    state = 'scored';
    stateTimer = SCORE_DUR;
    spawnPlateParticles();
  }

  function setFeedback(text, color) {
    feedback = { text, color, y: 138, alpha: 1 };
    feedbackTimer = 1.8;
  }

  function spawnPlateParticles() {
    for (let i = 0; i < 22; i++) {
      const angle = rng(0, Math.PI * 2);
      const spd = rng(1.5, 5);
      particles.push({
        x: PAN_X, y: PAN_Y,
        vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 2,
        r: rng(3, 7), color: ['#f5d080', '#ffcc44', '#e8a040', '#ffffff'][Math.floor(Math.random() * 4)],
        life: 1, decay: rng(0.018, 0.035),
      });
    }
  }

  // ── update ──
  function update(dt) {
    frameCount++;

    // Steam
    if (state === 'pouring' || state === 'cooking1' || state === 'cooking2') {
      steam.forEach(s => {
        s.x += s.vx; s.y += s.vy; s.alpha -= dt * 0.28;
        s.size += dt * 0.9; s.life -= dt * 0.38;
        if (s.life <= 0 || s.alpha <= 0) Object.assign(s, makeSteam());
      });
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Feedback float
    if (feedbackTimer > 0) {
      feedbackTimer -= dt;
      if (feedback) { feedback.y -= dt * 36; feedback.alpha = clamp(feedbackTimer / 1.2, 0, 1); }
    }

    if (state === 'pouring') {
      pourRadius += dt * (BATTER_R / 0.55);
      if (pourRadius >= BATTER_R) {
        pourRadius = BATTER_R;
        state = 'cooking1';
        cookTimer = 0;
        spawnBubbles(1);
      }
      return;
    }

    if (state === 'cooking1' || state === 'cooking2') {
      const sp = state === 'cooking2' ? 0.65 : 1;
      cookTimer += dt;

      bubbles.forEach(b => {
        b.age += dt;
        if (b.state === 'forming') {
          b.r = Math.min(b.maxR, b.maxR * (b.age / b.formTime));
          if (b.age >= b.formTime) b.state = 'ready';
        }
        if ((b.state === 'ready' || b.state === 'forming') && cookTimer >= b.popDelay * sp) {
          b.state = 'popping'; b.r = 0; b.ringR = b.maxR; b.ringAlpha = 0.85;
        }
        if (b.state === 'popping') {
          b.ringR += dt * 22;
          b.ringAlpha -= dt * 1.6;
          if (b.ringAlpha <= 0) { b.ringAlpha = 0; b.state = 'done'; }
        }
      });

      // Auto-force if truly burnt (all done + 20% extra time)
      if (bubbles.every(b => b.state === 'done') && cookTimer > cookTime * 1.18) {
        if (state === 'cooking1') doFlip();
        else doPlate();
      }
      return;
    }

    if (state === 'flipping') {
      flipTimer += dt;
      const prog = flipTimer / FLIP_DUR;
      flipScaleY = Math.abs(Math.cos(prog * Math.PI));
      if (prog >= 0.5 && !flipSideCooked) flipSideCooked = true;
      if (flipTimer >= FLIP_DUR) {
        state = 'cooking2';
        cookTimer = 0;
        spawnBubbles(0.65);
      }
      return;
    }

    if (state === 'scored') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        if (pancakeNum >= TOTAL_PANCAKES) { state = 'gameover'; __hs('PANCAKE FLIP', totalStars); }
        else { pancakeNum++; startPancake(); }
      }
    }
  }

  // ── draw helpers ──
  function drawBackground() {
    ctx.fillStyle = '#211810';
    ctx.fillRect(0, 0, 800, 400);
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 800; x += 38) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 400); ctx.stroke(); }
    for (let y = 0; y < 400; y += 38) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }
  }

  function drawPan() {
    // Handle
    ctx.fillStyle = '#151515';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.roundRect(PAN_X + PAN_R - 4, PAN_Y - 15, 94, 30, 15); ctx.fill();
    ctx.fillStyle = '#2e2e2e';
    ctx.beginPath(); ctx.roundRect(PAN_X + PAN_R, PAN_Y - 11, 86, 22, 11); ctx.fill();
    ctx.shadowBlur = 0;
    // Rim
    ctx.shadowColor = '#000'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#1e1e1e';
    ctx.beginPath(); ctx.arc(PAN_X, PAN_Y, PAN_R + 10, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Inner surface
    const pg = ctx.createRadialGradient(PAN_X - 25, PAN_Y - 25, 8, PAN_X, PAN_Y, PAN_R);
    pg.addColorStop(0, '#3d3d3d'); pg.addColorStop(1, '#181818');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(PAN_X, PAN_Y, PAN_R, 0, Math.PI * 2); ctx.fill();
    // Specular rim
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(PAN_X, PAN_Y, PAN_R + 3, Math.PI * 1.05, Math.PI * 1.9); ctx.stroke();
  }

  function drawBatter() {
    const r = state === 'pouring' ? pourRadius : BATTER_R;
    const scaleY = state === 'flipping' ? flipScaleY : 1;
    const cooked = flipSideCooked || state === 'cooking2' || state === 'scored';
    const browning = (state === 'cooking1' || state === 'cooking2')
      ? clamp(cookTimer / cookTime, 0, 1) : (cooked ? 0.55 : 0);

    ctx.save();
    ctx.translate(PAN_X, PAN_Y);
    ctx.scale(1, scaleY);

    // Clip
    ctx.beginPath(); ctx.arc(0, 0, r + 1, 0, Math.PI * 2); ctx.clip();

    // Base color
    const cCenter = cooked ? '#c8882a' : '#f2c86a';
    const cEdge   = cooked ? '#7a3a00' : '#d49030';
    const bg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    bg.addColorStop(0,   cCenter);
    bg.addColorStop(0.75, cEdge);
    bg.addColorStop(1,   '#5a2200');
    ctx.fillStyle = bg;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    // Edge browning overlay (expands inward)
    if (browning > 0.05) {
      const innerR = r * clamp(1 - browning * 0.75, 0, 1);
      const ov = ctx.createRadialGradient(0, 0, innerR, 0, 0, r);
      ov.addColorStop(0,   'rgba(80,28,0,0)');
      ov.addColorStop(0.4, `rgba(90,30,0,${browning * 0.55})`);
      ov.addColorStop(1,   `rgba(30,8,0,${clamp(browning * 1.3, 0, 1)})`);
      ctx.fillStyle = ov;
      ctx.fillRect(-r, -r, r * 2, r * 2);
    }

    ctx.restore();
  }

  function drawBubbles() {
    if (!bubbles.length) return;
    const scaleY = state === 'flipping' ? flipScaleY : 1;
    ctx.save();
    ctx.translate(PAN_X, PAN_Y);
    ctx.scale(1, scaleY);

    bubbles.forEach(b => {
      if (b.state === 'forming' || b.state === 'ready') {
        // Outer circle
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 0.9; ctx.stroke();
        // Highlight
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fill();
      }
      if (b.state === 'popping' && b.ringAlpha > 0) {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.ringR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(195,148,60,${b.ringAlpha})`; ctx.lineWidth = 1.4; ctx.stroke();
      }
    });
    ctx.restore();
  }

  function drawSteam() {
    if (state !== 'pouring' && state !== 'cooking1' && state !== 'cooking2') return;
    ctx.save();
    ctx.translate(PAN_X, PAN_Y);
    steam.forEach(s => {
      if (s.alpha <= 0) return;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,210,210,${s.alpha})`; ctx.fill();
    });
    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r * p.life), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawButton() {
    if (state !== 'cooking1' && state !== 'cooking2') return;
    const isFlip = state === 'cooking1';
    const label  = isFlip ? 'FLIP !' : 'PLATE IT !';
    const pct    = getPoppedFraction();
    const perfect = pct >= 0.58 && pct <= 0.85;
    const color  = perfect ? '#44ff88' : (pct > 0.85 ? '#ff5533' : '#ff9922');
    const pulse  = perfect ? 1 + Math.sin(frameCount * 0.14) * 0.055 : 1;

    ctx.save();
    ctx.translate(BTN_X, BTN_Y);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = color; ctx.shadowBlur = perfect ? 22 : 10;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(-88, -24, 176, 48, 24); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#111';
    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText(label, 0, 7);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function drawHUD() {
    // Top-left: pancake counter
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Pancake  ${pancakeNum} / ${TOTAL_PANCAKES}`, 18, 28);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.font = '11px monospace';
    ctx.fillText('ESC = MENU  •  SPACE = action', 18, 46);

    // Top-right: star total
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffcc44'; ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 8;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`⭐  ${totalStars}`, 782, 28);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';

    // Bubble progress bar (bottom strip, only while cooking)
    if (state === 'cooking1' || state === 'cooking2') {
      const pct = getPoppedFraction();
      const bw = 210, bx = BTN_X - bw / 2, by = 390;

      // Perfect-window highlight
      ctx.fillStyle = 'rgba(68,255,136,0.18)';
      ctx.fillRect(bx + bw * 0.58, by, bw * 0.27, 7);

      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(bx, by, bw, 7);

      const barCol = (pct >= 0.58 && pct <= 0.85) ? '#44ff88' : pct > 0.85 ? '#ff5533' : '#ffcc44';
      ctx.fillStyle = barCol;
      ctx.fillRect(bx, by, bw * pct, 7);

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`${Math.round(pct * 100)}% bubbles popped  —  green zone = perfect`, BTN_X, by - 5);
      ctx.textAlign = 'left';
    }
  }

  function drawFeedback() {
    if (!feedback || feedbackTimer <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(feedback.alpha, 0, 1);
    ctx.shadowColor = feedback.color; ctx.shadowBlur = 16;
    ctx.fillStyle = feedback.color;
    ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
    ctx.fillText(feedback.text, PAN_X, feedback.y);
    ctx.restore(); ctx.textAlign = 'left';
  }

  function drawScoredOverlay() {
    if (state !== 'scored' && state !== 'gameover') return;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 800, 400);
    ctx.textAlign = 'center';

    if (state === 'gameover') {
      ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 46px monospace';
      ctx.fillText("All Pancakes Done!", 400, 88);
      ctx.shadowBlur = 0;

      // Draw pancake stack
      for (let i = TOTAL_PANCAKES - 1; i >= 0; i--) {
        const sy = 260 - i * 17;
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
        ctx.fillStyle = i % 2 === 0 ? '#d49030' : '#bb7418';
        ctx.beginPath(); ctx.ellipse(400, sy, 62, 13, 0, 0, Math.PI * 2); ctx.fill();
        // Butter pat on top pancake
        if (i === TOTAL_PANCAKES - 1) {
          ctx.fillStyle = '#ffe088';
          ctx.beginPath(); ctx.ellipse(400, sy - 4, 14, 6, 0.2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`Final score:  ⭐  ${totalStars}  /  ${TOTAL_PANCAKES * 3}  stars`, 400, 318);

      ctx.fillStyle = '#44ff88'; ctx.shadowColor = '#44ff88'; ctx.shadowBlur = 10;
      ctx.font = '18px monospace'; ctx.fillText('SPACE  —  play again', 400, 356);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.font = '14px monospace';
      ctx.fillText('ESC  —  main menu', 400, 382);
      ctx.textAlign = 'left';
      return;
    }

    // Per-pancake score
    const s1 = calcStars(side1Pct), s2 = calcStars(side2Pct);
    const pStars = Math.min(s1, s2);

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px monospace';
    ctx.fillText(`Pancake ${pancakeNum} complete`, 400, 145);

    ctx.font = '38px monospace';
    ctx.fillText(
      pStars > 0 ? '⭐'.repeat(pStars) + '☆'.repeat(3 - pStars) : '☆ ☆ ☆  (no stars)',
      400, 195
    );

    ctx.fillStyle = 'rgba(255,255,255,0.48)'; ctx.font = '14px monospace';
    ctx.fillText(
      `Side 1: ${Math.round(side1Pct * 100)}% popped   |   Side 2: ${Math.round(side2Pct * 100)}% popped`,
      400, 232
    );

    ctx.fillStyle = '#ffcc44'; ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 6;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Running total:  ⭐  ${totalStars}`, 400, 265);
    ctx.shadowBlur = 0;

    if (pancakeNum < TOTAL_PANCAKES) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '14px monospace';
      ctx.fillText('Next pancake loading…', 400, 300);
    }
    ctx.textAlign = 'left';
  }

  // ── main loop ──
  function draw() {
    ctx.clearRect(0, 0, 800, 400);
    drawBackground();
    drawPan();
    if (state !== 'gameover') {
      drawBatter();
      if (state !== 'flipping') drawBubbles();
      drawSteam();
    }
    drawParticles();
    drawButton();
    drawHUD();
    drawFeedback();
    drawScoredOverlay();
  }

  function loop(ts) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let xNow = false;
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) xNow = true; break; }
    if (xNow && !gpXWasPressed && state === 'gameover') { gpXWasPressed = false; stop(); showMenu(); return; }
    gpXWasPressed = xNow;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    animFrame = requestAnimationFrame(loop);
  }

  // ── input ──
  function hitBtn(mx, my) { return Math.abs(mx - BTN_X) <= 90 && Math.abs(my - BTN_Y) <= 26; }

  function screenToCanvas(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (cx - r.left) * (canvas.width  / r.width),
      y: (cy - r.top)  * (canvas.height / r.height),
    };
  }

  function handleAction(mx, my) {
    if (hitBtn(mx, my)) {
      if (state === 'cooking1') doFlip();
      else if (state === 'cooking2') doPlate();

  function onClick(e) {
    const { x, y } = screenToCanvas(e.clientX, e.clientY);
    handleAction(x, y);
  }

  function onTouchEnd(e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    const { x, y } = screenToCanvas(t.clientX, t.clientY);
    handleAction(x, y);
  }

  function onKeyDown(e) {
    if (e.code === 'Escape') { stop(); showMenu(); return; }
    if (e.code === 'Space') {
      if (state === 'gameover')  { initGame(); return; }
      if (state === 'cooking1')  doFlip();
      else if (state === 'cooking2') doPlate();
    }
  }

  // ── lifecycle ──
  function start() {
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    canvas.addEventListener('click', onClick);
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    initGame();
    lastTime = performance.now();
    animFrame = requestAnimationFrame(loop);
  }

  function stop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    document.removeEventListener('keydown', onKeyDown);
    canvas.removeEventListener('click', onClick);
    canvas.removeEventListener('touchend', onTouchEnd);
  }

  return { start, stop };

  <script>
// ===== gravity.js =====
// Gravity Changer — gravity-flip runner game
const GravityChanger = (() => {
  // ── Constants ──────────────────────────────────────────────────────────────
  const W = 800, H = 400;
  const LANE_H = H;           // full canvas for 1p; half for 2p per player
  const RUNNER_X = 130;
  const RUNNER_W = 14;
  const RUNNER_H = 28;
  const SPIKE_W = 22;
  const SPIKE_H = 18;
  const PLAT_W = 72;
  const PLAT_H = 10;
  const GRAVITY_ACCEL = 0.72;
  const JUMP_VEL = 0;           // no jump; only gravity flip
  const FLIP_LOCK = 18;         // frames before you can flip again

  // ── State ──────────────────────────────────────────────────────────────────
  let mode = '1p';             // '1p' | '2p'
  let running = false;
  let gpXWasPressed = false;
  let animId = null;

  // Screen state: 'title' | 'game' | 'gameover'
  let screen = 'title';

  let players = [];
  let obstacles = [];
  let tick = 0;
  let score = 0;
  let speed = 0;
  let spawnGap = 0;
  let nextSpawn = 0;
  let hovTitleBtn = -1;   // for title hover
  let hovGOBtn = -1;      // for game-over hover

  // ── Player factory ─────────────────────────────────────────────────────────
  function makePlayer(laneTop, laneH, color, keys) {
    return {
      laneTop, laneH, color, keys,
      y: laneTop + laneH - 6 - RUNNER_H,  // feet resting on floor
      vy: 0,
      gravDir: 1,           // 1 = pulled down, -1 = pulled up
      flipLock: 0,
      dead: false,
      legPhase: 0,
      onGround: false,
      onCeiling: false,
      onPlatform: false,
    };
  }

  // ── Math helpers ───────────────────────────────────────────────────────────
  function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  // ── Obstacle factory ───────────────────────────────────────────────────────
  /*
    type: 'spike_top' | 'spike_bot' | 'platform'
    x: world x (scrolls with speed)
    For platform: y is absolute within a lane (relative coords added per-player in draw)
    For spikes they attach to ceiling/floor of the lane.
  */
  function spawnObstacle() {
    const r = Math.random();
    const x = W + 40;

    if (r < 0.12) {
      // Platform in middle third of lane
      obstacles.push({ type: 'platform', x, laneOffset: 0.38 + Math.random() * 0.24 });
    } else {
      // Pick spike pattern
      const pat = Math.random();
      if (pat < 0.28) {
        // Single bottom spike
        obstacles.push({ type: 'spike_bot', x });
      } else if (pat < 0.52) {
        // Single top spike
        obstacles.push({ type: 'spike_top', x });
      } else if (pat < 0.70) {
        // Alternating pair
        obstacles.push({ type: 'spike_bot', x });
        obstacles.push({ type: 'spike_top', x: x + 55 });
      } else if (pat < 0.85) {
        // Double close together
        obstacles.push({ type: 'spike_bot', x });
        obstacles.push({ type: 'spike_bot', x: x + 30 });
      } else {
        // Triple alternating cluster
        obstacles.push({ type: 'spike_bot', x });
        obstacles.push({ type: 'spike_top', x: x + 44 });
        obstacles.push({ type: 'spike_bot', x: x + 88 });
      }
    }
  }

  // ── Geometry per player lane ────────────────────────────────────────────────
  function laneFloor(p) { return p.laneTop + p.laneH - 6; }
  function laneCeiling(p) { return p.laneTop + 6; }
  function laneMiddle(p) { return p.laneTop + p.laneH / 2; }

  // ── Update one player ───────────────────────────────────────────────────────
  function updatePlayer(p) {
    if (p.dead) return;

    // Flip gravity input — only allowed when touching ground, ceiling, or a platform
    if (p.keys.flip && p.flipLock <= 0 && (p.onGround || p.onCeiling || p.onPlatform)) {
      p.gravDir *= -1;
      p.vy = 0;
      p.flipLock = FLIP_LOCK;
    }
    if (p.flipLock > 0) p.flipLock--;

    // Apply gravity
    p.vy += GRAVITY_ACCEL * p.gravDir;
    p.y += p.vy;

    p.onGround = false;
    p.onCeiling = false;
    p.onPlatform = false;

    // Floor collision
    const floor = laneFloor(p);
    if (p.gravDir === 1 && p.y + RUNNER_H >= floor) {
      p.y = floor - RUNNER_H;
      p.vy = 0;
      p.onGround = true;
    }
    // Ceiling collision
    const ceiling = laneCeiling(p);
    if (p.gravDir === -1 && p.y <= ceiling) {
      p.y = ceiling;
      p.vy = 0;
      p.onCeiling = true;
    }

    // Prevent going out of lane entirely
    if (p.y < p.laneTop) { p.y = p.laneTop; p.vy = 0; }
    if (p.y + RUNNER_H > p.laneTop + p.laneH) { p.y = p.laneTop + p.laneH - RUNNER_H; p.vy = 0; }

    // Platform & obstacle collisions
    for (const obs of obstacles) {
      // obs.x is the canvas x of the obstacle (runner is always at RUNNER_X on canvas)
      if (obs.type === 'platform') {
        const py = p.laneTop + p.laneH * obs.laneOffset;
        // Stand on top (gravity down)
        if (p.gravDir === 1 &&
            p.vy >= 0 &&
            rectOverlap(RUNNER_X, p.y, RUNNER_W, RUNNER_H, obs.x, py, PLAT_W, PLAT_H) &&
            p.y + RUNNER_H - p.vy <= py + 2) {
          p.y = py - RUNNER_H;
          p.vy = 0;
          p.onPlatform = true;
        }
        // Hang from bottom (gravity up)
        if (p.gravDir === -1 &&
            p.vy <= 0 &&
            rectOverlap(RUNNER_X, p.y, RUNNER_W, RUNNER_H, obs.x, py, PLAT_W, PLAT_H) &&
            p.y - p.vy >= py + PLAT_H - 2) {
          p.y = py + PLAT_H;
          p.vy = 0;
          p.onPlatform = true;
        }
      } else {
        // Spike collision — use forgiving inner hitbox
        let sx, sy, sw, sh;
        if (obs.type === 'spike_bot') {
          sx = obs.x + 3; sy = laneFloor(p) - SPIKE_H + 4; sw = SPIKE_W - 6; sh = SPIKE_H - 4;
        } else {
          sx = obs.x + 3; sy = laneCeiling(p) + 2;          sw = SPIKE_W - 6; sh = SPIKE_H - 4;
        }
        if (rectOverlap(RUNNER_X + 2, p.y + 2, RUNNER_W - 4, RUNNER_H - 4, sx, sy, sw, sh)) {
          p.dead = true;
        }
      }
    }

    // Leg animation
    if (p.onGround || p.onPlatform || p.onCeiling) {
      p.legPhase += 0.22 * speed / 6.5;
    }
  }

  // ── Draw one player (stick figure) ─────────────────────────────────────────
  function drawPlayer(p) {
    const ctx = canvas.getContext('2d');
    const cx = RUNNER_X + RUNNER_W / 2;
    const cy = p.y + RUNNER_H / 2;
    const flip = p.gravDir; // 1 = normal, -1 = upside down

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, flip);

    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;

    // Head
    ctx.beginPath();
    ctx.arc(0, -13, 5, 0, Math.PI * 2);
    ctx.stroke();

    // Body
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(0, 4);
    ctx.stroke();

    // Arms
    const armSwing = Math.sin(p.legPhase) * 5;
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.lineTo(-8, 0 + armSwing);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.lineTo(8, 0 - armSwing);
    ctx.stroke();

    // Legs
    const leg1 = Math.sin(p.legPhase) * 7;
    const leg2 = Math.sin(p.legPhase + Math.PI) * 7;
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.lineTo(-4, 12 + leg1);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.lineTo(4, 12 + leg2);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ── Draw a spike ────────────────────────────────────────────────────────────
  // baseY = y of the wide base edge; tipY = y of the sharp point
  function drawSpike(ctx, x, baseY, tipY) {
    ctx.save();
    ctx.fillStyle = '#ffaa22';
    ctx.shadowColor = '#ff8800';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(x,             baseY);
    ctx.lineTo(x + SPIKE_W,   baseY);
    ctx.lineTo(x + SPIKE_W / 2, tipY);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ── Draw a platform ─────────────────────────────────────────────────────────
  function drawPlatform(ctx, x, y) {
    ctx.save();
    ctx.fillStyle = '#22cc66';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.roundRect(x, y, PLAT_W, PLAT_H, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ── Main draw ───────────────────────────────────────────────────────────────
  function draw() {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d14';
    ctx.fillRect(0, 0, W, H);

    if (screen === 'title') { drawTitle(ctx); return; }
    if (screen === 'gameover') { drawGameOver(ctx); return; }

    // Draw each player's lane
    players.forEach((p, pi) => {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, p.laneTop, W, p.laneH);
      ctx.clip();

      // Lane divider line (subtle scrolling)
      const scrollOff = (tick * speed * 0.3) % 40;
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -scrollOff;
      ctx.beginPath();
      ctx.moveTo(0, laneMiddle(p));
      ctx.lineTo(W, laneMiddle(p));
      ctx.stroke();
      ctx.setLineDash([]);

      // Floor & ceiling lines
      ctx.strokeStyle = p.color + '55';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, laneFloor(p));
      ctx.lineTo(W, laneFloor(p));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, laneCeiling(p));
      ctx.lineTo(W, laneCeiling(p));
      ctx.stroke();

      // Player label (2p mode)
      if (mode === '2p') {
        ctx.fillStyle = p.color + 'aa';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`P${pi + 1}`, 8, p.laneTop + 16);
      }

      // Obstacles
      for (const obs of obstacles) {
        if (obs.type === 'platform') {
          drawPlatform(ctx, obs.x, p.laneTop + p.laneH * obs.laneOffset);
        } else if (obs.type === 'spike_bot') {
          // base at floor, tip points up into lane
          drawSpike(ctx, obs.x, laneFloor(p), laneFloor(p) - SPIKE_H);
        } else {
          // base at ceiling, tip points down into lane
          drawSpike(ctx, obs.x, laneCeiling(p), laneCeiling(p) + SPIKE_H);
        }
      }

      // Player
      if (!p.dead) drawPlayer(p);

      // Dead overlay
      if (p.dead) {
        ctx.fillStyle = 'rgba(180,0,0,0.18)';
        ctx.fillRect(0, p.laneTop, W, p.laneH);
        ctx.fillStyle = p.color;
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 16;
        ctx.fillText('DEAD', W / 2, laneMiddle(p) + 8);
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    });

    // 2p lane separator
    if (mode === '2p') {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, H / 2);
      ctx.lineTo(W, H / 2);
      ctx.stroke();
    }

    // HUD
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 18px monospace';
    ctx.shadowColor = '#aa44ff';
    ctx.shadowBlur = 12;
    ctx.fillText(`SCORE  ${score}`, W / 2, 22);
    ctx.shadowBlur = 0;
  }

  // ── Title screen ────────────────────────────────────────────────────────────
  function drawTitle(ctx) {
    // Glow title
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px monospace';
    ctx.shadowColor = '#aa44ff';
    ctx.shadowBlur = 28 + Math.sin(tick * 0.05) * 8;
    ctx.fillStyle = '#cc77ff';
    ctx.fillText('GRAVITY', W / 2, 120);
    ctx.fillText('CHANGER', W / 2, 178);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '14px monospace';
    ctx.fillText('Flip gravity — dodge spikes — survive', W / 2, 220);

    // Buttons
    const btns = ['1 PLAYER', '2 PLAYERS'];
    btns.forEach((label, i) => {
      const bx = W / 2 - 100 + i * 210 - 10;
      const by = 260;
      const bw = 160;
      const bh = 44;
      const hov = hovTitleBtn === i;
      ctx.strokeStyle = '#aa44ff';
      ctx.lineWidth = hov ? 2.5 : 1.5;
      ctx.fillStyle = hov ? 'rgba(170,68,255,0.22)' : 'rgba(170,68,255,0.08)';
      ctx.shadowColor = '#aa44ff';
      ctx.shadowBlur = hov ? 20 : 6;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 10);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = hov ? '#cc88ff' : '#aa44ff';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(label, bx + bw / 2, by + 28);
    });

    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.font = '12px monospace';
    ctx.fillText('SPACE / A / L  to flip gravity   •   ESC to menu', W / 2, 340);
    ctx.textAlign = 'left';
  }

  function titleBtnBounds(i) {
    const bx = W / 2 - 100 + i * 210 - 10;
    return { x: bx, y: 260, w: 160, h: 44 };
  }

  // ── Game-over screen ────────────────────────────────────────────────────────
  function drawGameOver(ctx) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px monospace';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#ff6666';
    ctx.fillText('GAME OVER', W / 2, 150);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(`Score: ${score}`, W / 2, 200);

    // Back to menu button
    const bx = W / 2 - 90, by = 250, bw = 180, bh = 44;
    const hov = hovGOBtn === 0;
    ctx.strokeStyle = '#aa44ff';
    ctx.lineWidth = hov ? 2.5 : 1.5;
    ctx.fillStyle = hov ? 'rgba(170,68,255,0.22)' : 'rgba(170,68,255,0.08)';
    ctx.shadowColor = '#aa44ff';
    ctx.shadowBlur = hov ? 20 : 6;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = hov ? '#cc88ff' : '#aa44ff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('BACK TO MENU', W / 2, by + 28);
    ctx.textAlign = 'left';
  }

  function goMenuBounds() { return { x: W / 2 - 90, y: 250, w: 180, h: 44 }; }

  // ── Game loop ───────────────────────────────────────────────────────────────
  function gameLoop() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let xNow = false;
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) xNow = true; break; }
    if (xNow && !gpXWasPressed && screen === 'gameover') { gpXWasPressed = false; cleanup(); showMenu(); return; }
    gpXWasPressed = xNow;
    animId = requestAnimationFrame(gameLoop);
    tick++;

    if (screen === 'title' || screen === 'gameover') {
      draw();
      return;
    }

    // Speed ramp
    if (tick % 120 === 0) speed = Math.min(speed + 0.35, 14);
    spawnGap = Math.max(52, 110 - Math.floor((speed - 6.5) / 0.35) * 6);

    // Spawn obstacles
    if (tick >= nextSpawn) {
      spawnObstacle();
      nextSpawn = tick + spawnGap;
    }

    // Scroll obstacles
    for (const obs of obstacles) obs.x -= speed;
    // Remove off-screen
    while (obstacles.length && obstacles[0].x < -60) obstacles.shift();

    // Update players
    players.forEach(updatePlayer);

    // Score
    score = Math.floor(tick / 6);

    // Check all dead
    if (players.every(p => p.dead)) {
      setTimeout(() => { screen = 'gameover'; __hs('GRAVITY CHANGER', score); }, 600);
    }

    draw();
  }

  // ── Start game (after mode selected) ────────────────────────────────────────
  function startGame() {
    tick = 0;
    score = 0;
    speed = 6.5;
    spawnGap = 110;
    nextSpawn = 80;
    obstacles = [];

    if (mode === '1p') {
      players = [makePlayer(0, H, '#4488ff', { flip: false })];
    } else {
      players = [
        makePlayer(0, H / 2, '#4488ff', { flip: false }),
        makePlayer(H / 2, H / 2, '#ff4455', { flip: false }),
      ];
    }
    screen = 'game';
  }

  // ── Input ───────────────────────────────────────────────────────────────────
  const keysDown = new Set();

  function onKeyDown(e) {
    if (!running) return;
    if (e.code === 'Escape') {
      cleanup();
      showMenu();
      return;
    }

    if (screen === 'title') return; // handled by click
    if (screen === 'gameover') return; // handled by click

    // Player 1: Space
    if (e.code === 'Space' || e.code === 'KeyA') {
      if (players[0] && !players[0].dead) players[0].keys.flip = true;
    }
    // Player 2: L
    if (e.code === 'KeyL') {
      if (players[1] && !players[1].dead) players[1].keys.flip = true;
    }
  }

  function onKeyUp(e) {
    if (e.code === 'Space' || e.code === 'KeyA') {
      if (players[0]) players[0].keys.flip = false;
    }
    if (e.code === 'KeyL') {
      if (players[1]) players[1].keys.flip = false;
    }
  }

  // ── Mouse / touch for menus ─────────────────────────────────────────────────
  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      mx: (src.clientX - rect.left) * (W / rect.width),
      my: (src.clientY - rect.top)  * (H / rect.height),
    };
  }

  function onMouseMove(e) {
    if (!running) return;

// ===== linedodger.js =====
// Laser Dodge — dodge incoming red lines
const LineDodger = (() => {
  const W = 800, H = 400;
  const P_SPEED = 4;
  const LINE_LEN = W / 4;  // 200px
  const LINE_THICK = 5;
  const BASE_SPAWN = 30;   // frames between spawns at start (~0.5s @ 60fps)

  let player, lines, score, gameOver, animId, frame, lineSpeed, legPhase;
  let running = false;

  const keysHeld = {};
  const gpTouch  = { up: false, down: false, left: false, right: false };
  let gpPrevButton0 = false;
  let gpMenuFired   = false;

  const GP_DEAD = 0.25; // joystick deadzone

  function pollGamepad() {
    gpTouch.up = gpTouch.down = gpTouch.left = gpTouch.right = false;
    gpMenuFired = false;
    let button0Now = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp) continue;
      // Left joystick
      if (gp.axes[1] < -GP_DEAD) gpTouch.up    = true;
      if (gp.axes[1] >  GP_DEAD) gpTouch.down  = true;
      if (gp.axes[0] < -GP_DEAD) gpTouch.left  = true;
      if (gp.axes[0] >  GP_DEAD) gpTouch.right = true;
      // D-pad buttons (standard mapping: 12=up,13=down,14=left,15=right)
      if (gp.buttons[12]?.pressed) gpTouch.up    = true;
      if (gp.buttons[13]?.pressed) gpTouch.down  = true;
      if (gp.buttons[14]?.pressed) gpTouch.left  = true;
      if (gp.buttons[15]?.pressed) gpTouch.right = true;
      if (gp.buttons[0]?.pressed)  button0Now    = true;
      break; // first connected pad is enough
    }
    // Rising edge on X button — signal gameLoop to act
    if (button0Now && !gpPrevButton0) gpMenuFired = true;
    gpPrevButton0 = button0Now;
  }

  // ── D-pad (canvas-drawn touch controls) ────────────────────────────────────
  const DP = { cx: 718, cy: 335, sz: 36, gap: 14 };
  const dpTouch = { up: false, down: false, left: false, right: false };

  function dpBtns() {
    const { cx, cy, sz, gap } = DP;
    return {
      up:    { x: cx - sz / 2,       y: cy - sz - gap, w: sz, h: sz },
      down:  { x: cx - sz / 2,       y: cy + gap,      w: sz, h: sz },
      left:  { x: cx - sz - gap,     y: cy - sz / 2,   w: sz, h: sz },
      right: { x: cx + gap,          y: cy - sz / 2,   w: sz, h: sz },
    };
  }

  function updateTouchDirs(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const btns = dpBtns();
    dpTouch.up = dpTouch.down = dpTouch.left = dpTouch.right = false;
    for (const t of e.touches) {
      const tx = (t.clientX - rect.left) * sx;
      const ty = (t.clientY - rect.top)  * sy;
      for (const [dir, b] of Object.entries(btns)) {
        if (tx >= b.x && tx <= b.x + b.w && ty >= b.y && ty <= b.y + b.h)
          dpTouch[dir] = true;
      }
    }
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  function init() {
    player    = { x: 100, y: H / 2 };
    lines     = [];
    score     = 0;
    frame     = 0;
    legPhase  = 0;
    lineSpeed = 4;
    gameOver  = false;
    if (animId) cancelAnimationFrame(animId);
    gameLoop();
  }

  // ── Update ─────────────────────────────────────────────────────────────────
  function update() {
    frame++;

    // Score: 1 per 0.1 s = every 6 frames
    if (frame % 6 === 0) score++;

    // Speed ramp
    lineSpeed = 4 + score * 0.018;

    // Spawn lines
    const spawnInterval = Math.max(18, BASE_SPAWN - Math.floor(score / 12));
    if (frame % spawnInterval === 0) {
      lines.push({ x: W + 10, y: 30 + Math.random() * (H - 60) });
    }

    // Player movement
    const up    = keysHeld['ArrowUp']    || keysHeld['KeyW'] || dpTouch.up    || gpTouch.up;
    const down  = keysHeld['ArrowDown']  || keysHeld['KeyS'] || dpTouch.down  || gpTouch.down;
    const left  = keysHeld['ArrowLeft']  || keysHeld['KeyA'] || dpTouch.left  || gpTouch.left;
    const right = keysHeld['ArrowRight'] || keysHeld['KeyD'] || dpTouch.right || gpTouch.right;

    if (up)    player.y = Math.max(28,      player.y - P_SPEED);
    if (down)  player.y = Math.min(H - 20,  player.y + P_SPEED);
    if (left)  player.x = Math.max(28,      player.x - P_SPEED);
    if (right) player.x = Math.min(W - 28,  player.x + P_SPEED);

    if (up || down || left || right) legPhase += 0.25;

    // Scroll & collide lines
    for (let i = lines.length - 1; i >= 0; i--) {
      lines[i].x -= lineSpeed;
      if (lines[i].x + LINE_LEN < 0) { lines.splice(i, 1); continue; }

      // Slim hitbox (forgiving)
      const lx = lines[i].x, ly = lines[i].y;
      const px = player.x - 7,  py = player.y - 11;
      const pw = 14,             ph = 22;
      if (px < lx + LINE_LEN && px + pw > lx &&
          py < ly + LINE_THICK / 2 + 1 && py + ph > ly - LINE_THICK / 2 - 1) {
        gameOver = true; __hs('LASER DODGE', score);
      }
    }
  }

  // ── Draw helpers ───────────────────────────────────────────────────────────
  function drawFigure(ctx, x, y, color, phase) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;

    // Head
    ctx.beginPath(); ctx.arc(x, y - 18, 6, 0, Math.PI * 2); ctx.stroke();
    // Body
    ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x, y + 2); ctx.stroke();
    // Arms
    const aw = Math.sin(phase) * 5;
    ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x - 9, y - 2 + aw); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 9, y - 2 - aw); ctx.stroke();
    // Legs
    const l1 = Math.sin(phase) * 8, l2 = Math.sin(phase + Math.PI) * 8;
    ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x - 5, y + 13 + l1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + 5, y + 13 + l2); ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawDpad(ctx) {
    const btns = dpBtns();
    const arrows = { up: '▲', down: '▼', left: '◀', right: '▶' };
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const [dir, b] of Object.entries(btns)) {
      const active = dpTouch[dir];
      ctx.save();
      ctx.fillStyle   = active ? 'rgba(34,255,102,0.3)' : 'rgba(255,255,255,0.07)';
      ctx.strokeStyle = active ? '#22ff66' : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = active ? '#22ff66' : 'transparent';
      ctx.shadowBlur  = active ? 8 : 0;
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = active ? '#22ff66' : 'rgba(255,255,255,0.45)';
      ctx.shadowBlur = 0;
      ctx.font = '13px sans-serif';
      ctx.fillText(arrows[dir], b.x + b.w / 2, b.y + b.h / 2);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  // ── Draw ───────────────────────────────────────────────────────────────────
  function draw() {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d14';
    ctx.fillRect(0, 0, W, H);

    // Lines
    for (const ln of lines) {
      ctx.save();
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = LINE_THICK;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 14;
      ctx.lineCap = 'square';
      ctx.beginPath();
      ctx.moveTo(ln.x, ln.y);
      ctx.lineTo(ln.x + LINE_LEN, ln.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Player
    drawFigure(ctx, player.x, player.y, '#22ff66', legPhase);

    // D-pad
    drawDpad(ctx);

    // Score HUD
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 18px monospace';
    ctx.shadowColor = '#22ff66';
    ctx.shadowBlur = 8;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE  ${score}`, 16, 28);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.font = '11px monospace';
    ctx.fillText('ESC = MENU', 16, 48);

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.font = 'bold 54px monospace';
      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#ff5555';
      ctx.fillText('GAME OVER', W / 2, 160);
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 24px monospace';
      ctx.fillText(`Score: ${score}`, W / 2, 215);

      ctx.shadowColor = '#22ff66';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#22ff66';
      ctx.font = '18px monospace';
      ctx.fillText('SPACE or CLICK to play again', W / 2, 270);
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '13px monospace';
      ctx.fillText('ESC for menu', W / 2, 300);
      ctx.textAlign = 'left';
    }
  }

  // ── Loop ───────────────────────────────────────────────────────────────────
  function gameLoop() {
    pollGamepad();
    if (gameOver && gpMenuFired) { cleanup(); showMenu(); return; }
    if (!gameOver) update();
    draw();
    animId = requestAnimationFrame(gameLoop);
  }

  // ── Input ──────────────────────────────────────────────────────────────────
  function onKeyDown(e) {
    if (!running) return;
    keysHeld[e.code] = true;
    if (e.code === 'Escape') { cleanup(); showMenu(); return; }
    if (e.code === 'Space' && gameOver) init();
  }

  function onKeyUp(e) { keysHeld[e.code] = false; }

  function onClick() { if (running && gameOver) init(); }

  function onTouchStart(e) {
    e.preventDefault();
    updateTouchDirs(e);
    if (gameOver) { init(); return; }
  }

  function onTouchMove(e)  { e.preventDefault(); updateTouchDirs(e); }
  function onTouchEnd(e)   { e.preventDefault(); updateTouchDirs(e); }

  // ── Cleanup ────────────────────────────────────────────────────────────────
  function cleanup() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup',   onKeyUp);
    canvas.removeEventListener('click',      onClick);
    canvas.removeEventListener('touchstart', onTouchStart);
    canvas.removeEventListener('touchmove',  onTouchMove);
    canvas.removeEventListener('touchend',   onTouchEnd);
    Object.keys(keysHeld).forEach(k => delete keysHeld[k]);
    dpTouch.up = dpTouch.down = dpTouch.left = dpTouch.right = false;
  }

  // ── Public start ───────────────────────────────────────────────────────────
  function start() {
    cleanup();
    running = true;
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup',   onKeyUp);
    canvas.addEventListener('click',      onClick);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
    canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
    init();
  }

  return { start };
})();

    src.buffer = makeNoise(dur);
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = audioCtx.createGain();
    src.connect(hp); hp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(open ? vol * 1.7 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.start(t); src.stop(t + dur + 0.01);
  }

  // Soft sine pad for level 1
  function playSoftPad(t) {
    [261, 330, 392].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.3);
      g.gain.setValueAtTime(0.07, t + 1.6);
      g.gain.linearRampToValueAtTime(0, t + 2.2);
      o.start(t); o.stop(t + 2.3);
    });
  }

  // Triangle bass for level 1 (smooth)
  function playTriBass(freq, t, dur) {
    const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    const g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.42, t + 0.09);
    g.gain.setValueAtTime(0.42, t + dur * 0.7);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // Am minor chord stabs (triangle) for level 2
  function playMinorChord(t) {
    [220, 261, 330].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.start(t); o.stop(t + 0.47);
    });
  }

  // Wah-filtered sawtooth bass for level 2
  function playWahBass(freq, t, dur) {
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 9;
    lp.frequency.setValueAtTime(160, t);
    lp.frequency.linearRampToValueAtTime(950, t + dur * 0.3);
    lp.frequency.linearRampToValueAtTime(260, t + dur);
    const g = audioCtx.createGain();
    o.connect(lp); lp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.44, t);
    g.gain.setValueAtTime(0.44, t + dur - 0.04);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // C-major sine chord for level 3
  function plasMajorChord(t) {
    [261, 329, 392].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.37);
    });
  }

  // Sawtooth bass for levels 3/4
  function playSawBass(freq, t, dur, vol = 0.5, cutoff = 400) {
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 5;
    const g = audioCtx.createGain();
    o.connect(lp); lp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + dur - 0.04);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // Rave power chord for levels 4/5
  function playRaveChord(t) {
    [82, 123, 165, 246].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    });
  }

  // Generic melody note dispatcher
  function playMelNote(freq, t, dur) {
    const lv = LEVELS[currentLevel];
    let type = 'square', vol = 0.15, useRev = false, staccato = false;
    if (lv.stars === 1) { type = 'sine';     vol = 0.14; }
    if (lv.stars === 2) { type = 'triangle'; vol = 0.14; }
    if (lv.stars === 3) { type = 'square';   vol = 0.16; useRev = true; }
    if (lv.stars === 4) { type = 'square';   vol = 0.13; staccato = true; }
    if (lv.stars === 5) { type = 'sawtooth'; vol = 0.10; staccato = true; }

    const actualDur = staccato ? Math.min(dur, beatSec * 0.38) : dur;
    const o = audioCtx.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = audioCtx.createGain();
    o.connect(g);
    g.connect(masterGain);
    if (useRev && reverbDelay) g.connect(reverbDelay);
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + Math.max(0.01, actualDur - 0.04));
    g.gain.linearRampToValueAtTime(0, t + actualDur);
    o.start(t); o.stop(t + actualDur + (useRev ? 0.6 : 0.02));
  }

  // ── Per-level 16th-note scheduler ────────────────────────────────
  function scheduleSixteenth(idx, t) {
    const lv   = LEVELS[currentLevel];
    const beat = idx % 16;

    switch (currentLevel) {
      case 0: // CHILL ZONE — soft kick, rimshot, sparse hats, triangle bass, pad
        if (beat === 0)  playKick(t, 0.55);
        if (beat === 8)  playRimshot(t);
        if (beat % 4 === 0) playHihat(t, false, 0.05);
        if (beat % 4 === 0) playTriBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec - 0.06);
        if (beat === 0 && Math.floor(idx/16) % 2 === 0) playSoftPad(t);
        break;

      case 1: // GROOVE — kick+clap, 8th hats, wah bass, minor chords
        if (beat === 0 || beat === 8)  playKick(t);
        if (beat === 4 || beat === 12) playClap(t);
        if (beat % 2 === 0) playHihat(t, beat % 8 === 0, 0.10);
        if (beat % 4 === 0) playWahBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec - 0.04);
        if (beat % 8 === 0) playMinorChord(t);
        break;

      case 2: // NEON RUSH — original track
        if (beat === 0 || beat === 8)  playKick(t);
        if (beat === 4 || beat === 12) playSnare(t);
        playHihat(t, beat % 3 === 0);
        if (beat % 4 === 0) playSawBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec - 0.03);
        if (beat === 0) plasMajorChord(t);
        break;

      case 3: // TECHNO DROP — four-on-the-floor kick, heavy bass, rave chords
        if (beat % 4 === 0) playKick(t);
        if (beat === 4 || beat === 12) playSnare(t);
        playHihat(t, beat % 8 === 0, 0.18);
        if (beat % 4 === 0) playSawBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec * 0.85, 0.58, 500);
        if (beat === 0 || beat === 8) playRaveChord(t);
        break;

      case 4: // CHAOS — complex kick, fast hats, bass every 8th, rapid rave
        if (beat===0||beat===4||beat===6||beat===8||beat===12) playKick(t, 0.95);
        if (beat === 4 || beat === 12) playSnare(t);
        playHihat(t, beat % 6 === 0, 0.22);
        if (beat % 2 === 0) playSawBass(lv.bassHz[Math.floor(idx/2) % 8], t, beatSec * 0.48, 0.62, 600);
        if (beat % 4 === 0) playRaveChord(t);
        break;
    }
  }

  function scheduleMelody() {
    while (nextMelodyTime < audioCtx.currentTime + 0.5) {
      const note = LEVELS[currentLevel].melody[melodyBeatIdx % LEVELS[currentLevel].melody.length];
      playMelNote(note.f, nextMelodyTime, note.d * beatSec - 0.04);
      nextMelodyTime += note.d * beatSec;
      melodyBeatIdx++;
    }
  }

  function scheduleMusic() {
    const sixteenth = beatSec / 4;
    while (nextSchedTime < audioCtx.currentTime + 0.5) {
      scheduleSixteenth(sixteenthCtr, nextSchedTime);
      nextSchedTime += sixteenth;
      sixteenthCtr++;
    }
    scheduleMelody();
  }

  // ── SFX ──────────────────────────────────────────────────────────
  function playHitSfx(perfect) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(); o.type = 'sine';
    const g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain);
    if (perfect) {
      o.frequency.setValueAtTime(880, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
      g.gain.setValueAtTime(0.36, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      o.start(); o.stop(audioCtx.currentTime + 0.11);
    } else {
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.26, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      o.start(); o.stop(audioCtx.currentTime + 0.09);
    }
  }

  function playMissSfx() {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 80;
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200;
    const g = audioCtx.createGain();
    o.connect(lp); lp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.38, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.start(); o.stop(audioCtx.currentTime + 0.16);
  }

  // ── Note queue ────────────────────────────────────────────────────
  function generateNoteQueue(musicStartTime) {
    const lv  = LEVELS[currentLevel];
    const s16 = beatSec / 4;
    const q   = [];
    for (let bar = 0; bar < 200; bar++) {
      const barT = musicStartTime + bar * 4 * beatSec;
      for (const [s, lane] of lv.pattern)
        q.push({ lane, hitTime: barT + s * s16, hit: false, missed: false });
    }
    q.sort((a, b) => a.hitTime - b.hitTime);
    return q;
  }

  // ── Audio engine init ─────────────────────────────────────────────
  function initAudio() {
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.35;
    masterGain.connect(audioCtx.destination);
    reverbDelay = audioCtx.createDelay(0.5); reverbDelay.delayTime.value = 0.12;
    reverbFbGain = audioCtx.createGain(); reverbFbGain.gain.value = 0.25;
    reverbDelay.connect(reverbFbGain);
    reverbFbGain.connect(reverbDelay);
    reverbFbGain.connect(masterGain);
  }

  // ── Start a level ─────────────────────────────────────────────────
  function startLevel(idx) {
    if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
    currentLevel = idx;
    const lv  = LEVELS[idx];
    beatSec   = 60 / lv.bpm;
    noteSpeed = (TARGET_Y + 40) / lv.fallDuration;

    initAudio();
    const musicStart = audioCtx.currentTime + 0.05 + lv.fallDuration;
    nextSchedTime  = musicStart;
    sixteenthCtr   = 0;
    nextMelodyTime = musicStart;
    melodyBeatIdx  = 0;

    score = 0; combo = 0; bestCombo = 0; lives = 10;
    ratingFlashes = []; missFlash = 0;
    activeNotes = [];
    noteQueue   = generateNoteQueue(musicStart);
    nextNoteIdx = 0;
    keysHeld    = {};
    laneClickHeld = [false, false, false, false];
    gameState   = 'playing';
  }

  // ── Game logic ────────────────────────────────────────────────────
  function doMiss() {
    combo = 0; lives = Math.max(0, lives - 1); missFlash = 8;
    playMissSfx();
    if (lives <= 0) { gameState = 'gameover'; __hs('RHYTHM TAP', score); }
  }

  function tryHit(laneIdx) {
    if (gameState !== 'playing' || !audioCtx) return;
    const now = audioCtx.currentTime;
    let bestNote = null, bestPx = Infinity;
    for (const n of activeNotes) {
      if (n.hit || n.missed || n.lane !== laneIdx) continue;
      const px = Math.abs(n.hitTime - now) * noteSpeed;
      if (px <= 30 && px < bestPx) { bestPx = px; bestNote = n; }
    }
    if (bestNote) {
      bestNote.hit = true;
      let text, pts, perfect;
      if      (bestPx <= 10) { text = 'PERFECT!'; pts = 300; perfect = true; }
      else if (bestPx <= 20) { text = 'GREAT!';   pts = 150; perfect = false; }
      else                   { text = 'GOOD';      pts = 50;  perfect = false; }
      combo++; bestCombo = Math.max(bestCombo, combo);
      score += pts * Math.max(1, combo);
      playHitSfx(perfect);
      ratingFlashes.push({
        text, life: 40, maxLife: 40, lane: laneIdx,
        color: perfect ? '#ffff00' : bestPx <= 20 ? '#00ff88' : '#aaaaff',
      });
    } else {
      const wrongLane = activeNotes.some(n => {
        if (n.hit || n.missed || n.lane === laneIdx) return false;
        return Math.abs(n.hitTime - now) * noteSpeed <= 20;
      });
      if (wrongLane) doMiss();
    }
  }

  // ── Update ────────────────────────────────────────────────────────
  function update() {
    if (gameState !== 'playing' || !audioCtx) return;
    const now = audioCtx.currentTime;
    const lv  = LEVELS[currentLevel];

    scheduleMusic();

    while (nextNoteIdx < noteQueue.length &&
           noteQueue[nextNoteIdx].hitTime <= now + lv.fallDuration)
      activeNotes.push(noteQueue[nextNoteIdx++]);

    for (let i = activeNotes.length - 1; i >= 0; i--) {
      const n = activeNotes[i];
      if (!n.hit && !n.missed) {
        if (TARGET_Y - (n.hitTime - now) * noteSpeed > TARGET_Y + 36) {
          n.missed = true; doMiss();
        }
      }
      if ((n.hit || n.missed) && now - n.hitTime > 0.6) activeNotes.splice(i, 1);
    }
    for (let i = ratingFlashes.length - 1; i >= 0; i--)
      if (--ratingFlashes[i].life <= 0) ratingFlashes.splice(i, 1);
    if (missFlash > 0) missFlash--;
  }

  // ── Draw: level select ────────────────────────────────────────────
  function drawSelect() {
    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, W, H);

    // Scrolling grid
    const gOff = (Date.now() / 50) % 50;
    ctx.strokeStyle = 'rgba(255,68,204,0.06)'; ctx.lineWidth = 1;
    for (let x = gOff - 50; x < W + 50; x += 50) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }

    // Title
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff44cc'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#ff44cc'; ctx.font = 'bold 34px monospace';
    ctx.fillText('RHYTHM TAP', W / 2, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '14px monospace';
    ctx.fillText('SELECT A LEVEL', W / 2, 72);

    // Level cards: 5 × 130px with 10px gap = 700px total, startX=50
    const CW = 130, CH = 188, GAP = 10;
    const totalW = 5 * CW + 4 * GAP;
    const sx = (W - totalW) / 2;

    LEVELS.forEach((lv, i) => {
      const x = sx + i * (CW + GAP);
      const hov = hoveredLevel === i;
      const cy  = 90 + (hov ? -8 : 0);

      ctx.shadowColor = lv.color; ctx.shadowBlur = hov ? 28 : 10;
      ctx.strokeStyle = lv.color; ctx.lineWidth = hov ? 2.5 : 1.5;
      ctx.fillStyle   = hov ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.roundRect(x, cy, CW, CH, 12); ctx.fill(); ctx.stroke();
      ctx.shadowBlur  = 0;

      // Colour top bar
      ctx.fillStyle = lv.color + (hov ? 'cc' : '88');
      ctx.beginPath(); ctx.roundRect(x, cy, CW, 8, [12,12,0,0]); ctx.fill();

      // Number
      ctx.shadowColor = lv.color; ctx.shadowBlur = 10;
      ctx.fillStyle = lv.color; ctx.font = 'bold 30px monospace';
      ctx.fillText(i + 1, x + CW / 2, cy + 52); ctx.shadowBlur = 0;

      // Name
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px monospace';
      ctx.fillText(lv.name, x + CW / 2, cy + 76);

      // Stars
      ctx.fillStyle = '#ffdd00'; ctx.font = '13px monospace';
      ctx.fillText('★'.repeat(lv.stars) + '☆'.repeat(5 - lv.stars), x + CW / 2, cy + 97);

      // BPM
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px monospace';
      ctx.fillText(`${lv.bpm} BPM`, x + CW / 2, cy + 116);

      // Desc
      ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.font = '10px monospace';
      ctx.fillText(lv.desc, x + CW / 2, cy + 134);

      if (hov) {
        ctx.shadowColor = lv.color; ctx.shadowBlur = 10;
        ctx.fillStyle = lv.color; ctx.font = 'bold 12px monospace';
        ctx.fillText('▶  PLAY', x + CW / 2, cy + CH - 12); ctx.shadowBlur = 0;
      }
    });

    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.font = '11px monospace';
    ctx.fillText('Click a level  •  Press 1–5 to quick-select  •  ESC = main menu', W / 2, H - 12);
    ctx.textAlign = 'left';
  }

  // ── Draw: gameplay ────────────────────────────────────────────────
  function drawGame() {
    const now = audioCtx ? audioCtx.currentTime : 0;
    const lv  = LEVELS[currentLevel];

    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, W, H);
    if (missFlash > 0) {
      ctx.fillStyle = `rgba(255,0,0,${(missFlash/8)*0.32})`; ctx.fillRect(0,0,W,H);
    }

    // Lane columns
    LANES.forEach((lane, i) => {
      const x = laneX(i), held = keysHeld[lane.key] || laneClickHeld[i];
      ctx.fillStyle = held ? lane.color + '30' : lane.color + '16';
      ctx.fillRect(x, 0, LANE_W, H);
      ctx.strokeStyle = lane.color + '40'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x,0);        ctx.lineTo(x,H);        ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+LANE_W,0); ctx.lineTo(x+LANE_W,H); ctx.stroke();
    });

    // Target zones
    LANES.forEach((lane, i) => {
      const x = laneX(i), held = keysHeld[lane.key] || laneClickHeld[i];
      ctx.shadowColor = lane.color; ctx.shadowBlur = held ? 20 : 8;
      ctx.strokeStyle = lane.color; ctx.lineWidth = held ? 3 : 2;
      ctx.fillStyle   = lane.color + (held ? '30' : '16');
      ctx.beginPath(); ctx.roundRect(x+5, TARGET_Y-NOTE_H/2, LANE_W-10, NOTE_H, 6);
      ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
      ctx.fillStyle = lane.color; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
      ctx.fillText(lane.symbol, x+LANE_W/2, TARGET_Y+NOTE_H/2+18);
    });

    // Notes
    activeNotes.forEach(n => {
      if (n.hit || n.missed) return;
      const ny = TARGET_Y - (n.hitTime - now) * noteSpeed;
      if (ny < -44 || ny > H + 10) return;
      const lane = LANES[n.lane], x = laneX(n.lane);
      ctx.shadowColor = lane.color; ctx.shadowBlur = 10;
      ctx.fillStyle = lane.color;
      ctx.beginPath(); ctx.roundRect(x+5, ny-NOTE_H/2, LANE_W-10, NOTE_H, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
      ctx.fillText(lane.symbol, x+LANE_W/2, ny+6);
    });

    // Rating flashes
    ratingFlashes.forEach(f => {
      const a = f.life / f.maxLife;
      ctx.save(); ctx.globalAlpha = a;
      ctx.shadowColor = f.color; ctx.shadowBlur = 14; ctx.fillStyle = f.color;
      ctx.font = 'bold 19px monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.text, laneCX(f.lane), TARGET_Y - 30 - (1-a)*22);
      ctx.restore();
    });

    // HUD — hearts
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i < lives ? '#ff4444' : 'rgba(255,255,255,0.14)';
      ctx.font = '14px monospace'; ctx.textAlign = 'left';
      ctx.fillText('♥', 10 + i * 17, 22);
    }

    // Level tag
    ctx.fillStyle = lv.color; ctx.shadowColor = lv.color; ctx.shadowBlur = 6;
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`LV${currentLevel+1} ${lv.name}  ${lv.bpm}BPM`, 10, 40);
    ctx.shadowBlur = 0;

    // Score
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 5; ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText(String(score).padStart(7,'0'), W/2, 22); ctx.shadowBlur = 0;

    // Combo
    if (combo >= 2) {
      ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 8; ctx.fillStyle = '#ffff00';
      ctx.font = 'bold 15px monospace'; ctx.textAlign = 'right';
      ctx.fillText(`${combo}× COMBO`, W-10, 22); ctx.shadowBlur = 0;
    }

    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
    ctx.fillText('ESC = level select', W-10, 40);

    // Game over overlay
    if (gameState === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.76)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 28;
      ctx.fillStyle = '#ff5555'; ctx.font = 'bold 52px monospace';
      ctx.fillText('GAME OVER', W/2, 130); ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`Score: ${score}`, W/2, 186);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '16px monospace';
      ctx.fillText(`Best Combo: ${bestCombo}×`, W/2, 216);
      ctx.shadowColor = lv.color; ctx.shadowBlur = 10; ctx.fillStyle = lv.color;
      ctx.font = '16px monospace';

    if (!running) return;

      });

    }
  }

    if (!running) return;

    if (gameState === 'select') {
      LEVELS.forEach((_, i) => {
        const b = cardBounds(i);
        if (mx >= b.x && mx <= b.x+b.w && my >= b.y-10 && my <= b.y+b.h) startLevel(i);

  function onCanvasMouseDown(e) {
    if (!running) return;
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top)  * (H / r.height);

    }

  // ── Cleanup ───────────────────────────────────────────────────────
  function cleanup() {

    if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
    document.removeEventListener('keydown',   onKeyDown);
    document.removeEventListener('keyup',     onKeyUp);
    canvas.removeEventListener('mousemove',   onMouseMove);
    canvas.removeEventListener('mousedown',   onCanvasMouseDown);
    canvas.removeEventListener('mouseup',     onCanvasMouseUp);
    canvas.removeEventListener('touchstart',  onTouchStart);
    canvas.removeEventListener('touchend',    onTouchEnd);
    canvas.style.cursor = 'default';
    keysHeld = {};
    laneClickHeld = [false, false, false, false];
  }

  // ── Public start ──────────────────────────────────────────────────
  function start() {
    cleanup();
    running       = true;
    gameState     = 'select';
    hoveredLevel  = -1;
    keysHeld      = {};
    laneClickHeld = [false, false, false, false];
    activeNotes   = [];
    ratingFlashes = [];
    hideTouchControls();
    document.addEventListener('keydown',  onKeyDown);
    document.addEventListener('keyup',    onKeyUp);
    canvas.addEventListener('mousemove',  onMouseMove);
    canvas.addEventListener('mousedown',  onCanvasMouseDown);
    canvas.addEventListener('mouseup',    onCanvasMouseUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });

  }

  return { start };
})();

  <script>
// ===== rocket.js =====
// Boost Ball — Sideswipe-style car soccer for 1 or 2 players
// Side view. Cars drive, rotate in the air, jump, double-jump/flip and boost.
// 3 minute match, first to 10 goals wins, tied = overtime (next goal wins).
const RocketLeague = (() => {
  const W = 800, H = 400, TAU = Math.PI * 2;

  // ── Arena ──────────────────────────────────────────────────────────────────
  const CEIL = 56, FLOOR = 360, WALL_L = 40, WALL_R = 760, GOAL_TOP = 250;
  const BALL_R = 14, CAR_W = 46, CAR_H = 20;

  // ── Rules ──────────────────────────────────────────────────────────────────
  const MATCH_FRAMES = 180 * 60;
  const WIN_SCORE = 10;

  // ── Physics (units are pixels per frame @ 60fps; each frame is 3 sub-steps) ─
  const SUB = 3, HS = 1 / SUB;
  const CAR_GRAV = 0.45, BALL_GRAV = 0.2;
  const JUMP_V = 9.6, DODGE_V = 8, FLIP_FRAMES = 21, FLIP_SPIN = 0.3;
  const AIR_ACC = 0.022, AIR_MAX = 0.14, FAST_FALL = 0.55;
  const GROUND_ACC = 0.45, GROUND_MAX = 6.2, GROUND_FRIC = 0.93;
  const BOOST_ACC = 0.55, BOOST_USE = 0.7, BOOST_REGEN = 0.6;
  const BOOST_GROUND_MAX = 12, MAX_CAR_V = 13;
  const MAX_BALL_V = 15;
  const E_FLOOR = 0.7, E_WALL = 0.8, E_CEIL = 0.6, E_CAR = 0.45;

  const C1 = '#33aaff', C2 = '#ff8a1f';
  const DIFF = {
    easy:   { react: 12, err: 70, lead: 4,  boost: false, flips: false, speed: 0.72 },
    medium: { react: 6,  err: 30, lead: 8,  boost: true,  flips: true,  speed: 0.88 },
    hard:   { react: 2,  err: 10, lead: 12, boost: true,  flips: true,  speed: 1.0  },
  };
  const DIFF_KEYS = ['easy', 'medium', 'hard'];

  const CORNERS = [[-CAR_W / 2, -CAR_H / 2], [CAR_W / 2, -CAR_H / 2], [CAR_W / 2, CAR_H / 2], [-CAR_W / 2, CAR_H / 2]];

  // ── State ──────────────────────────────────────────────────────────────────
  let running = false, animId = null, lastTs = 0, acc = 0, frameN = 0;
  let screen = 'mode';            // 'mode' | 'diff' | 'match'
  let phase = 'countdown';        // 'countdown' | 'play' | 'goal' | 'over'
  let sel = 0, numPlayers = 1, diff = 'medium';
  let cars = [], ball = null, particles = [];
  let scores = [0, 0], timeLeft = MATCH_FRAMES, overtime = false, otFrames = 0;
  let cdFrames = 0, goalFrames = 0, goFlash = 0, lastScorer = 0, winner = -1, shake = 0, soundCd = 0;
  let paused = false, hover = -1;
  let gpXWas = false;
  const keys = {};

  const BLOCK = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'ShiftLeft', 'ShiftRight']);

  // ── Helpers ────────────────────────────────────────────────────────────────
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrapAngle = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
  const rrect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);

  };

  // ── Sound (quiet little synth blips) ───────────────────────────────────────
  let actx = null;
  function audio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }

  }
  function tone(freq, dur, type = 'square', vol = 0.035, endFreq = null) {

    notes.forEach((f, i) => setTimeout(() => { if (running) tone(f, 0.16, type, vol); }, i * gap));
  }

  // ── Match setup ────────────────────────────────────────────────────────────
  function makeCar(team) {
    return {
      team, x: team === 0 ? 190 : 610, y: FLOOR - CAR_H / 2,
      vx: 0, vy: 0, ang: 0, av: 0, facing: team === 0 ? 1 : -1,
      onGround: true, jumps: 0, flipT: 0, boost: 100, boosting: false, jumpPrev: false,
      color: team === 0 ? C1 : C2,
      in: { left: false, right: false, jump: false, fall: false, boost: false },
      ai: (team === 1 && numPlayers === 1) ? { err: 0, errT: 0, jumpCd: 0, last: null } : null,
    };
  }

  function resetKickoff(frames) {
    cars = [makeCar(0), makeCar(1)];
    ball = { x: W / 2, y: 190, vx: 0, vy: 0, rot: 0, trail: [] };
    phase = 'countdown';
    cdFrames = frames;
    goFlash = 0;
    particles = [];
  }

  function startMatch() {
    screen = 'match';
    scores = [0, 0];
    timeLeft = MATCH_FRAMES;
    overtime = false; otFrames = 0;
    winner = -1; paused = false; shake = 0;
    resetKickoff(180);
  }

  function endMatch(w) {
    winner = w;
    phase = 'over';
    melody([523, 659, 784, 1047], 120, 'triangle', 0.04);
  }

  function scoreGoal(team) {
    scores[team]++;
    lastScorer = team;
    phase = 'goal';
    goalFrames = 140;
    shake = 16;
    if (scores[team] >= WIN_SCORE || overtime) winner = team;
    const col = team === 0 ? C1 : C2;
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * TAU, s = 1 + Math.random() * 6;
      particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 50 + Math.random() * 40, max: 90,
        color: Math.random() < 0.5 ? col : '#ffffff', size: 2 + Math.random() * 3, grav: 0.1 });
    }

  }

  // ── Input ──────────────────────────────────────────────────────────────────
  function humanInput(c) {
    const k = keys, solo = numPlayers === 1;
    if (c.team === 0) {
      return {
        left: !!(k.KeyA || (solo && k.ArrowLeft)),
        right: !!(k.KeyD || (solo && k.ArrowRight)),
        jump: !!(k.KeyW || (solo && (k.ArrowUp || k.Space))),
        fall: !!(k.KeyS || (solo && k.ArrowDown)),
        boost: !!(k.ShiftLeft || (solo && k.ShiftRight)),
      };
    }
    return { left: !!k.ArrowLeft, right: !!k.ArrowRight, jump: !!k.ArrowUp, fall: !!k.ArrowDown, boost: !!k.ShiftRight };
  }

  // Computer player ----------------------------------------------------------
  function aiInput(c) {
    const d = DIFF[diff], ai = c.ai;
    const inp = { left: false, right: false, jump: false, fall: false, boost: false };
    if (ai.jumpCd > 0) ai.jumpCd--;
    if (--ai.errT <= 0) { ai.errT = 25; ai.err = (Math.random() - 0.5) * 2 * d.err; }

    const atk = c.team === 1 ? -1 : 1;                 // direction of the goal this car attacks
    const px = clamp(ball.x + ball.vx * d.lead, WALL_L + 20, WALL_R - 20);
    const dx = ball.x - c.x, dy = ball.y - c.y, dist = Math.hypot(dx, dy);
    const behind = (c.x - ball.x) * atk <= -4;         // car really is on its own-goal side of the ball

    let tx;
    if (behind) {
      tx = Math.abs(c.x - ball.x) < 90 ? px + atk * 40 : px - atk * 50;  // line up, then drive through the ball
    } else {

    }
    tx += ai.err;

    if (c.onGround) {
      const ddx = tx - c.x;
      if (ddx > 10) inp.right = true; else if (ddx < -10) inp.left = true;
      if (d.boost && c.boost > 40 && Math.abs(ddx) > (behind ? 140 : 60) && ddx * c.facing > 0) inp.boost = true;
      if (ai.jumpCd <= 0) {
        if (behind && Math.abs(dx) < 80 && dy < -45) { inp.jump = true; ai.jumpCd = 45; }               // ball is up high
        else if (!behind && Math.abs(dx) < 70 + Math.abs(c.vx) * 5 && dy > -60) { inp.jump = true; ai.jumpCd = 45; }  // hop over the ball, never push it into our own goal
      }
    } else {
      const aim = behind && dist < 230;
      const target = aim ? (c.facing === 1 ? Math.atan2(dy, dx) : Math.atan2(dy, dx) - Math.PI) : 0;
      const diffA = wrapAngle(target - c.ang);
      if (diffA > 0.12) inp.right = true; else if (diffA < -0.12) inp.left = true;

      }

    } else {
      ai.last = { left: inp.left, right: inp.right, boost: inp.boost };

  }

  // ── Car controls (once per frame) ──────────────────────────────────────────
  function control(c) {
    const i = c.in, sp = c.ai ? DIFF[diff].speed : 1;

      } else if (c.jumps < 2) {

        const dir = (i.right && !i.left) ? 1 : (i.left && !i.right) ? -1 : 0;

  // ── Collisions ─────────────────────────────────────────────────────────────
  function resolveCarArena(c) {
    const cs = Math.cos(c.ang), sn = Math.sin(c.ang);
    let up = 0, down = 0, left = 0, right = 0, floorHit = false;
    for (const [lx, ly] of CORNERS) {

      if (py < CEIL) down = Math.max(down, CEIL - py);

        if (py < GOAL_TOP) {
          const dx = px - WALL_R, dy = GOAL_TOP - py;
          if (dx <= dy) left = Math.max(left, dx); else down = Math.max(down, dy);

      }
    }
    c.x += right - left;
    c.y += down - up;
    if (right > 0 && c.vx < 0) c.vx = 0;
    if (left > 0 && c.vx > 0) c.vx = 0;
    if (up > 0 && c.vy > 0) c.vy = 0;
    if (down > 0 && c.vy < 0) c.vy = 0;
    if (floorHit) c.onGround = true;
  }

  function ballArena() {
    const b = ball, r = BALL_R;

      const wx = dir === 1 ? WALL_L : WALL_R;
      const inward = (b.x - wx) * dir;
      if (b.y < GOAL_TOP) {
        if (inward < r) { b.x = wx + dir * r; if (b.vx * dir < 0) b.vx = -b.vx * E_WALL; }
      } else if (inward < 0) {                         // inside the goal pocket: roof above it
        if (b.y - r < GOAL_TOP) { b.y = GOAL_TOP + r; if (b.vy < 0) b.vy = -b.vy * 0.4; }
      } else if (inward < r) {                         // goal post corner

    if (b.x - r < 0) { b.x = r; if (b.vx < 0) b.vx = -b.vx * 0.4; }
    if (b.x + r > W) { b.x = W - r; if (b.vx > 0) b.vx = -b.vx * 0.4; }
  }

  function carBall(c) {
    const b = ball, cs = Math.cos(c.ang), sn = Math.sin(c.ang);
    const dx = b.x - c.x, dy = b.y - c.y;
    const lx = dx * cs + dy * sn, ly = -dx * sn + dy * cs;       // ball in the car's own frame
    const hw = CAR_W / 2, hh = CAR_H / 2;
