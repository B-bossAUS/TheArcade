  function playSnare(t) {
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(0.2);
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1000;
    const g = audioCtx.createGain();
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    src.start(t); src.stop(t + 0.22);
  }

  function playClap(t) {
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(0.14);
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.8;
    const g = audioCtx.createGain();
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.42, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    src.start(t); src.stop(t + 0.15);
  }

  function playRimshot(t) {
    const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = 350;
    const g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.start(t); o.stop(t + 0.08);
  }

  function playHihat(t, open = false, vol = 0.13) {
    const dur = open ? 0.28 : 0.07;
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoise(dur);
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = audioCtx.createGain();
    src.connect(hp); hp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(open ? vol * 1.7 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.start(t); src.stop(t + dur + 0.01);
  }

  // Soft sine pad for level 1
  function playSoftPad(t) {
    [261, 330, 392].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.3);
      g.gain.setValueAtTime(0.07, t + 1.6);
      g.gain.linearRampToValueAtTime(0, t + 2.2);
      o.start(t); o.stop(t + 2.3);
    });
  }

  // Triangle bass for level 1 (smooth)
  function playTriBass(freq, t, dur) {
    const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    const g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.42, t + 0.09);
    g.gain.setValueAtTime(0.42, t + dur * 0.7);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // Am minor chord stabs (triangle) for level 2
  function playMinorChord(t) {
    [220, 261, 330].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.start(t); o.stop(t + 0.47);
    });
  }

  // Wah-filtered sawtooth bass for level 2
  function playWahBass(freq, t, dur) {
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 9;
    lp.frequency.setValueAtTime(160, t);
    lp.frequency.linearRampToValueAtTime(950, t + dur * 0.3);
    lp.frequency.linearRampToValueAtTime(260, t + dur);
    const g = audioCtx.createGain();
    o.connect(lp); lp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.44, t);
    g.gain.setValueAtTime(0.44, t + dur - 0.04);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // C-major sine chord for level 3
  function plasMajorChord(t) {
    [261, 329, 392].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.37);
    });
  }

  // Sawtooth bass for levels 3/4
  function playSawBass(freq, t, dur, vol = 0.5, cutoff = 400) {
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 5;
    const g = audioCtx.createGain();
    o.connect(lp); lp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + dur - 0.04);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // Rave power chord for levels 4/5
  function playRaveChord(t) {
    [82, 123, 165, 246].forEach(freq => {
      const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq;
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    });
  }

  // Generic melody note dispatcher
  function playMelNote(freq, t, dur) {
    const lv = LEVELS[currentLevel];
    let type = 'square', vol = 0.15, useRev = false, staccato = false;
    if (lv.stars === 1) { type = 'sine';     vol = 0.14; }
    if (lv.stars === 2) { type = 'triangle'; vol = 0.14; }
    if (lv.stars === 3) { type = 'square';   vol = 0.16; useRev = true; }
    if (lv.stars === 4) { type = 'square';   vol = 0.13; staccato = true; }
    if (lv.stars === 5) { type = 'sawtooth'; vol = 0.10; staccato = true; }

    const actualDur = staccato ? Math.min(dur, beatSec * 0.38) : dur;
    const o = audioCtx.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = audioCtx.createGain();
    o.connect(g);
    g.connect(masterGain);
    if (useRev && reverbDelay) g.connect(reverbDelay);
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + Math.max(0.01, actualDur - 0.04));
    g.gain.linearRampToValueAtTime(0, t + actualDur);
    o.start(t); o.stop(t + actualDur + (useRev ? 0.6 : 0.02));
  }

  // ── Per-level 16th-note scheduler ────────────────────────────────
  function scheduleSixteenth(idx, t) {
    const lv   = LEVELS[currentLevel];
    const beat = idx % 16;

    switch (currentLevel) {
      case 0: // CHILL ZONE — soft kick, rimshot, sparse hats, triangle bass, pad
        if (beat === 0)  playKick(t, 0.55);
        if (beat === 8)  playRimshot(t);
        if (beat % 4 === 0) playHihat(t, false, 0.05);
        if (beat % 4 === 0) playTriBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec - 0.06);
        if (beat === 0 && Math.floor(idx/16) % 2 === 0) playSoftPad(t);
        break;

      case 1: // GROOVE — kick+clap, 8th hats, wah bass, minor chords
        if (beat === 0 || beat === 8)  playKick(t);
        if (beat === 4 || beat === 12) playClap(t);
        if (beat % 2 === 0) playHihat(t, beat % 8 === 0, 0.10);
        if (beat % 4 === 0) playWahBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec - 0.04);
        if (beat % 8 === 0) playMinorChord(t);
        break;

      case 2: // NEON RUSH — original track
        if (beat === 0 || beat === 8)  playKick(t);
        if (beat === 4 || beat === 12) playSnare(t);
        playHihat(t, beat % 3 === 0);
        if (beat % 4 === 0) playSawBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec - 0.03);
        if (beat === 0) plasMajorChord(t);
        break;

      case 3: // TECHNO DROP — four-on-the-floor kick, heavy bass, rave chords
        if (beat % 4 === 0) playKick(t);
        if (beat === 4 || beat === 12) playSnare(t);
        playHihat(t, beat % 8 === 0, 0.18);
        if (beat % 4 === 0) playSawBass(lv.bassHz[Math.floor(idx/4) % 8], t, beatSec * 0.85, 0.58, 500);
        if (beat === 0 || beat === 8) playRaveChord(t);
        break;

      case 4: // CHAOS — complex kick, fast hats, bass every 8th, rapid rave
        if (beat===0||beat===4||beat===6||beat===8||beat===12) playKick(t, 0.95);
        if (beat === 4 || beat === 12) playSnare(t);
        playHihat(t, beat % 6 === 0, 0.22);
        if (beat % 2 === 0) playSawBass(lv.bassHz[Math.floor(idx/2) % 8], t, beatSec * 0.48, 0.62, 600);
        if (beat % 4 === 0) playRaveChord(t);
        break;
    }
  }

  function scheduleMelody() {
    while (nextMelodyTime < audioCtx.currentTime + 0.5) {
      const note = LEVELS[currentLevel].melody[melodyBeatIdx % LEVELS[currentLevel].melody.length];
      playMelNote(note.f, nextMelodyTime, note.d * beatSec - 0.04);
      nextMelodyTime += note.d * beatSec;
      melodyBeatIdx++;
    }
  }

  function scheduleMusic() {
    const sixteenth = beatSec / 4;
    while (nextSchedTime < audioCtx.currentTime + 0.5) {
      scheduleSixteenth(sixteenthCtr, nextSchedTime);
      nextSchedTime += sixteenth;
      sixteenthCtr++;
    }
    scheduleMelody();
  }

  // ── SFX ──────────────────────────────────────────────────────────
  function playHitSfx(perfect) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(); o.type = 'sine';
    const g = audioCtx.createGain();
    o.connect(g); g.connect(masterGain);
    if (perfect) {
      o.frequency.setValueAtTime(880, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
      g.gain.setValueAtTime(0.36, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      o.start(); o.stop(audioCtx.currentTime + 0.11);
    } else {
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.26, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      o.start(); o.stop(audioCtx.currentTime + 0.09);
    }
  }

  function playMissSfx() {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 80;
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200;
    const g = audioCtx.createGain();
    o.connect(lp); lp.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.38, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.start(); o.stop(audioCtx.currentTime + 0.16);
  }

  // ── Note queue ────────────────────────────────────────────────────
  function generateNoteQueue(musicStartTime) {
    const lv  = LEVELS[currentLevel];
    const s16 = beatSec / 4;
    const q   = [];
    for (let bar = 0; bar < 200; bar++) {
      const barT = musicStartTime + bar * 4 * beatSec;
      for (const [s, lane] of lv.pattern)
        q.push({ lane, hitTime: barT + s * s16, hit: false, missed: false });
    }
    q.sort((a, b) => a.hitTime - b.hitTime);
    return q;
  }

  // ── Audio engine init ─────────────────────────────────────────────
  function initAudio() {
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.35;
    masterGain.connect(audioCtx.destination);
    reverbDelay = audioCtx.createDelay(0.5); reverbDelay.delayTime.value = 0.12;
    reverbFbGain = audioCtx.createGain(); reverbFbGain.gain.value = 0.25;
    reverbDelay.connect(reverbFbGain);
    reverbFbGain.connect(reverbDelay);
    reverbFbGain.connect(masterGain);
  }

  // ── Start a level ─────────────────────────────────────────────────
  function startLevel(idx) {
    if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
    currentLevel = idx;
    const lv  = LEVELS[idx];
    beatSec   = 60 / lv.bpm;
    noteSpeed = (TARGET_Y + 40) / lv.fallDuration;

    initAudio();
    const musicStart = audioCtx.currentTime + 0.05 + lv.fallDuration;
    nextSchedTime  = musicStart;
    sixteenthCtr   = 0;
    nextMelodyTime = musicStart;
    melodyBeatIdx  = 0;

    score = 0; combo = 0; bestCombo = 0; lives = 10;
    ratingFlashes = []; missFlash = 0;
    activeNotes = [];
    noteQueue   = generateNoteQueue(musicStart);
    nextNoteIdx = 0;
    keysHeld    = {};
    laneClickHeld = [false, false, false, false];
    gameState   = 'playing';
  }

  // ── Game logic ────────────────────────────────────────────────────
  function doMiss() {
    combo = 0; lives = Math.max(0, lives - 1); missFlash = 8;
    playMissSfx();
    if (lives <= 0) { gameState = 'gameover'; }
  }

  function tryHit(laneIdx) {
    if (gameState !== 'playing' || !audioCtx) return;
    const now = audioCtx.currentTime;
    let bestNote = null, bestPx = Infinity;
    for (const n of activeNotes) {
      if (n.hit || n.missed || n.lane !== laneIdx) continue;
      const px = Math.abs(n.hitTime - now) * noteSpeed;
      if (px <= 30 && px < bestPx) { bestPx = px; bestNote = n; }
    }
    if (bestNote) {
      bestNote.hit = true;
      let text, pts, perfect;
      if      (bestPx <= 10) { text = 'PERFECT!'; pts = 300; perfect = true; }
      else if (bestPx <= 20) { text = 'GREAT!';   pts = 150; perfect = false; }
      else                   { text = 'GOOD';      pts = 50;  perfect = false; }
      combo++; bestCombo = Math.max(bestCombo, combo);
      score += pts * Math.max(1, combo);
      playHitSfx(perfect);
      ratingFlashes.push({
        text, life: 40, maxLife: 40, lane: laneIdx,
        color: perfect ? '#ffff00' : bestPx <= 20 ? '#00ff88' : '#aaaaff',
      });
    } else {
      const wrongLane = activeNotes.some(n => {
        if (n.hit || n.missed || n.lane === laneIdx) return false;
        return Math.abs(n.hitTime - now) * noteSpeed <= 20;
      });
      if (wrongLane) doMiss();
    }
  }

  // ── Update ────────────────────────────────────────────────────────
  function update() {
    if (gameState !== 'playing' || !audioCtx) return;
    const now = audioCtx.currentTime;
    const lv  = LEVELS[currentLevel];

    scheduleMusic();

    while (nextNoteIdx < noteQueue.length &&
           noteQueue[nextNoteIdx].hitTime <= now + lv.fallDuration)
      activeNotes.push(noteQueue[nextNoteIdx++]);

    for (let i = activeNotes.length - 1; i >= 0; i--) {
      const n = activeNotes[i];
      if (!n.hit && !n.missed) {
        if (TARGET_Y - (n.hitTime - now) * noteSpeed > TARGET_Y + 36) {
          n.missed = true; doMiss();
        }
      }
      if ((n.hit || n.missed) && now - n.hitTime > 0.6) activeNotes.splice(i, 1);
    }
    for (let i = ratingFlashes.length - 1; i >= 0; i--)
      if (--ratingFlashes[i].life <= 0) ratingFlashes.splice(i, 1);
    if (missFlash > 0) missFlash--;
  }

  // ── Draw: level select ────────────────────────────────────────────
  function drawSelect() {
    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, W, H);

    // Scrolling grid
    const gOff = (Date.now() / 50) % 50;
    ctx.strokeStyle = 'rgba(255,68,204,0.06)'; ctx.lineWidth = 1;
    for (let x = gOff - 50; x < W + 50; x += 50) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }

    // Title
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff44cc'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#ff44cc'; ctx.font = 'bold 34px monospace';
    ctx.fillText('RHYTHM TAP', W / 2, 48);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '14px monospace';
    ctx.fillText('SELECT A LEVEL', W / 2, 72);

    // Level cards: 5 × 130px with 10px gap = 700px total, startX=50
    const CW = 130, CH = 188, GAP = 10;
    const totalW = 5 * CW + 4 * GAP;
    const sx = (W - totalW) / 2;

    LEVELS.forEach((lv, i) => {
      const x = sx + i * (CW + GAP);
      const hov = hoveredLevel === i;
      const cy  = 90 + (hov ? -8 : 0);

      ctx.shadowColor = lv.color; ctx.shadowBlur = hov ? 28 : 10;
      ctx.strokeStyle = lv.color; ctx.lineWidth = hov ? 2.5 : 1.5;
      ctx.fillStyle   = hov ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.roundRect(x, cy, CW, CH, 12); ctx.fill(); ctx.stroke();
      ctx.shadowBlur  = 0;

      // Colour top bar
      ctx.fillStyle = lv.color + (hov ? 'cc' : '88');
      ctx.beginPath(); ctx.roundRect(x, cy, CW, 8, [12,12,0,0]); ctx.fill();

      // Number
      ctx.shadowColor = lv.color; ctx.shadowBlur = 10;
      ctx.fillStyle = lv.color; ctx.font = 'bold 30px monospace';
      ctx.fillText(i + 1, x + CW / 2, cy + 52); ctx.shadowBlur = 0;

      // Name
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px monospace';
      ctx.fillText(lv.name, x + CW / 2, cy + 76);

      // Stars
      ctx.fillStyle = '#ffdd00'; ctx.font = '13px monospace';
      ctx.fillText('★'.repeat(lv.stars) + '☆'.repeat(5 - lv.stars), x + CW / 2, cy + 97);

      // BPM
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px monospace';
      ctx.fillText(`${lv.bpm} BPM`, x + CW / 2, cy + 116);

      // Desc
      ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.font = '10px monospace';
      ctx.fillText(lv.desc, x + CW / 2, cy + 134);

      if (hov) {
        ctx.shadowColor = lv.color; ctx.shadowBlur = 10;
        ctx.fillStyle = lv.color; ctx.font = 'bold 12px monospace';
        ctx.fillText('▶  PLAY', x + CW / 2, cy + CH - 12); ctx.shadowBlur = 0;
      }
    });

    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.font = '11px monospace';
    ctx.fillText('Click a level  •  Press 1–5 to quick-select  •  ESC = main menu', W / 2, H - 12);
    ctx.textAlign = 'left';
  }

  // ── Draw: gameplay ────────────────────────────────────────────────
  function drawGame() {
    const now = audioCtx ? audioCtx.currentTime : 0;
    const lv  = LEVELS[currentLevel];

    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, W, H);
    if (missFlash > 0) {
      ctx.fillStyle = `rgba(255,0,0,${(missFlash/8)*0.32})`; ctx.fillRect(0,0,W,H);
    }

    // Lane columns
    LANES.forEach((lane, i) => {
      const x = laneX(i), held = keysHeld[lane.key] || laneClickHeld[i];
      ctx.fillStyle = held ? lane.color + '30' : lane.color + '16';
      ctx.fillRect(x, 0, LANE_W, H);
      ctx.strokeStyle = lane.color + '40'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x,0);        ctx.lineTo(x,H);        ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+LANE_W,0); ctx.lineTo(x+LANE_W,H); ctx.stroke();
    });

    // Target zones
    LANES.forEach((lane, i) => {
      const x = laneX(i), held = keysHeld[lane.key] || laneClickHeld[i];
      ctx.shadowColor = lane.color; ctx.shadowBlur = held ? 20 : 8;
      ctx.strokeStyle = lane.color; ctx.lineWidth = held ? 3 : 2;
      ctx.fillStyle   = lane.color + (held ? '30' : '16');
      ctx.beginPath(); ctx.roundRect(x+5, TARGET_Y-NOTE_H/2, LANE_W-10, NOTE_H, 6);
      ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
      ctx.fillStyle = lane.color; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
      ctx.fillText(lane.symbol, x+LANE_W/2, TARGET_Y+NOTE_H/2+18);
    });

    // Notes
    activeNotes.forEach(n => {
      if (n.hit || n.missed) return;
      const ny = TARGET_Y - (n.hitTime - now) * noteSpeed;
      if (ny < -44 || ny > H + 10) return;
      const lane = LANES[n.lane], x = laneX(n.lane);
      ctx.shadowColor = lane.color; ctx.shadowBlur = 10;
      ctx.fillStyle = lane.color;
      ctx.beginPath(); ctx.roundRect(x+5, ny-NOTE_H/2, LANE_W-10, NOTE_H, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
      ctx.fillText(lane.symbol, x+LANE_W/2, ny+6);
    });

    // Rating flashes
    ratingFlashes.forEach(f => {
      const a = f.life / f.maxLife;
      ctx.save(); ctx.globalAlpha = a;
      ctx.shadowColor = f.color; ctx.shadowBlur = 14; ctx.fillStyle = f.color;
      ctx.font = 'bold 19px monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.text, laneCX(f.lane), TARGET_Y - 30 - (1-a)*22);
      ctx.restore();
    });

    // HUD — hearts
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i < lives ? '#ff4444' : 'rgba(255,255,255,0.14)';
      ctx.font = '14px monospace'; ctx.textAlign = 'left';
      ctx.fillText('♥', 10 + i * 17, 22);
    }

    // Level tag
    ctx.fillStyle = lv.color; ctx.shadowColor = lv.color; ctx.shadowBlur = 6;
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`LV${currentLevel+1} ${lv.name}  ${lv.bpm}BPM`, 10, 40);
    ctx.shadowBlur = 0;

    // Score
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 5; ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText(String(score).padStart(7,'0'), W/2, 22); ctx.shadowBlur = 0;

    // Combo
    if (combo >= 2) {
      ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 8; ctx.fillStyle = '#ffff00';
      ctx.font = 'bold 15px monospace'; ctx.textAlign = 'right';
      ctx.fillText(`${combo}× COMBO`, W-10, 22); ctx.shadowBlur = 0;
    }

    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
    ctx.fillText('ESC = level select', W-10, 40);

    // Game over overlay
    if (gameState === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.76)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 28;
      ctx.fillStyle = '#ff5555'; ctx.font = 'bold 52px monospace';
      ctx.fillText('GAME OVER', W/2, 130); ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
      ctx.fillText(`Score: ${score}`, W/2, 186);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '16px monospace';
      ctx.fillText(`Best Combo: ${bestCombo}×`, W/2, 216);
      ctx.shadowColor = lv.color; ctx.shadowBlur = 10; ctx.fillStyle = lv.color;
      ctx.font = '16px monospace';
      ctx.fillText('SPACE — try again   ESC — level select', W/2, 270); ctx.shadowBlur = 0;
    }
    ctx.textAlign = 'left';
  }

  // ── Main loop ─────────────────────────────────────────────────────
  function gameLoop() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let xNow = false;
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) xNow = true; break; }
    if (xNow && !gpXWasPressed && gameState === 'gameover') {
      gpXWasPressed = false;
      if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
      activeNotes = []; ratingFlashes = []; keysHeld = {};
      hoveredLevel = -1; gameState = 'select'; canvas.style.cursor = 'default';
    } else {
      gpXWasPressed = xNow;
    }
    update();
    if (gameState === 'select') drawSelect();
    else drawGame();
    animId = requestAnimationFrame(gameLoop);
  }

  // ── Level-select card bounds (for hover/click) ────────────────────
  function cardBounds(i) {
    const CW=130, GAP=10, totalW=5*CW+4*GAP;
    const sx = (W - totalW) / 2;
    return { x: sx + i*(CW+GAP), y: 90, w: CW, h: 188 };
  }

  // ── Input ─────────────────────────────────────────────────────────
  function onMouseMove(e) {
    if (!running) return;
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top)  * (H / r.height);
    if (gameState === 'select') {
      hoveredLevel = -1;
      LEVELS.forEach((_, i) => {
        const b = cardBounds(i);
        if (mx >= b.x && mx <= b.x+b.w && my >= b.y-10 && my <= b.y+b.h) hoveredLevel = i;
      });
      canvas.style.cursor = hoveredLevel >= 0 ? 'pointer' : 'default';
    }
  }

  function handlePointerDown(mx, my, isTouch) {
    if (!running) return;
    if (gameState === 'gameover') { startLevel(currentLevel); return; }
    if (gameState === 'select') {
      LEVELS.forEach((_, i) => {
        const b = cardBounds(i);
        if (mx >= b.x && mx <= b.x+b.w && my >= b.y-10 && my <= b.y+b.h) startLevel(i);
      });
      return;
    }
    if (gameState === 'playing') {
      const i = laneFromX(mx);
      if (i >= 0) { laneClickHeld[i] = true; tryHit(i); }
    }
  }

  function onCanvasMouseDown(e) {
    if (!running) return;
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top)  * (H / r.height);
    handlePointerDown(mx, my, false);
  }

  function onCanvasMouseUp() {
    if (!running) return;
    laneClickHeld = [false, false, false, false];
  }

  function onTouchStart(e) {
    if (!running) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    for (const t of e.changedTouches) {
      const mx = (t.clientX - r.left) * (W / r.width);
      const my = (t.clientY - r.top)  * (H / r.height);
      handlePointerDown(mx, my, true);
    }
  }

  function onTouchEnd(e) {
    if (!running) return;
    e.preventDefault();
    laneClickHeld = [false, false, false, false];
  }

  function onKeyDown(e) {
    if (!running) return;
    if (e.code === 'Escape') {
      if (gameState === 'playing' || gameState === 'gameover') {
        if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
        activeNotes = []; ratingFlashes = []; keysHeld = {};
        hoveredLevel = -1; gameState = 'select';
        canvas.style.cursor = 'default';
      } else {
        cleanup(); showMenu();
      }
      return;
    }
    if (gameState === 'select') {
      const n = parseInt(e.key);
      if (n >= 1 && n <= 5) startLevel(n - 1);
      return;
    }
    if (gameState === 'gameover' && e.code === 'Space') { startLevel(currentLevel); return; }
    if (gameState === 'playing') {
      keysHeld[e.code] = true;
      const li = LANES.findIndex(l => l.key === e.code);
      if (li >= 0) tryHit(li);
    }
  }

  function onKeyUp(e) { delete keysHeld[e.code]; }

  // ── Cleanup ───────────────────────────────────────────────────────
  function cleanup() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (audioCtx) { try { audioCtx.close(); } catch(_){} audioCtx = null; }
    document.removeEventListener('keydown',   onKeyDown);
    document.removeEventListener('keyup',     onKeyUp);
    canvas.removeEventListener('mousemove',   onMouseMove);
    canvas.removeEventListener('mousedown',   onCanvasMouseDown);
    canvas.removeEventListener('mouseup',     onCanvasMouseUp);
    canvas.removeEventListener('touchstart',  onTouchStart);
    canvas.removeEventListener('touchend',    onTouchEnd);
    canvas.style.cursor = 'default';
    keysHeld = {};
    laneClickHeld = [false, false, false, false];
  }

  // ── Public start ──────────────────────────────────────────────────
  function start() {
    cleanup();
    running       = true;
    gameState     = 'select';
    hoveredLevel  = -1;
    keysHeld      = {};
    laneClickHeld = [false, false, false, false];
    activeNotes   = [];
    ratingFlashes = [];
    hideTouchControls();
    document.addEventListener('keydown',  onKeyDown);
    document.addEventListener('keyup',    onKeyUp);
    canvas.addEventListener('mousemove',  onMouseMove);
    canvas.addEventListener('mousedown',  onCanvasMouseDown);
    canvas.addEventListener('mouseup',    onCanvasMouseUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
    gameLoop();
  }

  return { start };
})();

</script>
  <script>
// ===== rocket.js =====
// Boost Ball — Sideswipe-style car soccer for 1 or 2 players
// Side view. Cars drive, rotate in the air, jump, double-jump/flip and boost.
// 3 minute match, first to 10 goals wins, tied = overtime (next goal wins).
const RocketLeague = (() => {
  const W = 800, H = 400, TAU = Math.PI * 2;

  // ── Arena ──────────────────────────────────────────────────────────────────
  const CEIL = 56, FLOOR = 360, WALL_L = 40, WALL_R = 760, GOAL_TOP = 250;
  const BALL_R = 14, CAR_W = 46, CAR_H = 20;

  // ── Rules ──────────────────────────────────────────────────────────────────
  const MATCH_FRAMES = 180 * 60;
  const WIN_SCORE = 10;

  // ── Physics (units are pixels per frame @ 60fps; each frame is 3 sub-steps) ─
  const SUB = 3, HS = 1 / SUB;
  const CAR_GRAV = 0.45, BALL_GRAV = 0.2;
  const JUMP_V = 9.6, DODGE_V = 8, FLIP_FRAMES = 21, FLIP_SPIN = 0.3;
  const AIR_ACC = 0.022, AIR_MAX = 0.14, FAST_FALL = 0.55;
  const GROUND_ACC = 0.45, GROUND_MAX = 6.2, GROUND_FRIC = 0.93;
  const BOOST_ACC = 0.55, BOOST_USE = 0.7, BOOST_REGEN = 0.6;
  const BOOST_GROUND_MAX = 12, MAX_CAR_V = 13;
  const MAX_BALL_V = 15;
  const E_FLOOR = 0.7, E_WALL = 0.8, E_CEIL = 0.6, E_CAR = 0.45;

  const C1 = '#33aaff', C2 = '#ff8a1f';
  const DIFF = {
    easy:   { react: 12, err: 70, lead: 4,  boost: false, flips: false, speed: 0.72 },
    medium: { react: 6,  err: 30, lead: 8,  boost: true,  flips: true,  speed: 0.88 },
    hard:   { react: 2,  err: 10, lead: 12, boost: true,  flips: true,  speed: 1.0  },
  };
  const DIFF_KEYS = ['easy', 'medium', 'hard'];

  const CORNERS = [[-CAR_W / 2, -CAR_H / 2], [CAR_W / 2, -CAR_H / 2], [CAR_W / 2, CAR_H / 2], [-CAR_W / 2, CAR_H / 2]];

  // ── State ──────────────────────────────────────────────────────────────────
  let running = false, animId = null, lastTs = 0, acc = 0, frameN = 0;
  let screen = 'mode';            // 'mode' | 'diff' | 'match'
  let phase = 'countdown';        // 'countdown' | 'play' | 'goal' | 'over'
  let sel = 0, numPlayers = 1, diff = 'medium';
  let cars = [], ball = null, particles = [];
  let scores = [0, 0], timeLeft = MATCH_FRAMES, overtime = false, otFrames = 0;
  let cdFrames = 0, goalFrames = 0, goFlash = 0, lastScorer = 0, winner = -1, shake = 0, soundCd = 0;
  let paused = false, hover = -1;
  let gpXWas = false;
  const keys = {};

  const BLOCK = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'ShiftLeft', 'ShiftRight']);

  // ── Helpers ────────────────────────────────────────────────────────────────
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrapAngle = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
  const rrect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };

  // ── Sound (quiet little synth blips) ───────────────────────────────────────
  let actx = null;
  function audio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
    return actx;
  }
  function tone(freq, dur, type = 'square', vol = 0.035, endFreq = null) {
    const a = audio(); if (!a) return;
    try {
      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  function melody(notes, gap, type, vol) {
    notes.forEach((f, i) => setTimeout(() => { if (running) tone(f, 0.16, type, vol); }, i * gap));
  }

  // ── Match setup ────────────────────────────────────────────────────────────
  function makeCar(team) {
    return {
      team, x: team === 0 ? 190 : 610, y: FLOOR - CAR_H / 2,
      vx: 0, vy: 0, ang: 0, av: 0, facing: team === 0 ? 1 : -1,
      onGround: true, jumps: 0, flipT: 0, boost: 100, boosting: false, jumpPrev: false,
      color: team === 0 ? C1 : C2,
      in: { left: false, right: false, jump: false, fall: false, boost: false },
      ai: (team === 1 && numPlayers === 1) ? { err: 0, errT: 0, jumpCd: 0, last: null } : null,
    };
  }

  function resetKickoff(frames) {
    cars = [makeCar(0), makeCar(1)];
    ball = { x: W / 2, y: 190, vx: 0, vy: 0, rot: 0, trail: [] };
    phase = 'countdown';
    cdFrames = frames;
    goFlash = 0;
    particles = [];
  }

  function startMatch() {
    screen = 'match';
    scores = [0, 0];
    timeLeft = MATCH_FRAMES;
    overtime = false; otFrames = 0;
    winner = -1; paused = false; shake = 0;
    resetKickoff(180);
  }

  function endMatch(w) {
    winner = w;
    phase = 'over';
    melody([523, 659, 784, 1047], 120, 'triangle', 0.04);
  }

  function scoreGoal(team) {
    scores[team]++;
    lastScorer = team;
    phase = 'goal';
    goalFrames = 140;
    shake = 16;
    if (scores[team] >= WIN_SCORE || overtime) winner = team;
    const col = team === 0 ? C1 : C2;
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * TAU, s = 1 + Math.random() * 6;
      particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 50 + Math.random() * 40, max: 90,
        color: Math.random() < 0.5 ? col : '#ffffff', size: 2 + Math.random() * 3, grav: 0.1 });
    }
    melody([392, 523, 659, 784, 1047], 90, 'square', 0.04);
  }

  // ── Input ──────────────────────────────────────────────────────────────────
  function humanInput(c) {
    const k = keys, solo = numPlayers === 1;
    if (c.team === 0) {
      return {
        left: !!(k.KeyA || (solo && k.ArrowLeft)),
        right: !!(k.KeyD || (solo && k.ArrowRight)),
        jump: !!(k.KeyW || (solo && (k.ArrowUp || k.Space))),
        fall: !!(k.KeyS || (solo && k.ArrowDown)),
        boost: !!(k.ShiftLeft || (solo && k.ShiftRight)),
      };
    }
    return { left: !!k.ArrowLeft, right: !!k.ArrowRight, jump: !!k.ArrowUp, fall: !!k.ArrowDown, boost: !!k.ShiftRight };
  }

  // Computer player ----------------------------------------------------------
  function aiInput(c) {
    const d = DIFF[diff], ai = c.ai;
    const inp = { left: false, right: false, jump: false, fall: false, boost: false };
    if (ai.jumpCd > 0) ai.jumpCd--;
    if (--ai.errT <= 0) { ai.errT = 25; ai.err = (Math.random() - 0.5) * 2 * d.err; }

    const atk = c.team === 1 ? -1 : 1;                 // direction of the goal this car attacks
    const px = clamp(ball.x + ball.vx * d.lead, WALL_L + 20, WALL_R - 20);
    const dx = ball.x - c.x, dy = ball.y - c.y, dist = Math.hypot(dx, dy);
    const behind = (c.x - ball.x) * atk <= -4;         // car really is on its own-goal side of the ball

    let tx;
    if (behind) {
      tx = Math.abs(c.x - ball.x) < 90 ? px + atk * 40 : px - atk * 50;  // line up, then drive through the ball
    } else {
      tx = c.team === 1 ? WALL_R - 90 : WALL_L + 90;                  // fall back toward own goal
    }
    tx += ai.err;

    if (c.onGround) {
      const ddx = tx - c.x;
      if (ddx > 10) inp.right = true; else if (ddx < -10) inp.left = true;
      if (d.boost && c.boost > 40 && Math.abs(ddx) > (behind ? 140 : 60) && ddx * c.facing > 0) inp.boost = true;
      if (ai.jumpCd <= 0) {
        if (behind && Math.abs(dx) < 80 && dy < -45) { inp.jump = true; ai.jumpCd = 45; }               // ball is up high
        else if (!behind && Math.abs(dx) < 70 + Math.abs(c.vx) * 5 && dy > -60) { inp.jump = true; ai.jumpCd = 45; }  // hop over the ball, never push it into our own goal
      }
    } else {
      const aim = behind && dist < 230;
      const target = aim ? (c.facing === 1 ? Math.atan2(dy, dx) : Math.atan2(dy, dx) - Math.PI) : 0;
      const diffA = wrapAngle(target - c.ang);
      if (diffA > 0.12) inp.right = true; else if (diffA < -0.12) inp.left = true;
      if (d.boost && aim && Math.abs(diffA) < 0.35 && c.boost > 25) inp.boost = true;
      if (d.flips && behind && c.jumps === 1 && dist < 95 && ai.jumpCd <= 0) {
        inp.jump = true; ai.jumpCd = 60;
        inp.left = atk < 0; inp.right = atk > 0;           // always flip toward the opponent's goal
      }
    }

    // Reaction time: only refresh steering every few frames
    if (ai.last && frameN % d.react !== 0) {
      inp.left = ai.last.left; inp.right = ai.last.right; inp.boost = ai.last.boost;
    } else {
      ai.last = { left: inp.left, right: inp.right, boost: inp.boost };
    }
    return inp;
  }

  // ── Car controls (once per frame) ──────────────────────────────────────────
  function control(c) {
    const i = c.in, sp = c.ai ? DIFF[diff].speed : 1;

    const jumpPressed = i.jump && !c.jumpPrev;
    c.jumpPrev = i.jump;
    if (jumpPressed) {
      if (c.onGround) {
        c.vy = -JUMP_V; c.onGround = false; c.jumps = 1;
        tone(420, 0.08, 'square', 0.025, 640);
      } else if (c.jumps < 2) {
        c.jumps = 2;
        const dir = (i.right && !i.left) ? 1 : (i.left && !i.right) ? -1 : 0;
        if (dir) {                                   // flip: dash sideways while spinning
          c.vx = c.vx * 0.35 + dir * DODGE_V;
          c.vy = Math.min(c.vy, 0) - 2.5;
          c.flipT = FLIP_FRAMES; c.av = dir * FLIP_SPIN;
          tone(300, 0.14, 'sawtooth', 0.025, 700);
        } else {                                     // plain double jump
          c.vy = -JUMP_V * 0.85;
          tone(520, 0.08, 'square', 0.025, 760);
        }
      }
    }

    // Spin
    if (c.flipT > 0) {
      c.flipT--;
      if (c.flipT === 0) c.av *= 0.15;
    } else if (!c.onGround) {
      if (i.left && !i.right) c.av -= AIR_ACC;
      else if (i.right && !i.left) c.av += AIR_ACC;
      else c.av *= 0.93;
      c.av = clamp(c.av, -AIR_MAX, AIR_MAX);
    } else {
      c.av = 0;
    }

    // Drive / fast fall
    if (c.onGround) {
      if (i.left && !i.right) { c.facing = -1; c.vx -= GROUND_ACC * sp; }
      else if (i.right && !i.left) { c.facing = 1; c.vx += GROUND_ACC * sp; }
      else c.vx *= GROUND_FRIC;
    } else if (i.fall) {
      c.vy += FAST_FALL;
    }

    // Boost (refills while on the ground and not boosting)
    if (i.boost && c.boost > 0) {
      c.boosting = true;
      c.boost = Math.max(0, c.boost - BOOST_USE);
      const nx = c.facing * Math.cos(c.ang), ny = c.facing * Math.sin(c.ang);
      c.vx += nx * BOOST_ACC; c.vy += ny * BOOST_ACC;
      for (let k = 0; k < 2; k++) {
        const a = Math.atan2(-ny, -nx) + (Math.random() - 0.5) * 0.7, s = 1.5 + Math.random() * 2;
        particles.push({ x: c.x - nx * CAR_W / 2, y: c.y - ny * CAR_W / 2, vx: Math.cos(a) * s + c.vx * 0.3, vy: Math.sin(a) * s + c.vy * 0.3,
          life: 12 + Math.random() * 10, max: 22, color: Math.random() < 0.5 ? '#ffb020' : '#fff2a0', size: 2 + Math.random() * 2.5, grav: 0 });
      }
    } else {
      c.boosting = false;
      if (c.onGround) c.boost = Math.min(100, c.boost + BOOST_REGEN);
    }

    // Speed limits
    const maxG = (c.boosting ? BOOST_GROUND_MAX : GROUND_MAX) * sp;
    if (c.onGround && Math.abs(c.vx) > maxG) c.vx -= Math.sign(c.vx) * Math.min(Math.abs(c.vx) - maxG, 0.35);
    const v = Math.hypot(c.vx, c.vy);
    if (v > MAX_CAR_V) { c.vx *= MAX_CAR_V / v; c.vy *= MAX_CAR_V / v; }
  }

  // ── Collisions ─────────────────────────────────────────────────────────────
  function resolveCarArena(c) {
    const cs = Math.cos(c.ang), sn = Math.sin(c.ang);
    let up = 0, down = 0, left = 0, right = 0, floorHit = false;
    for (const [lx, ly] of CORNERS) {
      const px = c.x + lx * cs - ly * sn, py = c.y + lx * sn + ly * cs;
      if (py > FLOOR) { up = Math.max(up, py - FLOOR); floorHit = true; }
      if (py < CEIL) down = Math.max(down, CEIL - py);
      if (px < WALL_L) {
        if (py < GOAL_TOP) {
          const dx = WALL_L - px, dy = GOAL_TOP - py;
          if (dx <= dy) right = Math.max(right, dx); else down = Math.max(down, dy);
        } else if (px < 0) right = Math.max(right, -px);
      }
      if (px > WALL_R) {
        if (py < GOAL_TOP) {
          const dx = px - WALL_R, dy = GOAL_TOP - py;
          if (dx <= dy) left = Math.max(left, dx); else down = Math.max(down, dy);
        } else if (px > W) left = Math.max(left, px - W);
      }
    }
    c.x += right - left;
    c.y += down - up;
    if (right > 0 && c.vx < 0) c.vx = 0;
    if (left > 0 && c.vx > 0) c.vx = 0;
    if (up > 0 && c.vy > 0) c.vy = 0;
    if (down > 0 && c.vy < 0) c.vy = 0;
    if (floorHit) c.onGround = true;
  }

  function ballArena() {
    const b = ball, r = BALL_R;
    if (b.y + r > FLOOR) {
      b.y = FLOOR - r;
      if (b.vy > 0) b.vy = b.vy > 1.6 ? -b.vy * E_FLOOR : 0;
      b.vx *= Math.pow(0.992, HS);
    }
    if (b.y - r < CEIL) { b.y = CEIL + r; if (b.vy < 0) b.vy = -b.vy * E_CEIL; }

    for (const dir of [1, -1]) {                      // 1 = left wall, -1 = right wall
      const wx = dir === 1 ? WALL_L : WALL_R;
      const inward = (b.x - wx) * dir;
      if (b.y < GOAL_TOP) {
        if (inward < r) { b.x = wx + dir * r; if (b.vx * dir < 0) b.vx = -b.vx * E_WALL; }
      } else if (inward < 0) {                         // inside the goal pocket: roof above it
        if (b.y - r < GOAL_TOP) { b.y = GOAL_TOP + r; if (b.vy < 0) b.vy = -b.vy * 0.4; }
      } else if (inward < r) {                         // goal post corner
        const dx = b.x - wx, dy = b.y - GOAL_TOP, d = Math.hypot(dx, dy);
        if (d < r && d > 0) {
          const nx = dx / d, ny = dy / d;
          b.x = wx + nx * r; b.y = GOAL_TOP + ny * r;
          const vn = b.vx * nx + b.vy * ny;
          if (vn < 0) { b.vx -= 1.7 * vn * nx; b.vy -= 1.7 * vn * ny; }
        }
      }
    }
    // back of the nets
    if (b.x - r < 0) { b.x = r; if (b.vx < 0) b.vx = -b.vx * 0.4; }
    if (b.x + r > W) { b.x = W - r; if (b.vx > 0) b.vx = -b.vx * 0.4; }
  }

  function carBall(c) {
    const b = ball, cs = Math.cos(c.ang), sn = Math.sin(c.ang);
    const dx = b.x - c.x, dy = b.y - c.y;
    const lx = dx * cs + dy * sn, ly = -dx * sn + dy * cs;       // ball in the car's own frame
    const hw = CAR_W / 2, hh = CAR_H / 2;
    let cx = clamp(lx, -hw, hw), cy = clamp(ly, -hh, hh);
    let nx = lx - cx, ny = ly - cy, dist = Math.hypot(nx, ny);
    if (dist >= BALL_R) return;
    if (dist < 0.0001) {                                          // centre is inside the car: push out the short way
      const px = hw - Math.abs(lx), py = hh - Math.abs(ly);
      if (px < py) { nx = Math.sign(lx) || 1; ny = 0; cx = nx * hw; cy = ly; }
      else { nx = 0; ny = Math.sign(ly) || -1; cx = lx; cy = ny * hh; }
      dist = 0;
    } else { nx /= dist; ny /= dist; }
    const wnx = nx * cs - ny * sn, wny = nx * sn + ny * cs;       // normal in world coords
    const rx = cx * cs - cy * sn, ry = cx * sn + cy * cs;         // contact offset from the car centre
    const cvx = c.vx - c.av * ry, cvy = c.vy + c.av * rx;         // car speed at the contact point (includes spin)
    const pen = BALL_R - dist;
    b.x += wnx * pen; b.y += wny * pen;
    const vn = (b.vx - cvx) * wnx + (b.vy - cvy) * wny;
    if (vn < 0) {
      const j = -(1 + E_CAR) * vn;
      const kick = 1 + (c.flipT > 0 ? 3.5 : 0) + (c.boosting ? 1 : 0);
      b.vx += wnx * (j + kick); b.vy += wny * (j + kick);
      c.vx -= wnx * j * 0.06; c.vy -= wny * j * 0.06;
      if (j > 3.5 && soundCd <= 0) {
        soundCd = 6;
        tone(150 + Math.random() * 60, 0.07, 'triangle', Math.min(0.09, 0.015 + j * 0.006), 70);
        for (let k = 0; k < 6; k++) {
          const a = Math.random() * TAU, s = 1 + Math.random() * 3;
          particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 12, max: 12, color: '#ffffff', size: 2, grav: 0 });
        }
      }
    }
    const v = Math.hypot(b.vx, b.vy);
    if (v > MAX_BALL_V) { b.vx *= MAX_BALL_V / v; b.vy *= MAX_BALL_V / v; }
  }

  function carCar() {
    const a = cars[0], b = cars[1];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), R = 21;
    if (d >= R * 2 || d === 0) return;
    const nx = dx / d, ny = dy / d, pen = R * 2 - d;
    a.x -= nx * pen / 2; a.y -= ny * pen / 2;
    b.x += nx * pen / 2; b.y += ny * pen / 2;
    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (vn < 0) {
      const j = -(1 + 0.4) * vn / 2;
      a.vx -= nx * j; a.vy -= ny * j;
      b.vx += nx * j; b.vy += ny * j;
    }
  }

  // ── Physics step ───────────────────────────────────────────────────────────
  function substep() {
    for (const c of cars) {
      c.onGround = false;
      c.vy += CAR_GRAV * HS;
      c.x += c.vx * HS; c.y += c.vy * HS; c.ang += c.av * HS;
      resolveCarArena(c);
    }
    ball.vy += BALL_GRAV * HS;
    ball.vx *= Math.pow(0.9985, HS);
    ball.x += ball.vx * HS; ball.y += ball.vy * HS;
    ball.rot += (ball.vx / BALL_R) * HS;
    ballArena();
    for (const c of cars) carBall(c);
    carCar();
    for (const c of cars) resolveCarArena(c);
  }

  function physics() {
    if (soundCd > 0) soundCd--;
    for (const c of cars) { c.in = c.ai ? aiInput(c) : humanInput(c); control(c); }
    for (let s = 0; s < SUB; s++) substep();
    for (const c of cars) {
      c.ang = wrapAngle(c.ang);
      if (c.onGround) {                               // land, then roll back onto the wheels
        c.jumps = 0; c.flipT = 0; c.av = 0;
        c.ang *= 0.72; if (Math.abs(c.ang) < 0.002) c.ang = 0;
      } else if (c.jumps === 0) c.jumps = 1;
    }
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 7) { ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 9) ball.trail.shift(); }
    else if (ball.trail.length) ball.trail.shift();
  }

  function updateParticles() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }

  function pollGamepadX() {
    let now = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) now = true; break; }
    const fired = now && !gpXWas;
    gpXWas = now;
    return fired;
  }

  // ── Update ─────────────────────────────────────────────────────────────────
  function update() {
    frameN++;
    const gpX = pollGamepadX();
    if (screen !== 'match') return;
    if (shake > 0) shake = Math.max(0, shake - 0.6);
    if (goFlash > 0) goFlash--;
    if (paused) return;

    if (phase === 'over') {
      updateParticles();
      if (gpX) { stop(); showMenu(); }
      return;
    }
    if (phase === 'countdown') {
      cdFrames--;
      if (cdFrames > 0 && cdFrames % 60 === 0) tone(440, 0.12, 'square', 0.03);
      if (cdFrames <= 0) { phase = 'play'; goFlash = 45; tone(880, 0.3, 'square', 0.04); }
      updateParticles();
      return;
    }

    if (phase === 'goal') {
      goalFrames--;
      if (frameN % 2 === 0) physics();               // slow motion
      updateParticles();
      if (goalFrames <= 0) {
        if (winner >= 0) endMatch(winner); else resetKickoff(120);
      }
      return;
    }

    // phase === 'play'
    physics();
    updateParticles();
    if (!overtime) {
      timeLeft--;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (scores[0] === scores[1]) { overtime = true; melody([330, 330, 440], 140, 'square', 0.04); }
        else { endMatch(scores[0] > scores[1] ? 0 : 1); return; }
      }
    } else otFrames++;

    if (ball.y > GOAL_TOP && ball.x + BALL_R < WALL_L) scoreGoal(1);
    else if (ball.y > GOAL_TOP && ball.x - BALL_R > WALL_R) scoreGoal(0);
  }

  // ── Drawing ────────────────────────────────────────────────────────────────
  const STARS = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, t: Math.random() * TAU }));

  function drawCarShape(color, boosting, big) {
    // Drawn pointing right, wheels down, centred on (0,0). Collision box is 46x20.
    ctx.shadowColor = color; ctx.shadowBlur = big ? 14 : 10;
    ctx.fillStyle = color;
    rrect(-23, -2, 46, 9, 3); ctx.fill();                               // lower body
    ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-8, -10); ctx.lineTo(9, -10); ctx.lineTo(16, -2); ctx.closePath(); ctx.fill();   // cabin
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(210,240,255,0.85)';
    ctx.beginPath(); ctx.moveTo(-8, -3.5); ctx.lineTo(-4, -8.5); ctx.lineTo(7, -8.5); ctx.lineTo(11, -3.5); ctx.closePath(); ctx.fill();  // window
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(-23, 3, 46, 2);   // stripe
    ctx.fillStyle = '#fff6a8'; ctx.fillRect(20, 0, 3, 3);               // headlight
    ctx.fillStyle = '#ff4466'; ctx.fillRect(-23, 0, 2, 3);              // tail light
    ctx.fillStyle = '#111';
    for (const wx of [-13, 13]) { ctx.beginPath(); ctx.arc(wx, 6, 4, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#bbb';
    for (const wx of [-13, 13]) { ctx.beginPath(); ctx.arc(wx, 6, 1.5, 0, TAU); ctx.fill(); }
    if (boosting) {
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffb020';
      const f = 10 + Math.random() * 8;
      ctx.beginPath(); ctx.moveTo(-23, -1); ctx.lineTo(-23 - f, 2); ctx.lineTo(-23, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff2a0';
      ctx.beginPath(); ctx.moveTo(-23, 0); ctx.lineTo(-23 - f * 0.55, 2); ctx.lineTo(-23, 4); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawCar(c) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.ang); ctx.scale(c.facing, 1);
    drawCarShape(c.color, c.boosting, false);
    ctx.restore();
  }

  function drawBall() {
    ball.trail.forEach((t, i) => {
      ctx.fillStyle = `rgba(255,255,255,${(i / ball.trail.length) * 0.18})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * (0.5 + i / ball.trail.length * 0.5), 0, TAU); ctx.fill();
    });
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#f4f4ff';
    ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.rotate(ball.rot);
    ctx.fillStyle = '#333';
    for (let k = 0; k < 5; k++) {
      const a = k * TAU / 5;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 8, Math.sin(a) * 8, 2.8, 0, TAU); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawArena() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#06001a'); g.addColorStop(1, '#14004a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => {
      ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.15 * Math.sin(frameN * 0.03 + s.t)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    });

    // grid
    ctx.strokeStyle = 'rgba(130,110,255,0.07)'; ctx.lineWidth = 1;
    for (let x = WALL_L; x <= WALL_R; x += 40) { ctx.beginPath(); ctx.moveTo(x, CEIL); ctx.lineTo(x, FLOOR); ctx.stroke(); }
    for (let y = FLOOR; y >= CEIL; y -= 40) { ctx.beginPath(); ctx.moveTo(WALL_L, y); ctx.lineTo(WALL_R, y); ctx.stroke(); }

    // centre line + circle
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(W / 2, CEIL); ctx.lineTo(W / 2, FLOOR); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(W / 2, FLOOR, 70, Math.PI, TAU); ctx.stroke();

    // goals
    for (const side of [0, 1]) {
      const x0 = side === 0 ? 0 : WALL_R, col = side === 0 ? '51,170,255' : '255,138,31';
      ctx.fillStyle = `rgba(${col},0.16)`; ctx.fillRect(x0, GOAL_TOP, WALL_L, FLOOR - GOAL_TOP);
      ctx.strokeStyle = `rgba(${col},0.35)`; ctx.lineWidth = 1;
      for (let y = GOAL_TOP; y <= FLOOR; y += 12) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + WALL_L, y); ctx.stroke(); }
      for (let x = x0; x <= x0 + WALL_L; x += 10) { ctx.beginPath(); ctx.moveTo(x, GOAL_TOP); ctx.lineTo(x, FLOOR); ctx.stroke(); }
    }

    // below the floor
    ctx.fillStyle = '#0a0524'; ctx.fillRect(0, FLOOR, W, H - FLOOR);

    // outline
    ctx.strokeStyle = '#8fa8ff'; ctx.lineWidth = 3; ctx.shadowColor = '#6a7dff'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, FLOOR); ctx.lineTo(0, GOAL_TOP); ctx.lineTo(WALL_L, GOAL_TOP); ctx.lineTo(WALL_L, CEIL);
    ctx.lineTo(WALL_R, CEIL); ctx.lineTo(WALL_R, GOAL_TOP); ctx.lineTo(W, GOAL_TOP); ctx.lineTo(W, FLOOR);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();
    ctx.shadowBlur = 0;
    // goal posts glow in team colours
    ctx.lineWidth = 4;
    ctx.strokeStyle = C1; ctx.shadowColor = C1; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(0, GOAL_TOP); ctx.lineTo(WALL_L, GOAL_TOP); ctx.stroke();
    ctx.strokeStyle = C2; ctx.shadowColor = C2;
    ctx.beginPath(); ctx.moveTo(WALL_R, GOAL_TOP); ctx.lineTo(W, GOAL_TOP); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function fmtTime(frames) {
    const s = Math.ceil(frames / 60);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function drawBoostBar(x, align, c) {
    const w = 180, bx = align === 'left' ? x : x - w;
    ctx.textAlign = align; ctx.font = 'bold 10px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BOOST', x, 372);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; rrect(bx, 377, w, 10, 5); ctx.fill();
    const frac = c.boost / 100;
    if (frac > 0.01) {
      ctx.fillStyle = frac < 0.25 ? '#ff4455' : c.color;
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = c.boosting ? 12 : 4;
      rrect(bx, 377, Math.max(10, w * frac), 10, 5); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawHUD() {
    // scores
    ctx.textAlign = 'left'; ctx.font = 'bold 12px monospace'; ctx.fillStyle = C1;
    ctx.fillText(numPlayers === 1 ? 'YOU' : 'PLAYER 1', 20, 16);
    ctx.font = 'bold 34px monospace'; ctx.shadowColor = C1; ctx.shadowBlur = 10;
    ctx.fillText(scores[0], 20, 47);
    ctx.textAlign = 'right'; ctx.font = 'bold 12px monospace'; ctx.fillStyle = C2; ctx.shadowBlur = 0;
    ctx.fillText(numPlayers === 1 ? 'CPU' : 'PLAYER 2', W - 20, 16);
    ctx.font = 'bold 34px monospace'; ctx.shadowColor = C2; ctx.shadowBlur = 10;
    ctx.fillText(scores[1], W - 20, 47);
    ctx.shadowBlur = 0;

    // timer
    ctx.textAlign = 'center';
    if (overtime) {
      ctx.fillStyle = Math.floor(frameN / 20) % 2 ? '#ff4455' : '#ff9aa5';
      ctx.font = 'bold 22px monospace'; ctx.fillText('OVERTIME', W / 2, 30);
      ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('NEXT GOAL WINS  ' + fmtTime(otFrames + 59), W / 2, 48);
    } else {
      ctx.fillStyle = timeLeft < 600 ? '#ff6677' : '#ffffff';
      ctx.font = 'bold 28px monospace'; ctx.fillText(fmtTime(timeLeft), W / 2, 34);
      ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('FIRST TO ' + WIN_SCORE, W / 2, 49);
    }

    if (cars.length) { drawBoostBar(20, 'left', cars[0]); drawBoostBar(W - 20, 'right', cars[1]); }
    ctx.textAlign = 'center'; ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(numPlayers === 1 ? 'WASD or ARROWS  ·  SHIFT = boost  ·  ESC = menu' : 'P1: A D W S L-SHIFT   |   P2: ← → ↑ ↓ R-SHIFT', W / 2, 385);
  }

  function bigText(text, y, size, color, glow) {
    ctx.textAlign = 'center'; ctx.font = `bold ${size}px monospace`;
    ctx.fillStyle = color; ctx.shadowColor = glow || color; ctx.shadowBlur = 24;
    ctx.fillText(text, W / 2, y); ctx.shadowBlur = 0;
  }

  function drawOverlays() {
    if (phase === 'countdown' && cdFrames > 0) {
      const n = Math.ceil(cdFrames / 60), t = (cdFrames % 60) / 60;
      ctx.save(); ctx.globalAlpha = 0.4 + 0.6 * t;
      bigText(String(n), 250, 90 + (1 - t) * -10 + t * 20, '#ffffff', '#6a7dff');
      ctx.restore();
    }
    if (goFlash > 0) { ctx.save(); ctx.globalAlpha = goFlash / 45; bigText('GO!', 235, 80, '#66ff99'); ctx.restore(); }
    if (phase === 'goal') {
      const col = lastScorer === 0 ? C1 : C2;
      bigText('GOAL!', 190, 76, col);
      ctx.textAlign = 'center'; ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#fff';
      const who = numPlayers === 1 ? (lastScorer === 0 ? 'YOU SCORE!' : 'CPU SCORES') : 'PLAYER ' + (lastScorer + 1) + ' SCORES!';
      ctx.fillText(who, W / 2, 222);
    }
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      bigText('PAUSED', 190, 54, '#ffffff', '#6a7dff');
      ctx.font = '14px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('P = resume    ESC = back to menu', W / 2, 225);
    }
    if (phase === 'over') {
      ctx.fillStyle = 'rgba(3,0,16,0.78)'; ctx.fillRect(0, 0, W, H);
      const col = winner === 0 ? C1 : C2;
      ctx.textAlign = 'center'; ctx.font = '14px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('FULL TIME', W / 2, 100);
      const txt = numPlayers === 1 ? (winner === 0 ? 'YOU WIN!' : 'CPU WINS') : 'PLAYER ' + (winner + 1) + ' WINS!';
      bigText(txt, 170, 56, col);
      ctx.font = 'bold 44px monospace'; ctx.fillStyle = '#fff';
      ctx.fillText(scores[0] + '  -  ' + scores[1], W / 2, 235);
      ctx.font = '15px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText('ENTER = play again      ESC = menu', W / 2, 300);
    }
  }

  function drawMatch() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawArena();
    cars.forEach(drawCar);
    drawBall();
    drawParticles();
    ctx.restore();
    drawHUD();
    drawOverlays();
  }

  // ── Start / difficulty screens ─────────────────────────────────────────────
  function buttons() {
    if (screen === 'mode') return [{ x: 90, y: 120, w: 290, h: 130 }, { x: 420, y: 120, w: 290, h: 130 }];
    return [0, 1, 2].map(i => ({ x: 50 + i * 240, y: 130, w: 220, h: 110 }));
  }

  function drawMenuScreens() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#030010'); g.addColorStop(1, '#0f0036');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => {
      ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.2 * Math.sin(frameN * 0.04 + s.t)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    });

    ctx.textAlign = 'center';
    ctx.shadowColor = C1; ctx.shadowBlur = 20 + Math.sin(frameN * 0.06) * 8;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px monospace';
    ctx.fillText('BOOST BALL', W / 2, 62);
    ctx.shadowBlur = 0;
    ctx.font = '13px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(screen === 'mode' ? 'Car soccer  ·  3 minutes  ·  first to 10 goals wins' : 'CHOOSE THE CPU DIFFICULTY', W / 2, 88);

    const bs = buttons();
    if (screen === 'mode') {
      const data = [

        { t: '2 PLAYERS', s: 'same keyboard', col: C2, n: 2 },

        ctx.fillStyle = on ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
        rrect(b.x, b.y - (on ? 6 : 0), b.w, b.h, 14); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
        const cy = b.y - (on ? 6 : 0);
        ctx.save(); ctx.translate(b.x + b.w / 2 - (d.n === 2 ? 38 : 0), cy + 38); ctx.scale(1.2, 1.2); drawCarShape(C1, false, true); ctx.restore();
        if (d.n === 2) { ctx.save(); ctx.translate(b.x + b.w / 2 + 38, cy + 38); ctx.scale(-1.2, 1.2); drawCarShape(C2, false, true); ctx.restore(); }
        else { ctx.save(); ctx.translate(b.x + b.w / 2 + 70, cy + 38); ctx.scale(-0.9, 0.9); ctx.globalAlpha = 0.45; drawCarShape('#aaaaaa', false, false); ctx.restore(); }
        ctx.textAlign = 'center';
        ctx.fillStyle = d.col; ctx.font = 'bold 24px monospace'; ctx.fillText(d.t, b.x + b.w / 2, cy + 88);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '12px monospace'; ctx.fillText(d.s, b.x + b.w / 2, cy + 108);
      });
      ctx.font = '12px monospace'; ctx.textAlign = 'center';
      const lines = [
        ['P1:  A / D move + rotate  ·  W jump (press again = flip)  ·  S fast fall  ·  L-SHIFT boost', C1],
        ['P2:  ← / → move + rotate  ·  ↑ jump (press again = flip)  ·  ↓ fast fall  ·  R-SHIFT boost', C2],
      ];
      lines.forEach((l, i) => { ctx.fillStyle = l[1]; ctx.fillText(l[0], W / 2, 295 + i * 20); });
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('Boost refills while you are on the ground.   Pick with A/D or ←/→ + ENTER, or click.   ESC = menu', W / 2, 350);
    } else {
      const data = [
        { t: 'EASY', s: 'slow & forgiving', col: '#66ff99' },
        { t: 'MEDIUM', s: 'a fair fight', col: '#ffd24a' },
        { t: 'HARD', s: 'fast, boosts & flips', col: '#ff5566' },
      ];
      data.forEach((d, i) => {
        const b = bs[i], on = sel === i, by = b.y - (on ? 6 : 0);
        ctx.shadowColor = d.col; ctx.shadowBlur = on ? 28 : 8;
        ctx.strokeStyle = d.col; ctx.lineWidth = on ? 3 : 1.5;
        ctx.fillStyle = on ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
        rrect(b.x, by, b.w, b.h, 14); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.fillStyle = d.col; ctx.font = 'bold 28px monospace'; ctx.fillText(d.t, b.x + b.w / 2, by + 56);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '12px monospace'; ctx.fillText(d.s, b.x + b.w / 2, by + 82);
      });
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText('Pick with A/D or ←/→ + ENTER, or click.   ESC = back', W / 2, 300);
    }
    ctx.textAlign = 'left';
  }

  function draw() {
    if (screen === 'match') drawMatch(); else drawMenuScreens();
  }

  // ── Loop ───────────────────────────────────────────────────────────────────
  function loop(ts) {
    if (!running) return;
    animId = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
    lastTs = ts; acc += dt;
    while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
    draw();
  }

  // ── Menu choosing ──────────────────────────────────────────────────────────
  function choose(i) {
    audio();
    if (screen === 'mode') {
      if (i === 0) { numPlayers = 1; screen = 'diff'; sel = 1; }
      else { numPlayers = 2; startMatch(); }
    } else if (screen === 'diff') {
      diff = DIFF_KEYS[i]; startMatch();
    }
  }

  function onKeyDown(e) {
    if (BLOCK.has(e.code)) e.preventDefault();
    const wasDown = keys[e.code];
    keys[e.code] = true;
    if (wasDown) return;
    const code = e.code;

    if (code === 'Escape') {
      if (screen === 'diff') { screen = 'mode'; sel = 0; return; }
      stop(); showMenu(); return;
    }
    if (screen !== 'match') {
      const n = screen === 'mode' ? 2 : 3;
      if (code === 'ArrowLeft' || code === 'KeyA') sel = (sel + n - 1) % n;
      else if (code === 'ArrowRight' || code === 'KeyD') sel = (sel + 1) % n;
      else if (code === 'Enter' || code === 'Space') choose(sel);
      else if (code === 'Digit1' || code === 'Numpad1') choose(0);
      else if (code === 'Digit2' || code === 'Numpad2') choose(1);
      else if ((code === 'Digit3' || code === 'Numpad3') && n === 3) choose(2);
      return;
    }
    if (code === 'KeyP' && (phase === 'play' || phase === 'goal' || phase === 'countdown')) { paused = !paused; return; }
    if (phase === 'over' && (code === 'Enter' || code === 'Space' || code === 'KeyR')) startMatch();
  }
  function onKeyUp(e) { keys[e.code] = false; }
  function onBlur() { Object.keys(keys).forEach(k => delete keys[k]); if (screen === 'match' && phase === 'play') paused = true; }

  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
  }
  function onMove(e) {
    if (screen === 'match') { canvas.style.cursor = 'default'; return; }
    const p = canvasPos(e);
    hover = buttons().findIndex(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y - 6 && p.y <= b.y + b.h);
    if (hover >= 0) sel = hover;
    canvas.style.cursor = hover >= 0 ? 'pointer' : 'default';
  }
  function onClick(e) {
    if (screen === 'match') { if (phase === 'over') startMatch(); return; }
    const p = canvasPos(e);
    const i = buttons().findIndex(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y - 6 && p.y <= b.y + b.h);
    if (i >= 0) choose(i);
  }

  // ── Cleanup / public API ───────────────────────────────────────────────────
  function stop() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup', onKeyUp);
    window.removeEventListener('blur', onBlur);
    canvas.removeEventListener('mousemove', onMove);
    canvas.removeEventListener('click', onClick);
    canvas.style.cursor = 'default';
    Object.keys(keys).forEach(k => delete keys[k]);
  }

  function start() {
    stop();
    running = true;
    hideTouchControls();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', onBlur);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('click', onClick);
    screen = 'mode'; sel = 0; paused = false; frameN = 0; acc = 0;
    cars = []; ball = null; particles = [];
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    gpXWas = false;
    for (const gp of pads) { if (!gp) continue; if (gp.buttons[0]?.pressed) gpXWas = true; break; }
    lastTs = performance.now();
    animId = requestAnimationFrame(loop);
  }

  return { start, stop };
})();

  <script>
// ===== snake.js =====
// Snake — neon arcade snake with smooth movement
// Arrow keys / WASD (or swipe, or D-pad) to steer. Eat apples to grow.
// Options on the start screen: speed (1/2/3) and walls on/off (B).
const SnakeGame = (() => {
  const W = 800, H = 400, TAU = Math.PI * 2;
  const CELL = 24, COLS = 33, ROWS = 15, HUD_H = 40;
  const X0 = (W - COLS * CELL) / 2, Y0 = HUD_H + (H - HUD_H - ROWS * CELL) / 2;
  const SPEEDS = { slow: 170, normal: 125, fast: 85 };
  const SPEED_KEYS = ['slow', 'normal', 'fast'];

  const DIRS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let running = false, animId = null, lastTs = 0, now = 0;
  let state = 'ready';              // 'ready' | 'playing' | 'dead' | 'win'
  let paused = false;
  let segs = [], prevPos = [], dir = { x: 1, y: 0 }, queue = [];
  let apple = { x: 0, y: 0, born: 0 };
  let score = 0, best = 0, acc = 0, deadAt = 0;
  let speed = 'normal', walls = true;
  let particles = [], rings = [];
  let gpDir = null, gpXWas = false;
  let touchStart = null;

  // ── Helpers ────────────────────────────────────────────────────────────────
  const rrect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };
  const bestKey = () => 'arcade_snake_best_' + speed + '_' + (walls ? 'walls' : 'wrap');
  function loadBest() { try { return parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0; } catch (e) { return 0; } }
  function saveBest() { try { localStorage.setItem(bestKey(), String(best)); } catch (e) {} }

  // ── Sound ──────────────────────────────────────────────────────────────────
  let actx = null;
  function tone(freq, dur, type = 'square', vol = 0.03, endFreq = null) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ── Game logic ─────────────────────────────────────────────────────────────
  function placeApple() {
    const taken = new Set(segs.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!taken.has(x + ',' + y)) free.push({ x, y });
    if (!free.length) return false;
    const c = free[Math.floor(Math.random() * free.length)];
    apple = { x: c.x, y: c.y, born: now };
    return true;
  }

  function reset() {
    const cy = Math.floor(ROWS / 2);
    segs = [{ x: 10, y: cy }, { x: 9, y: cy }, { x: 8, y: cy }];
    prevPos = segs.map(s => ({ ...s }));
    dir = { x: 1, y: 0 }; queue = [];
    apple = { x: 24, y: cy, born: now };
    score = 0; best = loadBest();
    state = 'ready'; paused = false; acc = 0; deadAt = 0; particles = []; rings = [];
  }

  function die() {
    state = 'dead'; deadAt = now;
    prevPos = segs.map(s => ({ ...s }));
    tone(220, 0.35, 'sawtooth', 0.04, 55);
    const h = segs[0];
    for (let k = 0; k < 26; k++) {
      const a = Math.random() * TAU, sp = 0.8 + Math.random() * 3.2;
      particles.push({ x: X0 + (h.x + 0.5) * CELL, y: Y0 + (h.y + 0.5) * CELL, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 36, max: 36, size: 3 + Math.random() * 3, color: Math.random() < 0.5 ? '#ff5566' : '#78ff5a' });
    }
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const head = segs[0];
    let nx = head.x + dir.x, ny = head.y + dir.y;
    if (walls) {
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { die(); return; }
    } else {
      nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS;
    }
    const ate = nx === apple.x && ny === apple.y;
    const limit = ate ? segs.length : segs.length - 1;     // the tail moves away, so it is safe to step onto
    for (let i = 0; i < limit; i++) if (segs[i].x === nx && segs[i].y === ny) { die(); return; }

    const old = segs;
    segs = [{ x: nx, y: ny }, ...old];
    if (!ate) segs.pop();
    prevPos = segs.map((s, i) => ({ ...(i === 0 ? old[0] : old[i - 1]) }));

    if (ate) {
      score++;
      if (score > best) { best = score; saveBest(); }
      tone(520, 0.09, 'square', 0.03, 820);
      rings.push({ x: X0 + (apple.x + 0.5) * CELL, y: Y0 + (apple.y + 0.5) * CELL, life: 22 });
      for (let k = 0; k < 14; k++) {
        const a = Math.random() * TAU, s = 0.8 + Math.random() * 2.8;
        particles.push({ x: X0 + (apple.x + 0.5) * CELL, y: Y0 + (apple.y + 0.5) * CELL, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 28, max: 28, size: 2 + Math.random() * 3, color: Math.random() < 0.5 ? '#ff44cc' : '#ffffff' });
      }
      if (!placeApple()) { state = 'win'; deadAt = now; tone(660, 0.4, 'triangle', 0.04, 1320); }
    }
  }

  function pushDir(d) {
    if (state === 'ready') {
      state = 'playing'; acc = 0;
      if (d.x === -1) return;                               // can't start by going backwards: just go right
      if (d.x === 1) return;                                // already heading right
      queue.push(d); return;
    }
    if (state !== 'playing' || paused) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) return;
    if (queue.length < 2) queue.push(d);
  }

  // ── Drawing (neon arcade look) ─────────────────────────────────────────────
  const STARS = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + 0.3, t: Math.random() * TAU }));
  const bodyColor = (i, n) => `hsl(${125 + (i / Math.max(1, n - 1)) * 85}, 100%, 62%)`;   // green head -> blue tail

  function drawBoard() {
    ctx.fillStyle = '#030010'; ctx.fillRect(0, 0, W, H);
    STARS.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.12 + 0.12 * Math.sin(now * 0.002 + s.t)})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); });
    ctx.fillStyle = '#060222'; ctx.fillRect(X0, Y0, COLS * CELL, ROWS * CELL);
    ctx.strokeStyle = 'rgba(0,234,255,0.07)'; ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(X0 + x * CELL, Y0); ctx.lineTo(X0 + x * CELL, Y0 + ROWS * CELL); ctx.stroke(); }
    for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(X0, Y0 + y * CELL); ctx.lineTo(X0 + COLS * CELL, Y0 + y * CELL); ctx.stroke(); }
    // border: solid cyan = walls hurt, dashed purple = wrap-around
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = walls ? '#00eaff' : '#aa66ff'; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 14;
    if (!walls) ctx.setLineDash([10, 8]);
    ctx.strokeRect(X0 + 1, Y0 + 1, COLS * CELL - 2, ROWS * CELL - 2);
    ctx.restore();
  }

  function drawApple() {
    const k0 = Math.max(0, Math.min(1, (now - apple.born) / 260));
    const k = k0 < 1 ? 1 - Math.pow(1 - k0, 3) : 1;
    const cx = X0 + (apple.x + 0.5) * CELL, cy = Y0 + (apple.y + 0.5) * CELL;
    const pulse = 1 + Math.sin(now * 0.008) * 0.12;
    ctx.save();
    ctx.translate(cx, cy);
    // rotating diamond "energy crystal"
    ctx.shadowColor = '#ff44cc'; ctx.shadowBlur = 18;
    ctx.rotate(now * 0.002);
    const r = CELL * 0.36 * k * pulse;
    ctx.fillStyle = '#ff44cc';
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;

  <script>
// ===== pinball.js =====
// Pinball — neon pinball table with flippers, bumpers, slingshots and a plunger
// Left flipper: A / Z / ← / Left Shift      Right flipper: D / M / → / Right Shift
// Hold SPACE (or ↓) to pull the plunger back, let go to launch.  3 balls.
const Pinball = (() => {
  const W = 800, H = 400, TAU = Math.PI * 2;

  // Table is drawn at (TX, TY) on the canvas; all table coordinates below are local to it.
  const TX = 250, TY = 4, TW = 300, TH = 392;
  const R = 7;                                   // ball radius
  const SUB = 4, HS = 1 / SUB;                   // physics sub-steps per frame
  const GRAV = 0.22, MAX_V = 17;
  const START_BALLS = 3;

  const LANE_X = 284, LANE_REST_Y = 369;
  const FLIP_LEN = 52, FLIP_R = 5, FLIP_SPEED = 0.19;   // radians per frame
  const FLIPS = [
    { px: 76,  py: 350, rest: 0.5,  up: -0.45, dir: 1,  ang: 0.5,  w: 0, keysDown: false },   // left
    { px: 192, py: 350, rest: Math.PI - 0.5, up: Math.PI + 0.45, dir: -1, ang: Math.PI - 0.5, w: 0, keysDown: false }, // right
  ];

  // ── Table geometry ─────────────────────────────────────────────────────────
  const segs = [];          // {ax,ay,bx,by,e,kick,score,hit}
  function seg(ax, ay, bx, by, o = {}) { segs.push({ ax, ay, bx, by, e: o.e ?? 0.45, kick: o.kick || 0, score: o.score || 0, color: o.color || '#00eaff', hide: !!o.hide, hit: 0 }); }

    seg(150 + 150 * Math.cos(a1), 150 + 150 * Math.sin(a1), 150 + 150 * Math.cos(a2), 150 + 150 * Math.sin(a2), { e: 0.35 });
  }
  seg(0, 150, 0, 300);                 // left wall
  seg(300, 150, 300, 376);             // right wall (outside the lane)
  seg(268, 160, 268, 376);             // lane divider
  seg(268, 376, 300, 376, { e: 0.2 }); // plunger floor
  seg(0, 300, 76, 350);                // left guide into the flipper
  seg(268, 300, 192, 350);             // right guide into the flipper
  // slingshots (triangles above the flippers)
  seg(36, 248, 66, 296, { kick: 5.5, e: 0.7, score: 10, color: '#ff6600' });
  seg(36, 248, 36, 296, { color: '#ff6600' });
  seg(36, 296, 66, 296, { color: '#ff6600' });
  seg(232, 248, 202, 296, { kick: 5.5, e: 0.7, score: 10, color: '#ff6600' });
  seg(232, 248, 232, 296, { color: '#ff6600' });
  seg(232, 296, 202, 296, { color: '#ff6600' });

  const bumpers = [
    { x: 82, y: 112, r: 17, score: 100, color: '#ff44cc', hit: 0 },
    { x: 186, y: 112, r: 17, score: 100, color: '#00eaff', hit: 0 },
    { x: 134, y: 168, r: 17, score: 100, color: '#ffd24a', hit: 0 },
    { x: 56, y: 205, r: 6, score: 25, color: '#78d94c', hit: 0 },
    { x: 212, y: 205, r: 6, score: 25, color: '#78d94c', hit: 0 },

  // ── State ──────────────────────────────────────────────────────────────────

  let state = 'launch';                // 'launch' | 'play' | 'drain' | 'over'
  let ball = { x: LANE_X, y: LANE_REST_Y, vx: 0, vy: 0, trail: [] };
  let score = 0, best = 0, ballsLeft = START_BALLS, extraAwarded = 0;
  let power = 0, charging = false, drainT = 0, overAt = 0, stallT = 0;
  let particles = [], popups = [], msg = '', msgT = 0;
  let gpXWas = false;
  const keys = {};
  const STARS = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, t: Math.random() * TAU }));

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function loadBest() { try { return parseInt(localStorage.getItem('arcade_pinball_best') || '0', 10) || 0; } catch (e) { return 0; } }

  // ── Sound ──────────────────────────────────────────────────────────────────
  let actx = null;

  // ── Game flow ──────────────────────────────────────────────────────────────
  function newBall() {
    ball = { x: LANE_X, y: LANE_REST_Y, vx: 0, vy: 0, trail: [] };
    state = 'launch'; power = 0; charging = false; stallT = 0;
  }

    particles = []; popups = []; msg = ''; msgT = 0;

  }

  function addScore(n, x, y) {
    score += n;

    if (score > best) best = score;
  }
  function showMsg(t) { msg = t; msgT = 100; }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 0.6 + Math.random() * 2.4;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, max: 22, color });
    }

  function launch() {
    if (state !== 'launch') return;
    ball.y = LANE_REST_Y; ball.vx = 0; ball.vy = -(12 + power * 5);

  function drain() {
    ballsLeft--;
    tone(300, 0.5, 'sawtooth', 0.04, 60);
